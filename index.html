  <style>

<body>

<div class="main">

  <div class="map-panel">

<script>
let allData = null;
let geoData = null;
let months = [];
let currentIdx = 0;
let playInterval = null;
let geojsonLayer = null;
let monthlyByTown = {};
let monthlyByCounty = {};
let monthlyTotals = {};
let yearlyTotals = {};
let countyChart = null;
let hasFitBounds = false;

// Town names in oil_data.json are already normalized to official GeoJSON town
// names by oil_scraper.py (normalize_geo_town). This map is only a safety net
// for a stale/cached oil_data.json produced before that change. Keep it in sync
// with GEO_TOWN_NAME_MAP in oil_scraper.py.
const TOWN_NAME_MAP = {
  // spelling variants
  "St. Johnsbury": "Saint Johnsbury",
  "Hinesburgh": "Hinesburg",
  "Betlin": "Berlin",
  "Enosburg": "Enosburgh",
  "Enosburg Falls": "Enosburgh",
  "Enosburgh Falls": "Enosburgh",

  // villages that roll up to their official town
  "Montgomery Center": "Montgomery",
  "Craftsbury Common": "Craftsbury",
  "Jericho Center": "Jericho",
  "Eden Mills": "Eden",
  "Randolph Center": "Randolph",
  "South Pomfret": "Pomfret",
  "South Royalton": "Royalton",
  "Manchester Center": "Manchester",
  "Bolton Valley": "Bolton",
  "West Dover": "Dover",
  "Quechee": "Hartford",
  "Morrisville": "Morristown",
  "West Glover": "Glover",
  "Jeffersonville": "Cambridge",
  "North Troy": "Troy",
  "Island Pond": "Brighton",
  "Wells River": "Newbury",
  "Lyndonville": "Lyndon",
  "Orleans": "Barton",
  "East Burke": "Burke",
  "Jacksonville": "Whitingham",
  "Lower Waterford": "Waterford",
  "Bellows Falls": "Rockingham",
  "Gilman": "Lunenburg",
  "Perkinsville": "Weathersfield",
  "Belmont": "Mount Holly",

  // villages inside Barre Town, not Barre City
  "East Barre": "Barre Town",
  "Graniteville": "Barre Town",
  "S. Barre": "Barre Town",

  // Vermont splits these into two separate polygons; default to the City.
  "Barre": "Barre City",
  "Newport": "Newport City",
  "Rutland": "Rutland City",
  "St. Albans": "Saint Albans City",
  "St Albans": "Saint Albans City",
  "St. Albans City": "Saint Albans City"
};

function normalizeTown(name) {
  if (!name) return "";
  return TOWN_NAME_MAP[name] || name;
}

// The green ramp, palest first. These are the same seven greens the dashboard
// has always used — only the thresholds are calculated now, not the colors.
const GREEN_RAMP = [
  "#e5ebe3", "#c6d0c1", "#9aaa91", "#6f8f61",
  "#4b7f42", "#2d6e2d", "#1a4a1a"
];

const NO_DATA_COLOR = "#ffffff";

// The original hand-picked thresholds. Kept so the scale can be switched back
// without rewriting anything — see SCALE_MODE below.
const FIXED_BREAKS = [
  { min: 9000, color: "#1a4a1a", label: "9,000+" },
  { min: 3000, color: "#2d6e2d", label: "3,000–9,000" },
  { min: 1500, color: "#4b7f42", label: "1,500–3,000" },
  { min: 750,  color: "#6f8f61", label: "750–1,500" },
  { min: 375,  color: "#9aaa91", label: "375–750" },
  { min: 175,  color: "#c6d0c1", label: "175–375" },
  { min: 10,   color: "#e5ebe3", label: "10–175" }
];

// "dynamic" = rescale to the towns currently on screen.
// "fixed"   = always use FIXED_BREAKS above.
// A future UI toggle only needs to flip this value and re-render.
const SCALE_MODE = "dynamic";

// Round up to a readable number: 1, 2, 2.5 or 5 times a power of ten.
// Turns a raw quantile like 1,847 into 2,000 so the legend reads cleanly.
function niceNumber(x) {
  if (x <= 0) return 0;
  const exp = Math.floor(Math.log10(x));
  const base = Math.pow(10, exp);
  const frac = x / base;

  for (const step of [1, 2, 2.5, 5]) {
    if (frac <= step) return step * base;
  }
  return 10 * base;
}

/**
 * Build the color scale for the towns currently being displayed.
 *
 * Uses quantiles rather than equal-width steps because the data is very
 * lop-sided: in All Time view the biggest town has ~433,000 gallons while the
 * median town has ~5,000. Equal-width bins would drop almost every town into
 * the palest color and leave one dark outlier. Quantiles spread the towns
 * evenly across the ramp, so the map actually shows differences.
 *
 * Returns bins ordered darkest-first, each { min, color, label }.
 * Returns [] when there is nothing to show.
 */
function computeBins(values) {
  if (SCALE_MODE === "fixed") return FIXED_BREAKS;

  const positive = values.filter(v => v > 0).sort((a, b) => a - b);
  if (!positive.length) return [];

  const binCount = GREEN_RAMP.length;

  // Cut points at the 1/7 ... 6/7 quantiles, rounded to readable numbers.
  // Rounding can make two cuts land on the same value (common in a sparse
  // month); dropping the duplicates just means fewer, wider bins, which is
  // the honest result rather than a bug.
  const cuts = [];
  for (let i = 1; i < binCount; i++) {
    const q = positive[Math.min(
      Math.floor((i / binCount) * positive.length),
      positive.length - 1
    )];
    const cut = niceNumber(q);
    if (cut > 0 && (cuts.length === 0 || cut > cuts[cuts.length - 1])) {
      cuts.push(cut);
    }
  }

  // Lower edge of every bin: the first starts just above zero.
  const edges = [1, ...cuts];

  // Spread the chosen colors across the WHOLE ramp rather than taking a slice
  // off one end. When rounding leaves only 5 bins, the lightest bin must still
  // be the palest green — otherwise a quiet month renders uniformly dark.
  const colors = edges.map((_, i) =>
    edges.length === 1
      ? GREEN_RAMP[GREEN_RAMP.length - 1]
      : GREEN_RAMP[Math.round(i * (GREEN_RAMP.length - 1) / (edges.length - 1))]
  );

  const bins = edges.map((min, i) => {
    const next = edges[i + 1];
    return {
      min,
      color: colors[i],
      label: next
        ? `${formatNumber(min)}–${formatNumber(next - 1)}`
        : `${formatNumber(min)}+`
    };
  });

  // Darkest first, so getColor can return on the first threshold met.
  return bins.reverse();
}

function getColor(gallons, bins) {
  for (const b of bins) {
    if (gallons >= b.min) return b.color;
  }
  return NO_DATA_COLOR;
}

function formatNumber(n) {
  return Number(n || 0).toLocaleString();
}

function getFeatureTownName(feature) {
  return feature.properties.TOWNNAMEMC ||
         feature.properties.TOWNNAME ||
         feature.properties.town ||
         feature.properties.NAME ||
         "";
}

const map = L.map("map", {
  center: [44.0, -72.7],
  zoom: 8,
  // Leaflet snaps to whole zoom levels by default, which made fitBounds round
  // down and leave Vermont floating in a sea of neighboring states. Quarter
  // steps let it fill the panel properly.
  zoomSnap: 0.25,
  zoomDelta: 0.5
});

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution: "© OpenStreetMap contributors"
  }
).addTo(map);

function buildLegend(bins) {
  const container = document.getElementById("legend-items");

  if (!bins || !bins.length) {
    container.innerHTML = `
      <div class="legend-item">
        <div class="legend-swatch" style="background:${NO_DATA_COLOR}"></div>
        <span>No data for this period</span>
      </div>
    `;
    return;
  }

  container.innerHTML = bins.map(b => `
    <div class="legend-item">
      <div class="legend-swatch" style="background:${b.color}"></div>
      <span>${b.label}</span>
    </div>
  `).join("") + `
    <div class="legend-item">
      <div class="legend-swatch" style="background:${NO_DATA_COLOR}"></div>
      <span>0</span>
    </div>
  `;
}

async function loadAll() {
  // The nightly job rewrites these same URLs, so without a changing query
  // string a returning visitor can be served a stale cached copy.
  const cacheBust = Date.now();
  const [dataResp, geoResp] = await Promise.all([
    fetch(`oil_data.json?v=${cacheBust}`),
    fetch(`vermont_towns.geojson?v=${cacheBust}`)
  ]);

  allData = await dataResp.json();
  geoData = await geoResp.json();

  allData.monthly_by_town.forEach(row => {
    const month = row.month;
    // Prefer the pre-normalized geo_town; fall back to city for older JSON.
    const town = normalizeTown(row.geo_town || row.city);

    if (!monthlyByTown[month]) monthlyByTown[month] = {};
    monthlyByTown[month][town] = (monthlyByTown[month][town] || 0) + Number(row.gallons || 0);
  });

  allData.monthly_by_county.forEach(row => {
    const month = row.month;

    if (!monthlyByCounty[month]) monthlyByCounty[month] = {};
    monthlyByCounty[month][row.county] = (monthlyByCounty[month][row.county] || 0) + Number(row.gallons || 0);
  });

  allData.yearly_totals.forEach(row => {
    yearlyTotals[row.year] = Number(row.gallons || 0);
  });

  // Added in Phase 2. Guarded so an older cached oil_data.json still works.
  (allData.monthly_totals || []).forEach(row => {
    monthlyTotals[row.month] = Number(row.gallons || 0);
  });

  months = Object.keys(monthlyByTown).sort();

  const slider = document.getElementById("month-slider");
  slider.max = Math.max(months.length - 1, 0);
  slider.value = Math.max(months.length - 1, 0);
  currentIdx = Math.max(months.length - 1, 0);

  document.getElementById("stat-alltime").textContent = formatNumber(allData.all_time_total);
  document.getElementById("stat-year").textContent = formatNumber(allData.current_year_total);
  document.getElementById("stat-customers").textContent = formatNumber(allData.customer_count);
  document.getElementById("last-updated").textContent =
    "Updated: " + new Date(allData.last_updated).toLocaleString();

  renderProjection(allData.projection);
  renderActiveCustomers(allData.active_customer_count);

  // Point the nav at real values from the data rather than hardcoding them.
  const latestYear = months.length ? months[months.length - 1].slice(0, 4) : "";
  if (latestYear) {
    document.getElementById("nav-year").href = "year.html?year=" + latestYear;
  }
  const firstRegion = (allData.region_names || [])[0];
  if (firstRegion) {
    document.getElementById("nav-region").href =
      "region.html?region=" + encodeURIComponent(firstRegion);
  }

  renderMap(currentIdx);
  buildCharts();
}

/**
 * Secondary line inside the "This Year" card: where the year is on pace to
 * land, and how that compares with the previous full year.
 *
 * The projection is computed in oil_scraper.py against the PRORATED previous
 * year and anchored to the latest collection date, so a scrape that has not
 * run for a few days does not drag it down.
 */
function renderProjection(projection) {
  const el = document.getElementById("stat-projection");
  if (!el) return;

  if (!projection || !Number.isFinite(Number(projection.projected_current_year))) {
    el.textContent = "Projection unavailable";
    return;
  }

  const pct = Number(projection.percent_vs_previous_year);
  const arrow = pct >= 0 ? "+" : "";
  const cls = pct >= 0 ? "up" : "down";

  el.innerHTML =
    "Projected: " + formatNumber(projection.projected_current_year) +
    ` <span class="${cls}">(${arrow}${(pct * 100).toFixed(1)}% vs ` +
    `${projection.previous_year})</span>`;
}

/**
 * Secondary line inside the "Customers" card.
 * Source-site status only — never inferred from how recently a customer had a
 * pickup.
 */
function renderActiveCustomers(count) {
  const el = document.getElementById("stat-active");
  if (!el) return;

  // Note the explicit null/undefined test: Number(null) is 0, which is finite,
  // so a plain isFinite check would render a missing count as "Active: 0".
  el.textContent = (count === null || count === undefined || !Number.isFinite(Number(count)))
    ? "Active status pending next scrape"
    : "Active: " + formatNumber(count);
}

/**
 * Which months does the selected mode cover, given the slider position?
 * Everything downstream works from this one list, so the map, the stat card,
 * the town list and the county chart can never disagree about the period.
 */
function getMonthsForMode(mode, idx) {
  if (!months.length) return [];

  const selected = months[idx];
  const year = selected.slice(0, 4);

  switch (mode) {
    case "month":
      return [selected];

    case "ytd":               // January through the selected month, same year
      return months.filter(m => m.slice(0, 4) === year && m <= selected);

    case "year":              // every month of the selected year
      return months.filter(m => m.slice(0, 4) === year);

    case "alltime_todate":    // the very beginning through the selected month
      return months.filter(m => m <= selected);

    case "alltime":
      return months.slice();

    default:
      return [selected];
  }
}

/** Total gallons per town across a list of "YYYY-MM" months. */
function sumTownMonths(monthList) {
  const totals = {};

  monthList.forEach(m => {
    Object.entries(monthlyByTown[m] || {}).forEach(([town, gal]) => {
      totals[town] = (totals[town] || 0) + gal;
    });
  });

  return totals;
}

/** Total gallons per county across a list of months. */
function sumCountyMonths(monthList) {
  const totals = {};

  monthList.forEach(m => {
    Object.entries(monthlyByCounty[m] || {}).forEach(([county, gal]) => {
      totals[county] = (totals[county] || 0) + gal;
    });
  });

  return totals;
}

/**
 * Grand total for the period, including out-of-state gallons.
 *
 * Prefers monthly_totals because that is the whole-business figure and matches
 * the basis of the All-Time card. The town sum below is a fallback and is
 * slightly lower, since towns outside Vermont are not on the map.
 */
function periodTotal(monthList) {
  if (monthlyTotals && Object.keys(monthlyTotals).length) {
    return monthList.reduce((sum, m) => sum + (Number(monthlyTotals[m]) || 0), 0);
  }

  return monthList.reduce(
    (sum, m) => sum + Object.values(monthlyByTown[m] || {}).reduce((a, b) => a + b, 0),
    0
  );
}

/** Human-readable description of what the map is currently showing. */
function periodLabel(mode, idx) {
  if (!months.length) return "—";

  const selected = months[idx];
  const [year, mo] = selected.split("-");
  const longMonth = new Date(year, Number(mo) - 1)
    .toLocaleString("default", { month: "long", year: "numeric" });
  const shortMonth = new Date(year, Number(mo) - 1)
    .toLocaleString("default", { month: "short" });

  switch (mode) {
    case "month":
      return longMonth;
    case "ytd":
      return mo === "01" ? `Jan ${year}` : `Jan–${shortMonth} ${year}`;
    case "year":
      return `${year}`;
    case "alltime_todate":
      return `Through ${longMonth}`;
    case "alltime":
      return `All Time (${months[0].slice(0, 4)}–${months[months.length - 1].slice(0, 4)})`;
    default:
      return longMonth;
  }
}

function renderMap(idx) {
  if (!months.length || !geoData) return;

  const mode = document.getElementById("view-mode").value;
  const periodMonths = getMonthsForMode(mode, idx);
  const townGallons = sumTownMonths(periodMonths);

  document.getElementById("month-label").textContent = periodLabel(mode, idx);
  document.getElementById("stat-month").textContent =
    formatNumber(periodTotal(periodMonths));

  // Rescale the colors to whatever is on screen right now, then rebuild the
  // legend from the same bins so the two can never drift apart.
  const bins = computeBins(Object.values(townGallons));
  buildLegend(bins);

  if (geojsonLayer) {
    map.removeLayer(geojsonLayer);
  }

  geojsonLayer = L.geoJSON(geoData, {
    style: feature => {
      const name = normalizeTown(getFeatureTownName(feature));
      const gallons = townGallons[name] || 0;

      // Towns with data are filled solidly enough to read as a heatmap; empty
      // towns stay light so the basemap's roads, water and labels show through
      // instead of the map turning into a white block.
      return {
        fillColor: getColor(gallons, bins),
        fillOpacity: gallons > 0 ? 0.85 : 0.15,
        color: "#111",
        weight: 0.7
      };
    },

    onEachFeature: (feature, layer) => {
      const rawName = getFeatureTownName(feature);
      const name = normalizeTown(rawName);
      const gallons = townGallons[name] || 0;

      layer.bindTooltip(`
        <div class="tooltip-box">
          <strong>${rawName}</strong><br>
          ${formatNumber(gallons)} gal
        </div>
      `, { sticky: true });

      layer.on("mouseover", () => {
        layer.setStyle({
          weight: 2,
          color: "#ffffff"
        });
      });

      layer.on("mouseout", () => {
        geojsonLayer.resetStyle(layer);
      });

      // town.html is built in the next phase; the link pattern is ready now.
      layer.on("click", () => {
        window.location.href = "town.html?town=" + encodeURIComponent(name);
      });
    }
  }).addTo(map);

  // Frame Vermont once. Re-fitting on every render would throw away any pan or
  // zoom the moment the slider moved.
  if (!hasFitBounds) {
    // Leaflet caches the container size. This first render happens while the
    // page is still settling, so without re-measuring it fits Vermont to a
    // stale (taller) box and the state ends up overflowing the panel.
    map.invalidateSize();

    const bounds = geojsonLayer.getBounds();
    // Extra bottom padding keeps southern Vermont clear of the floating
    // time-controls card, which sits over the lower middle of the map.
    // animate:false matters. An animated fit applies its new zoom over the next
    // few frames, so map.getZoom() below would still report the OLD zoom and
    // setMinZoom would clamp the animation right back to where it started.
    map.fitBounds(bounds, {
      paddingTopLeft: [12, 12],
      // Tuned by measurement. Larger values push the fit down a whole zoom
      // step, which shrinks Vermont and shows more of the neighboring states
      // without actually clearing the controls card.
      paddingBottomRight: [12, 110],
      animate: false
    });
    map.setMaxBounds(bounds.pad(0.35));
    map.setMinZoom(map.getZoom());
    hasFitBounds = true;
  }

  updateSidePanels(idx, townGallons, periodMonths);
}

function updateSidePanels(idx, townGallons, periodMonths) {
  const sortedTowns = Object.entries(townGallons)
    .filter(([, gal]) => gal > 0)
    .sort(([, a], [, b]) => b - a)
    .slice(0, 30);

  const maxGal = sortedTowns[0]?.[1] || 1;

  const list = document.getElementById("town-list");

  list.innerHTML = sortedTowns.map(([town, gal]) => `
    <li class="town-item">
      <div class="town-row">
        <span>${town}</span>
        <span class="town-gal">${formatNumber(gal)}</span>
      </div>
      <div class="town-bar" style="width:${(gal / maxGal * 100).toFixed(1)}%"></div>
    </li>
  `).join("");

  // The county chart follows the same period as the map, so the two panels
  // always describe the same slice of time.
  updateCountyChart(sumCountyMonths(periodMonths));
}

function buildCharts() {
  const monthLabels = months.map(m => {
    const [y, mo] = m.split("-");
    return new Date(y, Number(mo) - 1).toLocaleString("default", {
      month: "short",
      year: "2-digit"
    });
  });

  const monthTotals = months.map(m =>
    Object.values(monthlyByTown[m] || {}).reduce((a, b) => a + b, 0)
  );

  new Chart(document.getElementById("chart-monthly"), {
    type: "line",
    data: {
      labels: monthLabels,
      datasets: [{
        data: monthTotals,
        borderColor: "#3fb950",
        backgroundColor: "rgba(63, 185, 80, 0.15)",
        borderWidth: 2,
        pointRadius: 0,
        fill: true,
        tension: 0.25
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#8b949e", maxTicksLimit: 8 }, grid: { color: "#21262d" } },
        y: { ticks: { color: "#8b949e" }, grid: { color: "#21262d" } }
      }
    }
  });

  const years = Object.keys(yearlyTotals).sort();

  new Chart(document.getElementById("chart-yearly"), {
    type: "bar",
    data: {
      labels: years,
      datasets: [{
        data: years.map(y => yearlyTotals[y]),
        backgroundColor: "#3fb950"
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#8b949e" }, grid: { color: "#21262d" } },
        y: { ticks: { color: "#8b949e" }, grid: { color: "#21262d" } }
      },
      // Clicking a bar opens that year's detail page. Data, colors and scales
      // above are untouched.
      onClick: (evt, elements) => {
        if (elements.length) {
          window.location.href = "year.html?year=" + years[elements[0].index];
        }
      },
      onHover: (evt, elements) => {
        evt.native.target.style.cursor = elements.length ? "pointer" : "default";
      }
    }
  });
}

function updateCountyChart(countyData) {
  const sorted = Object.entries(countyData)
    .filter(([county]) => county !== "Unknown")
    .sort(([, a], [, b]) => b - a);

  if (countyChart) {
    countyChart.destroy();
  }

  countyChart = new Chart(document.getElementById("chart-counties"), {
    type: "bar",
    data: {
      labels: sorted.map(([county]) => county),
      datasets: [{
        data: sorted.map(([, gal]) => gal),
        backgroundColor: "#3fb950"
      }]
    },
    options: {
      indexAxis: "y",
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#8b949e" }, grid: { color: "#21262d" } },
        y: { ticks: { color: "#8b949e" }, grid: { color: "#21262d" } }
      }
    }
  });
}

document.getElementById("month-slider").addEventListener("input", function() {
  currentIdx = parseInt(this.value);
  renderMap(currentIdx);
});

document.getElementById("btn-prev").addEventListener("click", function() {
  if (currentIdx > 0) {
    currentIdx--;
    document.getElementById("month-slider").value = currentIdx;
    renderMap(currentIdx);
  }
});

document.getElementById("btn-next").addEventListener("click", function() {
  if (currentIdx < months.length - 1) {
    currentIdx++;
    document.getElementById("month-slider").value = currentIdx;
    renderMap(currentIdx);
  }
});

document.getElementById("btn-play").addEventListener("click", function() {
  if (playInterval) {
    clearInterval(playInterval);
    playInterval = null;
    this.textContent = "▶ Play";
    this.classList.remove("active");
  } else {
    this.textContent = "⏸ Pause";
    this.classList.add("active");

    playInterval = setInterval(() => {
      currentIdx = currentIdx >= months.length - 1 ? 0 : currentIdx + 1;
      document.getElementById("month-slider").value = currentIdx;
      renderMap(currentIdx);
    }, 700);
  }
});

document.getElementById("view-mode").addEventListener("change", function() {
  renderMap(currentIdx);
});

function switchTab(name) {
  document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(tab => tab.classList.remove("active"));

  document.querySelector(`.tab[onclick="switchTab('${name}')"]`).classList.add("active");
  document.getElementById(`tab-${name}`).classList.add("active");
}

loadAll();
</script>
