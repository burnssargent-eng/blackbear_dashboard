<script>
/*
 * My Route (shadow): the source site's "My Route" and "Today's Routes" in one
 * page. Every route is listed collapsed; opening one shows its stops, which
 * can be reordered (hold a stop a fifth of a second and drag it), opened on
 * their customer page, removed (with Undo), or added to straight from a search. A route made with
 * Assign Routes' "New Route…" arrives as ?new=<id>: it opens first, its name ready to type.
 * The driver view lists the route's tasks (not pickups) at the top, ticked as they are done.
 * "Set as My Route" opens the driver view
 * for entering gallons. Everything is saved in the shadow copy, in this
 * browser only.
 */

const SOURCE_CUSTOMER_URL = "https://jammal28.dreamhosters.com/tracking/customer.php?id=";

let data = null, store = null, routeList = [];
let openRoutes = new Set();          // route ids expanded in the list
let addSearch = {};                  // route id -> text in its Add stop box
let lastMoved = null;                // { route, i } of the stop just dragged, flashed once
let removed = null;                  // { route, i, stop, timer }: the last stop removed, until Undo times out
let naming = null;                   // { route, text }: a shadow-made route whose name box is open
let madeNow = null;                  // the route just made with "New Route…": listed first on this visit

const UNDO_MS = 6000;

/* ── Route list ─────────────────────────────────────────── */

/**
 * "(~87 gal / 300) [28]" for a stop. A shared barrel's second stop names the
 * first in the route list ("(shared w/ Three Penny…)", cut to fit: .ops-fig-more);
 * the collecting page just says "(shared)".
 */
function stopLabelHtml(l, sharedWith = null) {
  if (l.dupOf !== null) {
    return `<span class="ops-fig-more graytext" title="Same barrel as an earlier stop">(shared${
      sharedWith ? ` w/ ${escapeHtml(sharedWith)}` : ""})</span>`;
  }
  return stopFiguresHtml(l.row, l.capacity ?? l.stop.capacity);
}

/**
 * The route's stops, one line each in Assign Routes' format: number box | name
 * (cut short when long) | figures | › (the customer page). A stop moves by
 * holding and dragging it, or by typing a new place in its number box (25
 * places is too far to drag: Jim, 2026-11-19). Swiping a stop left to right
 * shows a red Remove strip under it; a swipe past 60% of the line removes it
 * (Undo for a few seconds), a shorter one slides back.
 */
function stopCardsHtml(routeId, lines) {
  const moved = lastMoved && lastMoved.route === routeId ? lastMoved.i : null;
  return lines.map((l, i) => `
    <div class="ops-swipe">
      <div class="ops-swipe-bg" aria-hidden="true">Remove</div>
      <div class="ops-card ops-stopA${i === moved ? " ops-flash" : ""}" data-drag="${i}" data-route="${routeId}">
        <input class="ops-card-num" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done"
          autocomplete="off" maxlength="2" value="${i + 1}" data-seq="${i}" data-route="${routeId}"
          aria-label="Stop number for ${escapeHtml(l.stop.name)}">
        <span class="ops-pick-name${l.stop.must_get ? " hotlist" : ""}">${escapeHtml(l.stop.name)}</span>
        <span class="ops-pick-figs">${stopLabelHtml(l, l.dupOf !== null ? lines[l.dupOf].stop.name : null)}</span>
        <a class="btn ops-plain-btn ops-pick-page" href="ops-customer.html?id=${l.stop.customer_id}&from=myroute"
          aria-label="Customer page for ${escapeHtml(l.stop.name)}">›</a>
      </div>
    </div>`).join("");
}

/** Up to 8 customers matching the route's Add stop box, not already on it. */
function addMatchesHtml(routeId) {
  const q = (addSearch[routeId] || "").trim().toLowerCase();
  if (!q) return "";
  const onRoute = new Set(storeStops(store, routeId).map(s => s.customer_id));
  const pool = [...data.snap.assign_list,
    ...store.added.map(c => ({ customer_id: c.customer_id, name: c.name, city: c.city }))];
  // A customer taken over by a new account is not offered (its new account is).
  const hits = pool.filter(c => !onRoute.has(c.customer_id) && !isReplaced(store, c.customer_id) &&
    matchesNameSearch(q, [c.name, c.city])).slice(0, 8);
  if (!hits.length) return `<div class="ops-muted mt-1">No match.</div>`;
  return `<div class="list-group mt-1">${hits.map(c => {
    const row = data.index.get(c.customer_id);
    const badge = row ? projectionBadgeText(row) : "";
    return `<button type="button" class="list-group-item list-group-item-action"
        data-act="add" data-route="${routeId}" data-id="${c.customer_id}">
      + ${escapeHtml(c.name || `#${c.customer_id}`)} <span class="ops-muted">${escapeHtml(townLabel((row && row.town) || c.city || ""))}</span>
      ${badge ? `<span class="ops-proj">${escapeHtml(badge)}</span>` : ""}</button>`;
  }).join("")}</div>`;
}

/**
 * The route's total and truck bar, once, under the last stop and just above
 * Add a stop, so it can be watched adding up:
 * "Total ~1,010 gal · 51% of Mack Daddy's 2,000 gal", with the bar beneath.
 */
function routeTotalHtml(totals, routeId) {
  const fill = truckFill(totals, store.trucks[routeId]);
  const warn = !fill ? "" : fill.pct > 100 ? " — over the tank"
    : fill.highPct > 100 ? " — could overflow at the high end" : "";
  return `<div class="ops-route-total${fill && fill.pct > 100 ? " text-danger" : ""}">
    <div><strong>Total ~${formatWhole(totals.projected)} gal</strong>${fill
      ? ` · ${Math.round(fill.pct)}% of ${escapeHtml(fill.truck.name)}'s ${formatNumber(fill.truck.capacity)} gal${warn}` : ""}</div>
    ${fill ? `<div class="progress"><div class="progress-bar ${
      fill.level === "full" ? "bg-danger" : fill.level === "due" ? "bg-warning" : "bg-success"}"
      style="width:${Math.min(100, fill.pct)}%"></div></div>` : ""}</div>`;
}

function routeHtml(route) {
  const stops = storeStops(store, route.route_id);
  const { totals, lines } = routeSummary(stops, data.index);
  // Today's collections replace their stops' projections in every figure shown.
  const live = { ...totals, ...liveRouteTotals(lines, store) };
  const id = route.route_id;
  const openTasks = tasksReady ? routeTasks(store, route.route_id).filter(t => !t.done_at).length : 0;
  const sum = `${stops.length} stop${stops.length === 1 ? "" : "s"}${openTasks
    ? ` · ${openTasks} task${openTasks === 1 ? "" : "s"}` : ""}${stops.length
    ? ` · ~${formatWhole(live.projected)} gal` : ""}`;
  // While its name is being typed the route is a plain box, not a <details>:
  // keys typed in a <summary> can fold it.
  const isNaming = naming && naming.route === id;
  return `
    ${isNaming ? `<div class="ops-route" data-route-box="${id}">
      <div class="ops-route-naming">
        <input class="form-control ops-route-name-input" data-name="${id}" value="${escapeHtml(naming.text)}"
          aria-label="Route name" enterkeyhint="done" autocomplete="off">
        <button type="button" class="btn btn-primary" data-act="name-done">Done</button>
      </div>
      <div class="ops-route-body"><div class="ops-route-sum mb-2">${sum}</div>`
    : `<details class="ops-route" data-route-box="${id}" ${openRoutes.has(id) ? "open" : ""}>
      <summary>
        <div class="ops-row-main">
          <span class="ops-route-name">${escapeHtml(route.name)}</span>
          <span class="ops-route-sum">${sum}</span>
        </div>
        ${store.trucks[id] ? `<span class="badge bg-secondary">${escapeHtml(store.trucks[id])}</span>` : ""}
        <span class="ops-row-chev" aria-hidden="true">›</span>
      </summary>
      <div class="ops-route-body">`}
        <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
          <select class="form-select form-select-sm w-auto" data-truck="${id}" aria-label="Truck">
            <option value="">Truck…</option>
            ${TRUCKS.map(t => `<option${t.name === store.trucks[id] ? " selected" : ""}>${escapeHtml(t.name)}</option>`).join("")}
          </select>
          <button type="button" class="btn btn-primary btn-sm" data-act="set" data-route="${id}"
            ${stops.length ? "" : "disabled"}>Set as My Route</button>
          ${tasksReady ? `<button type="button" class="btn btn-outline-primary btn-sm" data-act="taskadd-open" data-route="${id}">+ Task</button>` : ""}
          ${route.shadow && !isNaming ? `<button type="button" class="btn ops-plain-btn btn-sm" data-act="rename"
            data-route="${id}">Rename</button>` : ""}
        </div>
        ${route.aliases.length ? `<div class="ops-muted mb-2">Also called ${escapeHtml(route.aliases.join(", "))} on the source site.</div>` : ""}
        ${taskAdd && taskAdd.routeId === id ? `<div class="mb-2">${taskAddHtml()}</div>` : ""}
        ${listTasksHtml(id)}
        ${stops.length ? `
        <div class="ops-cards">${stopCardsHtml(id, lines)}</div>` : `<div class="ops-muted mb-2">No stops.</div>`}
        ${stops.length ? routeTotalHtml(live, id) : ""}
        <input type="search" class="form-control form-control-sm" data-add-search="${id}"
          placeholder="Add a stop: search name or town" value="${escapeHtml(addSearch[id] || "")}" autocomplete="off">
        <div data-add-results="${id}">${addMatchesHtml(id)}</div>
      </div>
    ${isNaming ? "</div>" : "</details>"}`;
}

function renderList() {
  // The route just made comes first, so it is in view as the page opens and after naming it;
  // then most stops first (Sarge, 2026-10-25), ties in the Assign dropdown's order.
  const first = r => (r.route_id === madeNow ? 0 : 1);
  const count = r => storeStops(store, r.route_id).length;
  const withStops = routeList.filter(count).sort((a, b) => first(a) - first(b) || count(b) - count(a));
  const empty = routeList.filter(r => !storeStops(store, r.route_id).length);
  const html = `
    <h2>My Route</h2>
    <div class="ops-muted mb-3">Open a route to see and change its stops; hold a stop to drag it or type a new number in its box, swipe it right to remove it; Set as My Route to start entering gallons.
      Projections as of ${escapeHtml(formatDate(data.projections.as_of))}.</div>
    <div class="ops-route-list">${withStops.map(routeHtml).join("")}</div>
    ${empty.length ? `<div class="ops-muted mt-3 mb-1">Routes with no stops</div>
      <div class="ops-route-list">${empty.map(routeHtml).join("")}</div>` : ""}
    ${removed ? `<div class="ops-undo" role="status">
      <span class="ops-undo-text">Removed ${escapeHtml(removed.stop.name)}</span>
      <button type="button" class="btn ops-undo-btn" data-act="unremove">Undo</button></div>` : footBarHtml()}`;
  document.getElementById("page").innerHTML = html;
  lastMoved = null;
  const box = naming && document.querySelector(`[data-name="${naming.route}"]`);
  if (box) { box.focus(); box.select(); }
}

/* ── Reordering stops by dragging ───────────────────────────
 * Hold a stop for a fifth of a second, then drag: the stop lifts and the
 * others slide out of the way. A press that moves more than 10px before the
 * hold is up was a scroll, and nothing happens. Phone tests (2026-10-22):
 * 0.2 s occasionally caught a scroll, 0.3-0.4 s did not; Sarge chose 0.25 s,
 * then 0.2 s after testing 0.15/0.2/0.25 on the one-line stops (2026-11-19).
 * Platform long-press is longer (iOS 0.5 s). Once lifted, touchmove is cancelled
 * so the page stops scrolling; near the top or bottom edge it auto-scrolls.
 * Mouse works the same way. */
const HOLD_MS = 200, SLOP = 10, EDGE = 70;
let press = null;

function startPress(row, x, y, swipeOnly = false) {
  press = { row, route: Number(row.dataset.route), i: Number(row.dataset.drag),
    x0: x, y0: y, x, y, active: false };
  press.fill = document.createElement("div");
  // On the number box a press can only swipe: holding it is for typing, not dragging.
  if (swipeOnly) return;
  // The fill sweeping across tells the finger to stay put.
  const b = row.getBoundingClientRect();
  press.fill.className = "ops-hold-fill";
  Object.assign(press.fill.style, { left: `${b.left + scrollX}px`, top: `${b.top + scrollY}px`,
    width: `${b.width}px`, height: `${b.height}px` });
  document.body.appendChild(press.fill);
  press.fill.getBoundingClientRect();   // start from scaleX(0)
  press.fill.classList.add("ops-sweep");
  press.timer = setTimeout(liftStop, HOLD_MS);
}

function cancelPress() {
  if (!press) return;
  clearTimeout(press.timer);
  cancelAnimationFrame(press.raf);
  press.fill.remove();
  press = null;
}

function liftStop() {
  const p = press;
  p.active = true;
  p.fill.remove();
  if (navigator.vibrate) navigator.vibrate(25);
  p.rows = [...p.row.closest(".ops-cards").querySelectorAll("[data-drag]")];
  // Each stop's slot: its height plus the gap to the next card.
  p.rects = p.rows.map((r, k) => {
    const b = r.getBoundingClientRect(), next = p.rows[k + 1];
    const h = next ? next.getBoundingClientRect().top - b.top : b.height + 5;
    return { top: b.top + scrollY, h };
  });
  p.grab = p.y + scrollY - p.rects[p.i].top;
  p.row.classList.add("ops-lifted");
  p.rows.forEach((r, k) => { if (k !== p.i) r.classList.add("ops-sliding"); });
  dragTo();
  edgeScroll();
}

/** Follow the finger; the stops between the old and new place slide by one row. */
function dragTo() {
  const p = press;
  const top = p.y + scrollY - p.grab;
  const centre = top + p.rects[p.i].h / 2;
  p.target = p.rects.filter((r, k) => k !== p.i && centre > r.top + r.h / 2).length;
  const h = p.rects[p.i].h;
  p.row.style.transform = `translateY(${top - p.rects[p.i].top}px)`;
  p.rows.forEach((r, k) => {
    if (k === p.i) return;
    const dy = p.i < k && k <= p.target ? -h : p.target <= k && k < p.i ? h : 0;
    r.style.transform = dy ? `translateY(${dy}px)` : "";
  });
}

function edgeScroll() {
  const p = press;
  if (!p || !p.active) return;
  const dy = p.y < EDGE ? -Math.ceil((EDGE - p.y) / 6)
    : p.y > innerHeight - EDGE ? Math.ceil((p.y - (innerHeight - EDGE)) / 6) : 0;
  if (dy) { scrollBy(0, dy); dragTo(); }
  p.raf = requestAnimationFrame(edgeScroll);
}

function dropStop() {
  const p = press;
  if (!p) return;
  if (p.swipe) { endSwipe(); return; }
  cancelPress();
  if (!p.active) return;
  if (p.target !== p.i) {
    store.routes[p.route] = moveStop(storeStops(store, p.route), p.i, p.target);
    saveStore(store);
    lastMoved = { route: p.route, i: p.target };
  }
  render();
}

/* ── Swipe right to remove ─────────────────────────────────
 * A press that moves right before the hold is up (more across than down) is a
 * swipe: the line follows the finger over a red Remove strip. Let go past 60%
 * of its width and the stop is removed (Undo for a few seconds); short of
 * that, it slides back. Up, down or left is a scroll, as before. */
const SWIPE_REMOVE = 0.6;

function startSwipe() {
  const p = press, dx = p.x - p.x0, dy = p.y - p.y0;
  if (dx <= 0 || dx < 2 * Math.abs(dy)) return false;
  clearTimeout(p.timer);
  p.fill.remove();
  p.swipe = true;
  p.width = p.row.getBoundingClientRect().width;
  p.row.parentElement.classList.add("ops-swiping");
  swipeTo();
  return true;
}

function swipeTo() {
  const p = press;
  const dx = Math.max(0, p.x - p.x0);
  p.row.style.transform = `translateX(${dx}px)`;
  p.row.parentElement.classList.toggle("ops-swipe-armed", dx > p.width * SWIPE_REMOVE);
}

function endSwipe() {
  const p = press;
  press = null;
  const row = p.row, wrap = row.parentElement;
  row.style.transition = "transform 150ms ease-out";
  if (Math.max(0, p.x - p.x0) > p.width * SWIPE_REMOVE) {
    row.style.transform = `translateX(${p.width}px)`;
    setTimeout(() => onAct({ dataset: { act: "remove", route: String(p.route), i: String(p.i) } }), 150);
  } else {
    row.style.transform = "";
    setTimeout(() => { row.style.transition = ""; wrap.classList.remove("ops-swiping", "ops-swipe-armed"); }, 160);
  }
}

function dragRow(e) {
  if (store.my || (e.target.closest("button, a, input, select") && !numBox(e))) return null;
  return e.target.closest("[data-drag]");
}

/** A press on a stop's number box: it can start a swipe (the box is where a right swipe begins), never a drag. */
function numBox(e) {
  return !!e.target.closest(".ops-card-num");
}

function wireDrag(page) {
  page.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) { cancelPress(); return; }
    const row = dragRow(e);
    if (row) startPress(row, e.touches[0].clientX, e.touches[0].clientY, numBox(e));
  }, { passive: true });
  document.addEventListener("touchmove", e => {
    if (!press) return;
    press.x = e.touches[0].clientX; press.y = e.touches[0].clientY;
    if (press.swipe) { e.preventDefault(); swipeTo(); return; }
    if (!press.active) {
      if (Math.hypot(press.x - press.x0, press.y - press.y0) > SLOP && !startSwipe()) cancelPress();   // a scroll
      return;
    }
    e.preventDefault();
    dragTo();
  }, { passive: false });
  document.addEventListener("touchend", dropStop);
  document.addEventListener("touchcancel", () => { if (press && press.active) dropStop(); else cancelPress(); });
  page.addEventListener("contextmenu", e => { if (e.target.closest("[data-drag]")) e.preventDefault(); });
  page.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    const row = dragRow(e);
    if (row && numBox(e)) startPress(row, e.clientX, e.clientY, true);   // the box still takes focus
    else if (row) { e.preventDefault(); startPress(row, e.clientX, e.clientY); }
  });
  document.addEventListener("mousemove", e => {
    if (!press) return;
    press.x = e.clientX; press.y = e.clientY;
    if (press.swipe) { swipeTo(); return; }
    if (!press.active) {
      if (Math.hypot(press.x - press.x0, press.y - press.y0) > SLOP && !startSwipe()) cancelPress();
      return;
    }
    dragTo();
  });
  document.addEventListener("mouseup", dropStop);
}

/* ── Driver view ────────────────────────────────────────── */

let details = {};   // address, notes and position per customer (shared database)

let openDetails = null;   // customer id whose More line is open (one at a time)
let theftOpen = null;     // customer id whose theft form is open
let leftOpen = null;      // customer id whose Oil Left form is open
let noteEdit = null;      // { id, text, today, busy, msg }: the notes being edited (Notes and Today's note)
let photoAdd = null;      // { id, msg }: a photo uploading from My Route
// A browser can pair this page with an older ops-common.js for a few minutes
// after a deploy: Oil Left then stays hidden instead of breaking the route.
const oilLeftReady = typeof recordOilLeft === "function";
const leftFor = id => (oilLeftReady ? todaysOilLeft(store, id) : null);
const todayNoteFor = id => (typeof opsTodayNote === "function" ? opsTodayNote(id) : "");
// Likewise without ops-photos.js: the Notes panel then shows no photos.
const photosReady = typeof opsPhotoStripHtml === "function";
let photosKey = "";       // the route's customers whose photos are loaded
let activeId = null;      // customer id showing its controls; null = the next one to collect
let compact = true;       // only the active stop shows controls (a per-phone preference)
let officePhones = [];    // [{ name, phone }]: the office numbers for Call ▾ (not the signed-in person's own)
let callOpen = false;     // Call ▾'s menu is showing
let taskOpen = null;      // client_id of the task showing its Note and Remove
let taskNote = null;      // { id, text }: a task's note being edited
let taskAdd = null;       // { kind, text, note, customerId, search, msg }: the Add task form, open
let stopAdd = false;      // Add stop's search box open under the stops
// The bar at the foot of the driver view, one at a time (the newest wins):
//   { kind: "taskrm", task, timer }      a task just removed: Undo
//   { kind: "two", customerId }          a typed 2 saved as a sign-up call: "Make it Empty"
//   { kind: "cap", ids, name, capacity, editing, msg, busy, saved }   after a Barrel drop: Update capacity
let footBar = null;
// Without the task helpers (an older ops-common.js for a few minutes after a deploy) tasks stay hidden.
const tasksReady = typeof routeTasks === "function";

const COMPACT_KEY = "bbb-ops-compact";
try { compact = window.localStorage.getItem(COMPACT_KEY) !== "off"; } catch (err) { /* default on */ }
// Page › remembers its stop, so coming back from the customer page reopens that stop, not the next to collect.
const BACK_KEY = "bbb-ops-myroute-back";

/**
 * The route being driven, built for a phone in a cold truck:
 *   - each stop is one line: name, then "(~87 gal / 300) [28]";
 *   - in Compact (the default) only one stop shows its controls: the next one
 *     to collect, or whichever line the driver taps. Save moves on to the next;
 *   - controls are one row: gallons, Save, Maps, Notes (1-3 typed = empty);
 *   - Theft sits in the Notes panel, beside Customer page, so it is never one
 *     slip from Save. It opens a form (gallons collected, an optional
 *     note); a saved theft is a collection in red, its note under the name;
 *   - Oil Left sits beside Theft, collected or not: the gallons seen left in
 *     the barrel (a part pickup, or a stop the full truck checks and skips).
 *     It is not a collection; it shows in blue under the name. Cancel in its
 *     form clears a saved reading, as Cancel does for a theft;
 *   - collected stops turn green and drop below the rest, in the order collected;
 *   - the tally and truck bar sit under the list, then the pin map.
 */
function renderDriver() {
  const route = routeList.find(r => String(r.route_id) === String(store.my.routeId));
  const stops = storeStops(store, store.my.routeId);
  if (!route || !stops.length) { store.my = null; saveStore(store); return renderList(); }
  const { lines } = routeSummary(stops, data.index);
  const truck = truckByName(store.trucks[route.route_id]);
  const done = lines.map(l => todaysCollection(store, l.stop.customer_id));
  const live = liveRouteTotals(lines, store);
  const thefts = done.filter(c => c && c.theft).length;
  const drops = tasksReady ? lines.filter(l => todaysDrop(store, l.stop.customer_id)).length : 0;

  // Uncollected stops in route order, then collected ones in the order entered.
  const entered = new Map(store.collections.filter(c => c.date === todayIso()).map((c, k) => [c.customer_id, k]));
  const order = lines.map((l, k) => k).sort((a, b) =>
    (done[a] ? entered.get(lines[a].stop.customer_id) : -1) - (done[b] ? entered.get(lines[b].stop.customer_id) : -1) || a - b);
  const next = order.find(k => !done[k]);
  // Compact shows one thing open at a time: an open task or the Add form closes the stop's controls.
  // "+ Add" and its forms leave the stop open, so they open where the bar was (Sarge, 2026-11-15).
  const elsewhere = compact && (taskOpen !== null || taskNote);
  const current = elsewhere ? null : activeId !== null && lines.some(l => l.stop.customer_id === activeId)
    ? activeId : (next !== undefined ? lines[next].stop.customer_id : null);

  const share = g => (truck ? Math.max(0, 100 * g / truck.capacity) : 0);
  const solid = Math.min(100, share(live.collected));
  const light = Math.min(100 - solid, share(live.remaining));
  const over = truck && live.projected > truck.capacity;

  document.getElementById("page").innerHTML = `
    <div class="d-flex align-items-center gap-2 mb-2">
      <div class="ops-drive-title flex-grow-1">${escapeHtml(route.name)}</div>
      <label class="form-check-label text-nowrap small"><input type="checkbox" class="form-check-input" id="compact"
        ${compact ? "checked" : ""}> Compact</label>
      ${callMenuHtml()}
      <button type="button" class="btn btn-outline-secondary btn-sm text-nowrap" data-act="change">All routes</button>
    </div>
    ${tasksBlockHtml(route.route_id)}
    ${order.map(k => stopHtml(lines[k], k, done[k], !compact || lines[k].stop.customer_id === current)).join("")}
    ${addFootHtml(route.route_id)}
    <div class="mt-2">
      <div class="ops-route-sum"><strong>Total: ${formatNumber(live.collected)}</strong> of
        ${formatWhole(live.projected)} projected gal · ${live.done} of ${lines.length} stops${thefts
        ? ` · ${thefts} theft${thefts === 1 ? "" : "s"}` : ""}${drops
        ? ` · ${drops} barrel${drops === 1 ? "" : "s"} dropped` : ""}</div>
      ${truck ? `<div class="d-flex align-items-center gap-2 mt-1">
        <div class="progress flex-grow-1">
          <div class="progress-bar ${over ? "bg-danger" : "bg-success"}" style="width:${solid}%"></div>
          <div class="progress-bar ${over ? "bg-danger" : "bg-success"} ops-bar-pending" style="width:${light}%"></div>
        </div>
        <span class="small text-muted text-nowrap">${Math.round(share(live.projected))}% of ${escapeHtml(truck.name)}'s ${formatNumber(truck.capacity)} gal</span></div>` : ""}
    </div>
    <div id="route-map" class="ops-map mt-3 mb-1"></div>
    <div class="ops-muted mb-3" id="map-note"></div>
    ${footBarHtml()}`;
  drawRouteMap(lines, done);
}

function mapsUrl(id) {
  const d = details[String(id)] || {};
  const dest = d.lat != null && d.loc !== "town" ? `${d.lat},${d.lon}` : d.address;
  return dest ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}` : null;
}

/** A stop's Today's note, note and photos, shown as it opens (nothing when it has none). */
function notesPhotosHtml(id, d) {
  const photos = photosReady && opsPhotosFor(id).length;
  const today = todayNoteFor(id);
  return today || d.notes || photos ? `<div class="ops-auto-notes">
      ${today ? `<div class="ops-today-note"><b>Today:</b> ${escapeHtml(today)}</div>` : ""}
      ${d.notes ? `<div>${notesHtml(id, d.notes)}</div>` : ""}
      ${photos ? opsPhotoStripHtml(id) : ""}</div>` : "";
}

const PIN_ICON = `<svg class="ops-btn-icon" width="14" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"

const PHONE_ICON = `<svg class="ops-btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"></path></svg>`;

/**
 * The title row's call to the office: "Call ▾" opening one green button per number (Jim,
 * Stacey), the person signed in left out. Always the menu, even for one number, so the button
 * stays narrow and the route name keeps its room (Sarge). Nothing without numbers (signed out,
 * or office_phones still empty).
 */
function callMenuHtml() {
  const list = officePhones.map(p => ({ name: p.name, tel: telHref(p.phone) })).filter(p => p.tel);
  const link = p => `<a class="btn ops-call-btn text-nowrap" href="${escapeHtml(p.tel)}">${PHONE_ICON}Call ${escapeHtml(p.name)}</a>`;
  if (!list.length) return "";
  return `<div class="ops-call-office">
      <button type="button" class="btn ops-call-btn text-nowrap" data-act="call-menu" aria-expanded="${callOpen}">${PHONE_ICON}Call ▾</button>
      ${callOpen ? `<div class="ops-call-list">${list.map(link).join("")}</div>` : ""}</div>`;
}

/** The customer's phone as a tel: target ("+1" and ten digits when it reads as a US number), else "". */
function telHref(phone) {
  const digits = String(phone || "").replace(/\D/g, "").replace(/^1(?=\d{10}$)/, "");
  return digits.length === 10 ? `tel:+1${digits}` : digits.length >= 7 ? `tel:${digits}` : "";
}

/**
 * The More block (Sarge, 2026-11-16, M1): a grid the full width of the stop, 39px buttons, no
 * gaps. Top: Note · Photo (dashed, with their icons) · Oil Left · Barrel drop, each column sized to
 * its words and stretched to fill. Under them, Call spans Note+Photo and Report Theft spans Oil

 * already saved) leaves its cell blank, so nothing shifts. Note never reads "Edit note": it would

 */
const NOTE_ICON = `<svg class="ops-btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>`;
const PHOTO_ICON = `<svg class="ops-btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z"></path><circle cx="12" cy="13" r="4"></circle></svg>`;

function actionBlockHtml(id, d, c, open) {
  const busy = photoAdd && photoAdd.id === id && !photoAdd.msg;
  const tel = telHref(d.phone);

      ${oilLeftReady ? `<button type="button" class="btn btn-outline-primary" data-act="left" data-id="${id}">Oil Left</button>` : gap("")}
      ${tasksReady && !dropped ? `<button type="button" class="btn ops-drop-btn" data-act="drop" data-id="${id}">Barrel drop</button>` : gap("")}
      ${tel ? `<a class="btn ops-call-btn ops-act-left" href="${escapeHtml(tel)}" aria-label="Call the customer">${PHONE_ICON}Call</a>` : gap("ops-act-left")}
      ${c && c.theft ? gap("ops-act-right")
        : `<button type="button" class="btn btn-danger ops-act-right" data-act="theft" data-id="${id}" aria-label="Report theft">Report Theft</button>`}
    </div>`;
}

/**
 * Under the control row: the More block (open on a phone; always on a wide screen), any photo
 * error, then the note being edited, or the note and photos.
 */
function moreHtml(id, d, c, open) {
  const editing = noteEdit && noteEdit.id === id;
  const busy = photoAdd && photoAdd.id === id;
  const more = editing ? "" : actionBlockHtml(id, d, c, open);
  const msg = busy && photoAdd.msg ? `<div class="text-danger small mt-1">${escapeHtml(photoAdd.msg)}</div>` : "";
  if (editing) return `${more}<div class="ops-note-edit">
      <label for="today-${id}" class="ops-note-label">Today's note <span class="text-muted">(shows today and tomorrow)</span></label>
      <textarea class="form-control" id="today-${id}" rows="2" data-today-draft>${escapeHtml(noteEdit.today)}</textarea>
      <label for="note-${id}" class="ops-note-label">Notes <span class="text-muted">(stay until changed)</span></label>
      <textarea class="form-control" id="note-${id}" rows="3" data-note-draft>${escapeHtml(noteEdit.text)}</textarea>
      ${noteEdit.msg ? `<div class="text-danger small">${escapeHtml(noteEdit.msg)}</div>` : ""}
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-primary" data-act="note-save"${noteEdit.busy ? " disabled" : ""}>${noteEdit.busy ? "Saving…" : "Save notes"}</button>
        <button type="button" class="btn ops-plain-btn" data-act="note-cancel">Cancel</button>
      </div></div>`;
  return more + msg + notesPhotosHtml(id, d);
}

/** Write the edited Notes and Today's note to the shared database: every signed-in driver sees them. */
async function saveNote() {
  const n = noteEdit;
  if (!n || n.busy) return;
  const text = (document.getElementById(`note-${n.id}`) || {}).value;
  if (typeof text === "string") n.text = text;
  const today = (document.getElementById(`today-${n.id}`) || {}).value;
  if (typeof today === "string") n.today = today;
  n.busy = true; n.msg = ""; render();
  try {
    const saved = await opsSaveNotes(n.id, { notes: n.text, today: n.today },
      { notes: (details[String(n.id)] || {}).notes, today: todayNoteFor(n.id) });
    details[String(n.id)] = { ...(details[String(n.id)] || {}), notes: saved.notes };
  } catch (err) {
    n.busy = false; n.msg = `Not saved (${err.message}).`; render(); return;
  }
  noteEdit = null;
  openDetails = null;
  render();
}

/** Pick a photo (from the tap itself, as iPhone requires), upload it, reload the strip. */
function addPhoto(id) {
  opsPhotoPick(async file => {
    photoAdd = { id, msg: "" };
    render();
    try {
      await opsPhotoUpload(id, file, "");
      photoAdd = null;
      openDetails = null;
      photosKey = "";
      loadRoutePhotos();
    } catch (err) {
      photoAdd = { id, msg: err.message };
    }
    render();
  });
}

/** One stop: its line, then (when it is the one showing) its control row or Oil Left or theft form, and More. */
function stopHtml(l, k, c, showing) {
  const id = l.stop.customer_id;
  const open = showing && openDetails === id;
  const d = details[String(id)] || {};
  const maps = mapsUrl(id);
  const mapsText = `${PIN_ICON}Maps`;
  const mapsBtn = maps
    ? `<a class="btn ops-plain-btn ops-maps-btn" href="${maps}" target="_blank" rel="noopener">${mapsText}</a>`
    : `<button type="button" class="btn ops-plain-btn ops-maps-btn" disabled>${mapsText}</button>`;
  // Maps, gallons and Save on the left; More ▾ evenly between Save and Page › at the right end
  // (a wide screen shows More's four buttons there instead).
  const pageBtn = `<a class="btn ops-plain-btn ops-pick-page" href="ops-customer.html?id=${id}&from=myroute"
    data-page-for="${id}" aria-label="Customer page for ${escapeHtml(l.stop.name)}">Page ›</a>`;
  const theft = c && c.theft;
  const theftForm = showing && theftOpen === id;
  const left = leftFor(id);
  const leftForm = showing && leftOpen === id && !theftForm;
  // Collected with another town's run: "New Haven · w/ Middlebury" under the name.
  const cw = typeof opsCollectedWith === "function" ? opsCollectedWith(id) : null;
  const drop = tasksReady ? todaysDrop(store, id) : null;
  const figures = theft && !showing
    ? `<span class="ops-line-figs ops-theft-text">${theftGallonsText(c)}</span>`
    : !showing && c
    ? `<span class="ops-line-figs text-success">✓ ${entryText(c.gallons)}</span>`
    : `<span class="ops-line-figs">${stopLabelHtml(l)}</span>`;
  const cls = theftForm ? " ops-theft-open" : leftForm ? " ops-left-open"
    : (theft ? " ops-theft" : (c ? " ops-done" : ""));
  return `<div class="ops-line${cls}${showing && compact ? " ops-current" : ""}" data-pick="${id}">
    <div class="ops-line-head">
      <span class="ops-line-name${l.stop.must_get ? " hotlist" : ""}" title="${escapeHtml(l.stop.name)}">${escapeHtml(l.stop.name)}</span>
      ${figures}
    </div>
    ${cw ? `<div class="ops-line-sub">${escapeHtml(opsCollectedWithText(cw))}</div>` : ""}
    ${stopTasksHtml(id)}
    ${drop ? `<div class="ops-drop-note">✓ Barrel dropped${showing
      ? ` · <button type="button" class="btn btn-link p-0 ops-drop-undo" data-act="drop-undo" data-id="${id}">Undo</button>` : ""}</div>` : ""}
    ${theft && theft.note && !theftForm ? `<div class="ops-theft-note">${escapeHtml(theft.note)}</div>` : ""}
    ${left && !leftForm ? `<div class="ops-left-note">${oilLeftText(left)}</div>` : ""}
    ${leftForm ? `<div class="ops-left-form">
      <label for="left-gal-${k}">Oil Left. Gallons left in the barrel:</label>
      <input type="number" inputmode="numeric" min="0" class="form-control" id="left-gal-${k}" placeholder="gal"
        value="${left ? left.gallons : ""}">
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-primary" data-act="left-save" data-i="${k}">Save</button>
        <button type="button" class="btn ops-plain-btn" data-act="left-cancel">Cancel</button>
      </div>
    </div>` : theftForm ? `<div class="ops-theft-form">
      <label for="theft-gal-${k}" class="ops-theft-label">Theft. Gallons collected:</label>
      <input type="number" inputmode="numeric" min="0" class="form-control" id="theft-gal-${k}" placeholder="gal"
        value="${theft || (c && c.gallons > 3) ? c.gallons : ""}">
      <label for="theft-note-${k}">Note <span class="text-muted">(optional)</span></label>
      <textarea class="form-control" id="theft-note-${k}" rows="2" placeholder="What happened?">${theft ? escapeHtml(theft.note) : ""}</textarea>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-danger" data-act="theft-save" data-i="${k}">Save</button>
        <button type="button" class="btn ops-plain-btn" data-act="theft-cancel">Cancel</button>
      </div>
    </div>` : showing ? `<div class="ops-row">${mapsBtn}
      ${theft ? `<span class="ops-theft-text">${theftGallonsText(c)}</span>
             <button type="button" class="btn ops-plain-btn" data-act="theft" data-id="${id}">Edit</button>`
        : c ? `<span>${entryText(c.gallons)} ✓</span>
             <button type="button" class="btn ops-plain-btn" data-act="undo" data-id="${id}">Edit</button>`
          : `<input type="number" inputmode="numeric" min="0" class="form-control" id="gal-${k}" placeholder="gal"
               aria-label="Gallons for ${escapeHtml(l.stop.name)}">
             <button type="button" class="btn btn-success" data-act="save" data-i="${k}">Save</button>`}
      <button type="button" class="btn ops-plain-btn ops-more-btn" data-act="details" data-id="${id}"
        aria-expanded="${open}">More ${open ? "▴" : "▾"}</button>${pageBtn}
    </div>` : ""}
    ${showing && !theftForm && !leftForm ? moreHtml(id, d, c, open) : ""}
  </div>`;
}

function drawRouteMap(lines, done) {
  const map = L.map("route-map", { scrollWheelZoom: false });
  opsTileLayer().addTo(map);
  const pts = [];
  let townOnly = 0, missing = 0;
  lines.forEach((l, i) => {
    const d = details[String(l.stop.customer_id)];
    if (!d || d.lat == null) { missing++; return; }
    if (d.loc === "town") townOnly++;
    L.marker([d.lat, d.lon], { icon: routePinIcon("", !!done[i]) })
      .bindTooltip(escapeHtml(l.stop.name)).addTo(map);
    pts.push([d.lat, d.lon]);
  });
  if (pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 14 });
  else map.setView([44.26, -72.58], 8);
  const notes = [];
  if (townOnly) notes.push(`${townOnly} pin${townOnly === 1 ? " is a town centre" : "s are town centres"} (address not matched)`);
  if (missing) notes.push(`${missing} stop${missing === 1 ? " has" : "s have"} no position`);
  document.getElementById("map-note").textContent = notes.join(" · ");
}


/* ── Route tasks (Sarge, 2026-11-14) ─────────────────────── */

/** A customer's name for a task, from the Assign list or the site's own customers. */
function customerName(id) {
  if (id === null || id === undefined) return "";
  const a = data.snap.assign_list.find(c => c.customer_id === id) || store.added.find(c => c.customer_id === id);
  const row = data.index.get(id);
  return (a && a.name) || (row && row.id === id && row.name) || `#${id}`;
}

/** Undone tasks naming this customer, as a line in its stop: "Task: Barrel drop". */
function stopTasksHtml(id) {
  if (!tasksReady || !store.my) return "";
  const list = routeTasks(store, store.my.routeId).filter(t => t.customer_id === id && !t.done_at);

    t.note ? ` <span class="text-muted">· ${escapeHtml(t.note)}</span>` : ""}</div>`).join("");

/** One task row: a checkbox, the words (and its customer), a "from Wed" tag when carried over. */

/** The Tasks block at the top of the route (nothing when the route has none). */
function tasksBlockHtml(routeId) {
  if (!tasksReady) return "";

/** Up to 6 customers matching the Add task form's customer box. */
function taskMatchesHtml() {
  const q = ((taskAdd && taskAdd.search) || "").trim().toLowerCase();
  if (!q) return "";
  const pool = [...data.snap.assign_list,
    ...store.added.map(c => ({ customer_id: c.customer_id, name: c.name, city: c.city }))];
  const hits = pool.filter(c => !isReplaced(store, c.customer_id) && matchesNameSearch(q, [c.name, c.city])).slice(0, 6);
  if (!hits.length) return `<div class="ops-muted mt-1">No match.</div>`;
  return `<div class="list-group mt-1">${hits.map(c => {
    const row = data.index.get(c.customer_id);
    return `<button type="button" class="list-group-item list-group-item-action" data-act="taskadd-pick" data-id="${c.customer_id}">
      ${escapeHtml(c.name || `#${c.customer_id}`)} <span class="ops-muted">${escapeHtml(townLabel((row && row.town) || c.city || ""))}</span></button>`;
  }).join("")}</div>`;
}

/**
 * At the foot of the stops, one dashed bar split in two, + Stop | + Task (Sarge, 2026-11-15: 5A,
 * stop first), so a stop or a task joins the route while it is being driven, in one tap. Add stop
 * is the route list's search box; the stop goes at the end of the route.
 */
function addFootHtml(routeId) {
  if (stopAdd) return `<div class="ops-task-form">
      <label for="stop-add" class="ops-note-label">Add stop</label>
      <input type="search" class="form-control" id="stop-add" data-add-search="${routeId}"
        placeholder="Search name or town" value="${escapeHtml(addSearch[routeId] || "")}" autocomplete="off">
      <div data-add-results="${routeId}">${addMatchesHtml(routeId)}</div>
      <div><button type="button" class="btn ops-plain-btn" data-act="add-cancel">Cancel</button></div>
    </div>`;
  if (taskAdd) return taskAddHtml();
  return `<div class="ops-add-split">
      <button type="button" data-act="stopadd-open">+ Stop</button>
      ${tasksReady ? `<button type="button" data-act="taskadd-open">+ Task</button>` : ""}
    </div>`;
}

/** The Add task form: Task | Barrel drop, words, customer, note. */
function taskAddHtml() {
  if (!tasksReady || !taskAdd) return "";
  const a = taskAdd, drop = a.kind === "barrel_drop";
  return `<div class="ops-task-form">
    <div class="btn-group ops-task-kind" role="group" aria-label="Kind">
      <button type="button" class="btn ${drop ? "btn-outline-primary" : "btn-primary"}" data-act="taskadd-kind" data-kind="task">Task</button>
      <button type="button" class="btn ${drop ? "btn-primary" : "btn-outline-primary"}" data-act="taskadd-kind" data-kind="barrel_drop">Barrel drop</button>
    </div>
    ${drop ? "" : `<label for="task-text" class="ops-note-label">New task</label>
      <input class="form-control" id="task-text" maxlength="200" data-taskadd="text" value="${escapeHtml(a.text)}">`}
    <label for="task-cust" class="ops-note-label">Customer${drop ? "" : ` <span class="text-muted fw-normal">(optional)</span>`}</label>
    ${a.customerId !== null ? `<div><span class="ops-task-chip">${escapeHtml(customerName(a.customerId))}
        <button type="button" class="btn ops-task-chip-x" data-act="taskadd-clear" aria-label="Clear customer">✕</button></span></div>`
      : `<input type="search" class="form-control" id="task-cust" data-taskadd="search" value="${escapeHtml(a.search)}" autocomplete="off">
        <div data-task-results>${taskMatchesHtml()}</div>`}
    <label for="task-note" class="ops-note-label">Note <span class="text-muted fw-normal">(optional)</span></label>
    <input class="form-control" id="task-note" maxlength="500" data-taskadd="note" value="${escapeHtml(a.note)}">
    ${a.msg ? `<div class="text-danger small">${escapeHtml(a.msg)}</div>` : ""}
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-primary" data-act="taskadd-save">Add</button>
      <button type="button" class="btn ops-plain-btn" data-act="taskadd-cancel">Cancel</button>
    </div>
  </div>`;
}

/** Every member of a customer's shared barrel (each lists the whole barrel's capacity), else just it. */
function barrelGroup(id) {
  const row = data.index.get(id);
  const ids = row && row.members ? row.members.map(m => m.id) : [id];
  return ids.includes(id) ? ids : [id, ...ids];
}

/** A customer's listed capacity: the projection row's, else the stop's. */
function capacityOf(id) {
  const row = data.index.get(id);
  const stop = store.my && storeStops(store, store.my.routeId).find(s => s.customer_id === id);
  const added = store.added.find(c => c.customer_id === id);
  return (row && row.capacity) ?? (stop && stop.capacity) ?? (added && added.capacity) ?? null;
}

/** After a Barrel drop (button or ticked task): the Update capacity bar. Ignored, nothing changes. */
function openCapBar(id) {
  footBar = { kind: "cap", ids: barrelGroup(id), name: customerName(id), capacity: capacityOf(id),
    editing: false, msg: "", busy: false, saved: null };
}

/** Save the capacity typed in the bar on every member of the barrel. */
async function saveCapBar() {
  const b = footBar;
  if (!b || b.kind !== "cap" || b.busy) return;
  const cap = parseInt((document.getElementById("cap-new") || {}).value, 10);
  if (!Number.isFinite(cap) || cap <= 0) { b.msg = "Type the new capacity in gallons."; render(); return; }
  const real = b.ids.filter(x => x > 0), mine = b.ids.filter(x => x < 0);
  b.busy = true; b.msg = ""; render();
  try {
    if (real.length) {
      if (typeof opsSaveCapacity !== "function") throw new Error("sign in to change the capacity");
      await opsSaveCapacity(real, cap);
    }
    if (mine.length) {
      store.added.forEach(c => { if (mine.includes(c.customer_id)) c.capacity = cap; });
      saveStore(store);
    }
  } catch (err) {
    b.busy = false; b.msg = `Not saved (${err.message}).`; render(); return;
  }
  footBar = { kind: "cap", saved: cap, name: b.name, ids: b.ids, timer: setTimeout(() => {
    if (footBar && footBar.saved) { footBar = null; render(); }
  }, UNDO_MS) };
  render();
}

/** The bar at the foot of the driver view, if any. */
function footBarHtml() {
  const b = footBar;
  if (!b) return "";
  if (b.kind === "taskrm") return `<div class="ops-undo" role="status">
      <span class="ops-undo-text">Removed ${escapeHtml(taskTitle(b.task))}</span>
      <button type="button" class="btn ops-undo-btn" data-act="taskrm-undo">Undo</button></div>`;
  if (b.kind === "two") return `<div class="ops-undo ops-undo-wrap" role="status">
      <span class="ops-undo-text">2 = sign-up call. Did you mean 1 (empty)?</span>
      <button type="button" class="btn ops-undo-btn" data-act="two-empty">Make it Empty</button></div>`;
  if (b.saved) return `<div class="ops-undo ops-undo-wrap" role="status">
      <span class="ops-undo-text">Capacity ${formatNumber(b.saved)} gal saved${b.ids.length > 1 ? " on every share of the barrel" : ""}.
        Projections use it from tonight.</span></div>`;
  return `<div class="ops-undo ops-undo-wrap ops-cap-bar" role="status">
      <div class="ops-cap-row">
        <span class="ops-undo-text">Barrel dropped at ${escapeHtml(b.name)}.${b.capacity !== null
          ? `<br><span class="ops-cap-now">Capacity is ${formatNumber(b.capacity)} gal.</span>` : ""}</span>
        ${b.editing ? "" : `<button type="button" class="btn ops-undo-btn" data-act="cap-open">Update capacity</button>`}
      </div>
      ${b.editing ? `<div class="ops-cap-row ops-cap-edit">
        <label for="cap-new" class="flex-grow-1">New capacity${b.ids.length > 1 ? " (every share)" : ""}</label>
        <input type="number" inputmode="numeric" min="1" class="form-control" id="cap-new">
        <span>gal</span>
        <button type="button" class="btn btn-light" data-act="cap-save"${b.busy ? " disabled" : ""}>${b.busy ? "Saving…" : "Save"}</button>
      </div>` : ""}
      ${b.msg ? `<div class="ops-cap-msg">${escapeHtml(b.msg)}</div>` : ""}
    </div>`;
}

/* ── Events ─────────────────────────────────────────────── */

function render() {
  if (store.my) renderDriver(); else renderList();
  loadRoutePhotos();
}

/**
 * Photos for the Notes panels (view only; they are added on the customer page),
 * loaded once per set of stops on My Route. A redraw waits while a box is being typed in.
 */
function loadRoutePhotos() {
  if (!photosReady || !opsPhotosOn() || !store.my) return;
  const ids = storeStops(store, store.my.routeId).map(s => s.customer_id);
  const key = ids.slice().sort((a, b) => a - b).join(",");
  if (key === photosKey) return;
  photosKey = key;
  opsPhotosLoad(ids).then(ok => {
    if (!ok) { photosKey = ""; return; }
    const el = document.activeElement;
    if (el && el.matches("input, textarea, select")) el.addEventListener("blur", () => setTimeout(render, 50), { once: true });
    else render();
  });
}

function onAct(b) {
  const d = b.dataset;
  const routeId = d.route !== undefined ? Number(d.route) : null;
  const i = Number(d.i);
  const stops = routeId !== null ? storeStops(store, routeId) : null;
  // The foot bar stays until a tap on anything but itself (Undo, Make it Empty, Update capacity).
  if (footBar && !String(d.act).startsWith(`${footBar.kind}-`)) {
    clearTimeout(footBar.timer);
    footBar = null;
  }
  const task = d.taskId ? (store.tasks || []).find(t => t.client_id === d.taskId) : null;
  switch (d.act) {
    case "remove":   // gone at once; Undo puts it back in its place for a few seconds
      if (removed) clearTimeout(removed.timer);
      removed = { route: routeId, i, stop: stops[i],
        timer: setTimeout(() => { removed = null; render(); }, UNDO_MS) };
      store.routes[routeId] = removeStop(stops, i);
      break;
    case "unremove": {
      if (!removed) return;
      clearTimeout(removed.timer);
      const back = storeStops(store, removed.route).slice();
      if (!back.some(s => s.customer_id === removed.stop.customer_id)) back.splice(removed.i, 0, removed.stop);
      store.routes[removed.route] = back;
      lastMoved = { route: removed.route, i: removed.i };
      removed = null;
      break;
    }
    case "add": {
      const id = Number(d.id);
      const src = data.snap.assign_list.find(c => c.customer_id === id) ||
        store.added.find(c => c.customer_id === id);
      const row = data.index.get(id);
      assignToRoute(store, routeId, [{ customer_id: id, name: src.name,
        capacity: row && row.capacity != null ? row.capacity : (src.capacity ?? null) }], false);
      addSearch[routeId] = "";
      stopAdd = false;
      break;
    }
    case "rename": {
      naming = { route: routeId, text: routeList.find(r => r.route_id === routeId).name };
      render();
      return;
    }
    case "name-done": {
      if (!naming) return;
      renameRoute(store, naming.route, naming.text);
      openRoutes.add(naming.route);
      routeList = opsRouteList(data.snap, store);
      naming = null;
      break;
    }
    case "set": store.my = { routeId }; taskAdd = null; activeId = null; openDetails = null; theftOpen = null; leftOpen = null; window.scrollTo(0, 0); break;
    case "save": {
      const stop = storeStops(store, store.my.routeId)[i];
      const typed = parseInt(document.getElementById(`gal-${i}`).value, 10);
      if (!Number.isFinite(typed) || typed < 0) return;
      // 0 and 1 save as Empty, 2 as a sign-up call (with a check), 3 as a barrel delivery.
      recordCollection(store, stop, typedEntry(typed));
      if (typed === 2) footBar = { kind: "two", customerId: stop.customer_id };
      activeId = null;      // on to the next stop to collect
      openDetails = null;
      break;
    }
    case "two-empty": {   // the typed 2 was meant as an empty check
      const id = footBar && footBar.customerId;
      const stop = id !== undefined && storeStops(store, store.my.routeId).find(s => s.customer_id === id);
      if (stop && todaysCollection(store, id)) recordCollection(store, stop, 1);
      footBar = null;
      break;
    }
    case "undo":
      clearTodaysEntry(store, Number(d.id));
      activeId = Number(d.id);   // stays open, back in its route place
      break;
    case "drop": {   // a barrel dropped here: recorded beside the stop, which stays open for gallons
      const id = Number(d.id);
      const stop = storeStops(store, store.my.routeId).find(s => s.customer_id === id);
      if (!stop) return;
      recordDrop(store, stop, store.my.routeId);
      activeId = id;
      openDetails = null;
      openCapBar(id);
      break;
    }
    case "drop-undo": {
      const drop = todaysDrop(store, Number(d.id));
      if (drop) clearDrop(store, drop.client_id);
      break;
    }
    case "cap-open":
      footBar.editing = true;
      render();
      setTimeout(() => { const el = document.getElementById("cap-new"); if (el) el.focus(); }, 0);
      return;
    case "cap-save": saveCapBar(); return;
    case "task-tick": {
      if (!task) return;
      const by = typeof opsDb !== "undefined" && opsDb && opsDb.user ? opsDb.user.id : null;
      const entry = setTaskDone(store, task, !task.done_at, { by, name: customerName(task.customer_id) });
      if (entry) openCapBar(task.customer_id);
      break;
    }
    case "task-note":
      if (!task) return;
      taskNote = { id: task.client_id, text: task.note || "" };
      render();
      return;
    case "task-note-cancel": taskNote = null; render(); return;
    case "task-note-save": {
      const t = taskNote && (store.tasks || []).find(x => x.client_id === taskNote.id);
      const el = taskNote && document.getElementById(`task-note-${taskNote.id}`);
      if (!t) { taskNote = null; render(); return; }
      t.note = (el ? el.value : taskNote.text).trim().slice(0, 500) || null;
      taskNote = null;
      break;
    }
    case "task-remove": {   // gone at once; Undo puts it back for a few seconds
      if (!task) return;
      setTaskRemoved(store, task.client_id, true);
      taskOpen = null;
      taskNote = null;
      footBar = { kind: "taskrm", task: { ...task, removed_at: null },
        timer: setTimeout(() => { if (footBar && footBar.kind === "taskrm") { footBar = null; render(); } }, UNDO_MS) };
      break;
    }
    case "taskrm-undo": {
      const back = footBar.task;
      clearTimeout(footBar.timer);
      footBar = null;
      // Still in the store, or reloaded without it meanwhile: put it back either way.
      if (!setTaskRemoved(store, back.client_id, false)) (store.tasks = store.tasks || []).push(back);
      break;
    }
    case "add-cancel": stopAdd = false; taskAdd = null; if (store.my) addSearch[store.my.routeId] = ""; render(); return;
    case "stopadd-open":
      stopAdd = true; taskOpen = null; taskNote = null;
      render();
      setTimeout(() => { const el = document.getElementById("stop-add"); if (el) el.focus(); }, 0);
      return;
    case "taskadd-open":
      stopAdd = false;
      taskOpen = null;
      taskAdd = { routeId: d.route !== undefined ? Number(d.route) : Number(store.my.routeId),
        kind: "task", text: "", note: "", customerId: null, search: "", msg: "" };
      render();
      setTimeout(() => { const el = document.getElementById("task-text"); if (el) el.focus(); }, 0);
      return;
    case "taskadd-cancel": taskAdd = null; render(); return;
    case "taskadd-kind": taskAdd.kind = d.kind; taskAdd.msg = ""; render(); return;
    case "taskadd-pick": taskAdd.customerId = Number(d.id); taskAdd.search = ""; taskAdd.msg = ""; render(); return;
    case "taskadd-clear": taskAdd.customerId = null; render(); return;
    case "taskadd-save": {
      const a = taskAdd;
      ["text", "note"].forEach(k => { const el = document.querySelector(`[data-taskadd="${k}"]`); if (el) a[k] = el.value; });
      if (a.kind === "task" && !a.text.trim()) { a.msg = "Type the task."; render(); return; }
      if (a.kind === "barrel_drop" && a.customerId === null) { a.msg = "Pick the customer getting the barrel."; render(); return; }
      if (store.my === null) openRoutes.add(a.routeId);
      addTask(store, { routeId: a.routeId, kind: a.kind, text: a.text, customerId: a.customerId, note: a.note });
      taskAdd = null;
      break;
    }
    case "theft":   // open the theft form (Edit on a saved theft reopens it filled in)
      theftOpen = activeId = Number(d.id);
      openDetails = null;
      leftOpen = null;
      render();
      return;
    case "left":   // open the Oil Left form (filled in when one is saved today)
      leftOpen = activeId = Number(d.id);
      openDetails = null;
      theftOpen = null;
      render();
      return;
    case "left-cancel":   // back to the stop as it was before Oil Left; a saved reading is cleared too, as for a theft
      clearOilLeft(store, leftOpen);
      activeId = leftOpen;
      leftOpen = null;
      break;
    case "left-save": {
      const stop = storeStops(store, store.my.routeId)[i];
      const gallons = parseInt(document.getElementById(`left-gal-${i}`).value, 10);
      if (!Number.isFinite(gallons) || gallons < 0) return;
      recordOilLeft(store, stop, gallons);
      leftOpen = null;      // the stop stays showing: a skipped stop is still to collect
      break;
    }
    case "theft-cancel":   // back to the plain gallons row; a saved theft is cleared too (a mistaken press)
      clearTodaysEntry(store, theftOpen, c => !c.theft);
      activeId = theftOpen;
      theftOpen = null;
      break;
    case "theft-save": {
      const stop = storeStops(store, store.my.routeId)[i];
      const typed = document.getElementById(`theft-gal-${i}`).value.trim();
      const gallons = typed === "" ? 0 : parseInt(typed, 10);
      if (!Number.isFinite(gallons) || gallons < 0) return;
      recordTheft(store, stop, gallons, document.getElementById(`theft-note-${i}`).value.trim());
      theftOpen = null;
      activeId = null;      // on to the next stop to collect
      openDetails = null;
      break;
    }
    case "note-edit":
      noteEdit = { id: Number(d.id), text: (details[d.id] || {}).notes || "", today: todayNoteFor(Number(d.id)),
        busy: false, msg: "" };
      render();
      return;
    case "note-cancel": noteEdit = null; render(); return;
    case "note-save": saveNote(); return;
    case "photo-add": addPhoto(Number(d.id)); return;
    case "details": {
      const id = Number(d.id);
      openDetails = openDetails === id ? null : id;
      noteEdit = null;
      render();
      return;
    }
    case "call-menu": callOpen = !callOpen; render(); return;
    case "change":
      store.my = null; activeId = null; openDetails = null; theftOpen = null; leftOpen = null;
      taskAdd = null; taskOpen = null; taskNote = null; stopAdd = false;
      break;
    default: return;
  }
  saveStore(store);
  render();
}

function wire() {
  const page = document.getElementById("page");
  wireDrag(page);
  page.addEventListener("click", e => {
    // Call ▾ open: a tap on a number dials and closes it; a tap anywhere else only closes it.
    if (callOpen && !(e.target.closest && e.target.closest("[data-act=call-menu]"))) {
      const dial = e.target.closest && e.target.closest(".ops-call-list a");
      callOpen = false;
      if (dial) { setTimeout(render, 0); return; }
      render();
      return;
    }
    const ph = e.target.closest && e.target.closest("[data-photo]");
    const phLine = ph && ph.closest("[data-pick]");
    if (phLine) { opsPhotoViewer(Number(phLine.dataset.pick), Number(ph.dataset.photo)); return; }
    const pg = e.target.closest && e.target.closest("[data-page-for]");
    if (pg && store.my) {
      const id = Number(pg.dataset.pageFor);
      try {
        window.sessionStorage.setItem(BACK_KEY, JSON.stringify({ route: store.my.routeId, id, more: openDetails === id }));
      } catch (err) { /* back to the next stop instead */ }
      return;   // the link goes on to the customer page
    }
    const b = e.target.closest && e.target.closest("[data-act]");
    if (b) { onAct(b); return; }
    // A tap on a task (not its box, link or buttons) shows its Note and Remove; again hides them.
    const tk = e.target.closest && e.target.closest("[data-task]");
    if (tk && !e.target.closest("a, input, textarea, label, button")) {
      taskOpen = taskOpen === tk.dataset.task ? null : tk.dataset.task;
      taskNote = null;
      if (taskOpen) { taskAdd = null; stopAdd = false; }
      render();
      return;
    }
    // Compact: a tap on a stop's line shows that stop's controls, and closes
    // any Notes or theft form left open on another stop.
    const line = e.target.closest && e.target.closest("[data-pick]");
    if (store.my && compact && line && !e.target.closest("a, input, textarea, label, button, .ops-act-block, .ops-note-edit, .ops-auto-notes")) {
      const id = Number(line.dataset.pick);
      const other = taskOpen !== null || taskNote;
      if (id !== activeId || other) {
        activeId = id; openDetails = null; theftOpen = null; leftOpen = null; noteEdit = null;
        taskOpen = null; taskNote = null;
        render();
      }
    }
  });
  page.addEventListener("toggle", e => {
    const id = e.target.dataset && e.target.dataset.routeBox;
    if (id === undefined) return;
    if (e.target.open) openRoutes.add(Number(id)); else openRoutes.delete(Number(id));
  }, true);
  page.addEventListener("change", e => {
    const t = e.target;
    if (t.id === "compact") {
      compact = t.checked;
      try { window.localStorage.setItem(COMPACT_KEY, compact ? "on" : "off"); } catch (err) { /* ignore */ }
      activeId = null; openDetails = null; theftOpen = null; leftOpen = null;
      render();
      return;
    }
    if (t.dataset.seq !== undefined) {   // a stop's number typed: it moves there, the rest renumber
      const route = Number(t.dataset.route), from = Number(t.dataset.seq);
      const stops = storeStops(store, route);
      const n = parseInt(t.value, 10);
      const to = Number.isFinite(n) ? Math.max(1, Math.min(stops.length, n)) - 1 : from;
      if (to === from) { t.value = from + 1; return; }
      store.routes[route] = setStopNumber(stops, from, to + 1);
      lastMoved = { route, i: to };
      saveStore(store);
      render();
      return;
    }
    if (t.dataset.truck !== undefined) {
      store.trucks[t.dataset.truck] = t.value;
    } else return;
    saveStore(store);
    render();
  });
  // A stop's number box: the old number is selected, so typing replaces it; Enter moves the stop.
  page.addEventListener("focusin", e => {
    if (e.target.dataset && e.target.dataset.seq !== undefined) setTimeout(() => e.target.select(), 0);
  });
  page.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.dataset && e.target.dataset.seq !== undefined) {
      e.preventDefault();
      e.target.blur();
      return;
    }
    if (e.key === "Enter" && taskAdd && e.target.dataset && (e.target.dataset.taskadd === "text" || e.target.dataset.taskadd === "note")) {
      e.preventDefault();
      onAct({ dataset: { act: "taskadd-save" } });
      return;
    }
    if (e.key === "Enter" && e.target.dataset && e.target.dataset.name !== undefined) {
      e.preventDefault();
      onAct({ dataset: { act: "name-done" } });
    }
  });
  page.addEventListener("input", e => {
    if (naming && e.target.dataset && e.target.dataset.name !== undefined) { naming.text = e.target.value; return; }
    if (noteEdit && e.target.dataset && e.target.dataset.noteDraft !== undefined) { noteEdit.text = e.target.value; return; }
    if (noteEdit && e.target.dataset && e.target.dataset.todayDraft !== undefined) { noteEdit.today = e.target.value; return; }
    if (taskNote && e.target.dataset && e.target.dataset.taskNoteDraft !== undefined) { taskNote.text = e.target.value; return; }
    const ta = e.target.dataset && e.target.dataset.taskadd;
    if (taskAdd && ta) {
      taskAdd[ta] = e.target.value;
      // Only the matches redraw, so typing keeps focus.
      if (ta === "search") page.querySelector("[data-task-results]").innerHTML = taskMatchesHtml();
      return;
    }
    const id = e.target.dataset && e.target.dataset.addSearch;
    if (id === undefined) return;
    addSearch[id] = e.target.value;
    // Only the results redraw, so typing keeps focus.
    page.querySelector(`[data-add-results="${id}"]`).innerHTML = addMatchesHtml(Number(id));
  });
}

async function init() {
  document.getElementById("nav").innerHTML = opsNavHtml("myroute");
  try {
    [data, details] = await Promise.all([loadOpsData(), loadCustomerDetails()]);
  } catch (err) {
    document.getElementById("page").innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
    return;
  }
  try {
    store = await opsOpenStore(data.snap, { index: data.index, onRemote: s => {
    store = s;
    routeList = opsRouteList(data.snap, store);
    render();
  } });
  } catch (err) {
    document.getElementById("page").innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
    return;
  }
  routeList = opsRouteList(data.snap, store);
  if (typeof opsOfficePhones === "function") opsOfficePhones().then(list => {
    officePhones = list;
    if (store.my && list.length) render();
  });
  // Arriving from Assign Routes' "New Route…": open the new route, its name ready to type.
  const made = routeList.find(r => r.shadow && String(r.route_id) === getUrlParam("new"));
  if (made) {
    naming = { route: made.route_id, text: made.name };
    madeNow = made.route_id;
    openRoutes.add(made.route_id);
    store.my = null;
    history.replaceState(null, "", "ops-myroute.html");
  }
  const banner = document.getElementById("banner");
  banner.innerHTML = shadowBannerHtml(store, data.snap);
  wireShadowReset(banner, data.snap, fresh => {
    store = fresh;
    routeList = opsRouteList(data.snap, store);
    naming = null;
    banner.innerHTML = shadowBannerHtml(store, data.snap);
    render();
  });
  // Back from a stop's Page ›: that stop, opened as it was, in view.
  let back = null;
  try {
    back = JSON.parse(window.sessionStorage.getItem(BACK_KEY));
    window.sessionStorage.removeItem(BACK_KEY);
  } catch (err) { back = null; }
  if (back && store.my && store.my.routeId === back.route) {
    activeId = back.id;
    if (back.more) openDetails = back.id;
  } else back = null;
  wire();
  render();
  if (back) {
    const line = document.querySelector(`[data-pick="${back.id}"]`);
    if (line) line.scrollIntoView({ block: "center" });
  }
  if (photosReady) opsPhotosWatch(render);
}
// The browser's Back can restore this page as it was, stop and all: drop the note so a later visit starts fresh.
window.addEventListener("pageshow", e => {
  if (e.persisted) try { window.sessionStorage.removeItem(BACK_KEY); } catch (err) { /* ignore */ }
});

init();
</script>
