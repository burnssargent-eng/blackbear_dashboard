<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Route (shadow) — Black Bear Biodiesel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="ops.css">
</head>

<body>
<div id="nav"></div>
<div id="banner"></div>
<div class="container py-3" id="page">Loading…</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js" integrity="sha384-eMNCOe7tC1doHpGoWe/6oMVemdAVTMs2xqW4mwXrXsW0L84Iytr2wi5v2QjrP/xp" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.min.js" integrity="sha384-cn7l7gDp0eyniUwwAZgrzD06kc/tftFf19TOAs2zVinnD/C7E91j9yyk5//jjpt/" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="dashboard-utils.js"></script>
<script src="route-utils.js"></script>
<script src="ops-common.js"></script>
<script>
/*
 * My Route (shadow): the source site's "My Route" and "Today's Routes" in one
 * page. Every route is listed collapsed; opening one shows its stops, which
 * can be reordered (hold a stop a quarter of a second and drag it), opened on
 * their customer page, removed (with Undo), or added to straight from a search. "Set as My Route" opens the driver view
 * for entering gallons. Everything is saved in the shadow copy, in this
 * browser only.
 */

const SOURCE_CUSTOMER_URL = "https://jammal28.dreamhosters.com/tracking/customer.php?id=";

let data = null, store = null, routeList = [];
let openRoutes = new Set();          // route ids expanded in the list
let addSearch = {};                  // route id -> text in its Add stop box
let lastMoved = null;                // { route, i } of the stop just dragged, flashed once
let removed = null;                  // { route, i, stop, timer }: the last stop removed, until Undo times out

const UNDO_MS = 6000;

/* ── Route list ─────────────────────────────────────────── */

/**
 * "(~87 gal / 300) [28]" for a stop. A shared barrel's second stop names the
 * first in the route list ("(shared with Namaste)"); the collecting page just
 * says "(shared)".
 */
function stopLabelHtml(l, sharedWith = null) {
  if (l.dupOf !== null) {
    return `<span class="graytext" title="Same barrel as an earlier stop">(shared${
      sharedWith ? ` with ${escapeHtml(sharedWith)}` : ""})</span>`;
  }
  return stopFiguresHtml(l.row, l.capacity ?? l.stop.capacity);
}

/**
 * The route's stops as cards, styled like the collecting page's lines: remove
 * on the left, the name over its figures, Page (the customer page) on the
 * right. Remove and Page sit at opposite ends so a slip cannot hit the other.
 * No stop numbers or arrows: a stop is moved by holding and dragging it.
 */
function stopCardsHtml(routeId, lines) {
  const moved = lastMoved && lastMoved.route === routeId ? lastMoved.i : null;
  return lines.map((l, i) => `
    <div class="ops-card${i === moved ? " ops-flash" : ""}" data-drag="${i}" data-route="${routeId}">
      <button type="button" class="btn ops-plain-btn ops-card-x" data-act="remove" data-route="${routeId}"
        data-i="${i}" aria-label="Remove ${escapeHtml(l.stop.name)}">✕</button>
      <div class="ops-card-main">
        <div class="ops-card-name${l.stop.must_get ? " hotlist" : ""}">${escapeHtml(l.stop.name)}</div>
        <div class="ops-card-figs">${stopLabelHtml(l, l.dupOf !== null ? lines[l.dupOf].stop.name : null)}</div>
      </div>
      <a class="btn ops-plain-btn ops-card-page" href="ops-customer.html?id=${l.stop.customer_id}&from=myroute"
        aria-label="Customer page for ${escapeHtml(l.stop.name)}">Page ›</a>
    </div>`).join("");
}

/** Up to 8 customers matching the route's Add stop box, not already on it. */
function addMatchesHtml(routeId) {
  const q = (addSearch[routeId] || "").trim().toLowerCase();
  if (!q) return "";
  const onRoute = new Set(storeStops(store, routeId).map(s => s.customer_id));
  const pool = [...data.snap.assign_list,
    ...store.added.map(c => ({ customer_id: c.customer_id, name: c.name, city: c.city }))];
  const hits = pool.filter(c => !onRoute.has(c.customer_id) &&
    matchesNameSearch(q, [c.name, c.city])).slice(0, 8);
  if (!hits.length) return `<div class="ops-muted mt-1">No match.</div>`;
  return `<div class="list-group mt-1">${hits.map(c => {
    const row = data.index.get(c.customer_id);
    const badge = row ? projectionBadgeText(row) : "";
    return `<button type="button" class="list-group-item list-group-item-action"
        data-act="add" data-route="${routeId}" data-id="${c.customer_id}">
      + ${escapeHtml(c.name || `#${c.customer_id}`)} <span class="ops-muted">${escapeHtml((row && row.town) || c.city || "")}</span>
      ${badge ? `<span class="ops-proj">${escapeHtml(badge)}</span>` : ""}</button>`;
  }).join("")}</div>`;
}

/**
 * The route's total and truck bar, once, under the last stop and just above
 * Add a stop, so it can be watched adding up:
 * "Total ~1,010 gal · 51% of Mack Daddy's 2,000 gal", with the bar beneath.
 */
function routeTotalHtml(totals, routeId) {
  const fill = truckFill(totals, store.trucks[routeId]);
  const warn = !fill ? "" : fill.pct > 100 ? " — over the tank"
    : fill.highPct > 100 ? " — could overflow at the high end" : "";
  return `<div class="ops-route-total${fill && fill.pct > 100 ? " text-danger" : ""}">
    <div><strong>Total ~${formatWhole(totals.projected)} gal</strong>${fill
      ? ` · ${Math.round(fill.pct)}% of ${escapeHtml(fill.truck.name)}'s ${formatNumber(fill.truck.capacity)} gal${warn}` : ""}</div>
    ${fill ? `<div class="progress"><div class="progress-bar ${
      fill.level === "full" ? "bg-danger" : fill.level === "due" ? "bg-warning" : "bg-success"}"
      style="width:${Math.min(100, fill.pct)}%"></div></div>` : ""}</div>`;
}

function routeHtml(route) {
  const stops = storeStops(store, route.route_id);
  const { totals, lines } = routeSummary(stops, data.index);
  // Today's collections replace their stops' projections in every figure shown.
  const live = { ...totals, ...liveRouteTotals(lines, store) };
  const id = route.route_id;
  return `
    <details class="ops-route" data-route-box="${id}" ${openRoutes.has(id) ? "open" : ""}>
      <summary>
        <span class="ops-route-name">${escapeHtml(route.name)}</span>
        <span class="ops-route-sum">${stops.length} stop${stops.length === 1 ? "" : "s"}${stops.length
          ? ` · ~${formatWhole(live.projected)} gal` : ""}</span>
        ${store.trucks[id] ? `<span class="badge bg-secondary">${escapeHtml(store.trucks[id])}</span>` : ""}
      </summary>
      <div class="ops-route-body">
        <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
          <select class="form-select form-select-sm w-auto" data-truck="${id}" aria-label="Truck">
            <option value="">Truck…</option>
            ${TRUCKS.map(t => `<option${t.name === store.trucks[id] ? " selected" : ""}>${escapeHtml(t.name)}</option>`).join("")}
          </select>
          <button type="button" class="btn btn-primary btn-sm" data-act="set" data-route="${id}"
            ${stops.length ? "" : "disabled"}>Set as My Route</button>
        </div>
        ${route.aliases.length ? `<div class="ops-muted mb-2">Also called ${escapeHtml(route.aliases.join(", "))} on the source site.</div>` : ""}
        ${stops.length ? `
        <div class="ops-muted mb-1">Hold a stop to drag it.</div>
        <div class="ops-cards">${stopCardsHtml(id, lines)}</div>` : `<div class="ops-muted mb-2">No stops.</div>`}
        ${stops.length ? routeTotalHtml(live, id) : ""}
        <input type="search" class="form-control form-control-sm" data-add-search="${id}"
          placeholder="Add a stop: search name or town" value="${escapeHtml(addSearch[id] || "")}" autocomplete="off">
        <div data-add-results="${id}">${addMatchesHtml(id)}</div>
      </div>
    </details>`;
}

function renderList() {
  const withStops = routeList.filter(r => storeStops(store, r.route_id).length);
  const empty = routeList.filter(r => !storeStops(store, r.route_id).length);
  const html = `
    <h2>My Route</h2>
    <div class="ops-muted mb-3">Open a route to see and change its stops; Set as My Route to start entering gallons.
      Projections as of ${escapeHtml(formatDate(data.projections.as_of))}.</div>
    ${withStops.map(routeHtml).join("")}
    ${empty.length ? `<div class="ops-muted mt-3 mb-1">Routes with no stops</div>${empty.map(routeHtml).join("")}` : ""}
    ${removed ? `<div class="ops-undo" role="status">
      <span class="ops-undo-text">Removed ${escapeHtml(removed.stop.name)}</span>
      <button type="button" class="btn ops-undo-btn" data-act="unremove">Undo</button></div>` : ""}`;
  document.getElementById("page").innerHTML = html;
  lastMoved = null;
}

/* ── Reordering stops by dragging ───────────────────────────
 * Hold a stop for a quarter of a second, then drag: the stop lifts and the
 * others slide out of the way. A press that moves more than 10px before the
 * hold is up was a scroll, and nothing happens. Phone tests (2026-10-22):
 * 0.2 s occasionally caught a scroll, 0.3-0.4 s did not; Sarge chose 0.25 s.
 * Platform long-press is longer (iOS 0.5 s). Once lifted, touchmove is cancelled
 * so the page stops scrolling; near the top or bottom edge it auto-scrolls.
 * Mouse works the same way. */
const HOLD_MS = 250, SLOP = 10, EDGE = 70;
let press = null;

function startPress(row, x, y) {
  press = { row, route: Number(row.dataset.route), i: Number(row.dataset.drag),
    x0: x, y0: y, x, y, active: false };
  // The fill sweeping across tells the finger to stay put.
  const b = row.getBoundingClientRect();
  press.fill = document.createElement("div");
  press.fill.className = "ops-hold-fill";
  Object.assign(press.fill.style, { left: `${b.left + scrollX}px`, top: `${b.top + scrollY}px`,
    width: `${b.width}px`, height: `${b.height}px` });
  document.body.appendChild(press.fill);
  press.fill.getBoundingClientRect();   // start from scaleX(0)
  press.fill.classList.add("ops-sweep");
  press.timer = setTimeout(liftStop, HOLD_MS);
}

function cancelPress() {
  if (!press) return;
  clearTimeout(press.timer);
  cancelAnimationFrame(press.raf);
  press.fill.remove();
  press = null;
}

function liftStop() {
  const p = press;
  p.active = true;
  p.fill.remove();
  if (navigator.vibrate) navigator.vibrate(25);
  p.rows = [...p.row.parentElement.querySelectorAll("[data-drag]")];
  // Each stop's slot: its height plus the gap to the next card.
  p.rects = p.rows.map((r, k) => {
    const b = r.getBoundingClientRect(), next = p.rows[k + 1];
    const h = next ? next.getBoundingClientRect().top - b.top : b.height + 5;
    return { top: b.top + scrollY, h };
  });
  p.grab = p.y + scrollY - p.rects[p.i].top;
  p.row.classList.add("ops-lifted");
  p.rows.forEach((r, k) => { if (k !== p.i) r.classList.add("ops-sliding"); });
  dragTo();
  edgeScroll();
}

/** Follow the finger; the stops between the old and new place slide by one row. */
function dragTo() {
  const p = press;
  const top = p.y + scrollY - p.grab;
  const centre = top + p.rects[p.i].h / 2;
  p.target = p.rects.filter((r, k) => k !== p.i && centre > r.top + r.h / 2).length;
  const h = p.rects[p.i].h;
  p.row.style.transform = `translateY(${top - p.rects[p.i].top}px)`;
  p.rows.forEach((r, k) => {
    if (k === p.i) return;
    const dy = p.i < k && k <= p.target ? -h : p.target <= k && k < p.i ? h : 0;
    r.style.transform = dy ? `translateY(${dy}px)` : "";
  });
}

function edgeScroll() {
  const p = press;
  if (!p || !p.active) return;
  const dy = p.y < EDGE ? -Math.ceil((EDGE - p.y) / 6)
    : p.y > innerHeight - EDGE ? Math.ceil((p.y - (innerHeight - EDGE)) / 6) : 0;
  if (dy) { scrollBy(0, dy); dragTo(); }
  p.raf = requestAnimationFrame(edgeScroll);
}

function dropStop() {
  const p = press;
  if (!p) return;
  cancelPress();
  if (!p.active) return;
  if (p.target !== p.i) {
    store.routes[p.route] = moveStop(storeStops(store, p.route), p.i, p.target);
    saveStore(store);
    lastMoved = { route: p.route, i: p.target };
  }
  render();
}

function dragRow(e) {
  if (store.my || e.target.closest("button, a, input, select")) return null;
  return e.target.closest("[data-drag]");
}

function wireDrag(page) {
  page.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) { cancelPress(); return; }
    const row = dragRow(e);
    if (row) startPress(row, e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  document.addEventListener("touchmove", e => {
    if (!press) return;
    press.x = e.touches[0].clientX; press.y = e.touches[0].clientY;
    if (!press.active) {
      if (Math.hypot(press.x - press.x0, press.y - press.y0) > SLOP) cancelPress();   // a scroll
      return;
    }
    e.preventDefault();
    dragTo();
  }, { passive: false });
  document.addEventListener("touchend", dropStop);
  document.addEventListener("touchcancel", () => { if (press && press.active) dropStop(); else cancelPress(); });
  page.addEventListener("contextmenu", e => { if (e.target.closest("[data-drag]")) e.preventDefault(); });
  page.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    const row = dragRow(e);
    if (row) { e.preventDefault(); startPress(row, e.clientX, e.clientY); }
  });
  document.addEventListener("mousemove", e => {
    if (!press) return;
    press.x = e.clientX; press.y = e.clientY;
    if (!press.active) {
      if (Math.hypot(press.x - press.x0, press.y - press.y0) > SLOP) cancelPress();
      return;
    }
    dragTo();
  });
  document.addEventListener("mouseup", dropStop);
}

/* ── Driver view ────────────────────────────────────────── */

let details = {};   // customer_details.json (+ local notes in a preview): address, notes, position

let openDetails = null;   // customer id whose Notes panel is open (one at a time)
let theftOpen = null;     // customer id whose theft form is open
let activeId = null;      // customer id showing its controls; null = the next one to collect
let compact = true;       // only the active stop shows controls (a per-phone preference)

const COMPACT_KEY = "bbb-ops-compact";
try { compact = window.localStorage.getItem(COMPACT_KEY) !== "off"; } catch (err) { /* default on */ }

/**
 * The route being driven, built for a phone in a cold truck:
 *   - each stop is one line: name, then "(~87 gal / 300) [28]";
 *   - in Compact (the default) only one stop shows its controls: the next one
 *     to collect, or whichever line the driver taps. Save moves on to the next;
 *   - controls are one row: gallons, Save, Maps, Notes (1-3 typed = empty);
 *   - Theft sits in the Notes panel, beside Customer page, so it is never one
 *     slip from Save. It opens a form (gallons still in the barrel, an optional
 *     note); a saved theft is a collection in red, its note under the name;
 *   - collected stops turn green and drop below the rest, in the order collected;
 *   - the tally and truck bar sit under the list, then the pin map.
 */
function renderDriver() {
  const route = routeList.find(r => String(r.route_id) === String(store.my.routeId));
  const stops = storeStops(store, store.my.routeId);
  if (!route || !stops.length) { store.my = null; saveStore(store); return renderList(); }
  const { lines } = routeSummary(stops, data.index);
  const truck = truckByName(store.trucks[route.route_id]);
  const done = lines.map(l => todaysCollection(store, l.stop.customer_id));
  const live = liveRouteTotals(lines, store);
  const thefts = done.filter(c => c && c.theft).length;

  // Uncollected stops in route order, then collected ones in the order entered.
  const entered = new Map(store.collections.filter(c => c.date === todayIso()).map((c, k) => [c.customer_id, k]));
  const order = lines.map((l, k) => k).sort((a, b) =>
    (done[a] ? entered.get(lines[a].stop.customer_id) : -1) - (done[b] ? entered.get(lines[b].stop.customer_id) : -1) || a - b);
  const next = order.find(k => !done[k]);
  const current = activeId !== null && lines.some(l => l.stop.customer_id === activeId)
    ? activeId : (next !== undefined ? lines[next].stop.customer_id : null);

  const share = g => (truck ? Math.max(0, 100 * g / truck.capacity) : 0);
  const solid = Math.min(100, share(live.collected));
  const light = Math.min(100 - solid, share(live.remaining));
  const over = truck && live.projected > truck.capacity;

  document.getElementById("page").innerHTML = `
    <div class="d-flex align-items-center gap-2 mb-2">
      <div class="ops-drive-title flex-grow-1">${escapeHtml(route.name)}</div>
      <label class="form-check-label text-nowrap small"><input type="checkbox" class="form-check-input" id="compact"
        ${compact ? "checked" : ""}> Compact</label>
      <button type="button" class="btn btn-outline-secondary btn-sm text-nowrap" data-act="change">All routes</button>
    </div>
    ${order.map(k => stopHtml(lines[k], k, done[k], !compact || lines[k].stop.customer_id === current)).join("")}
    <div class="mt-2">
      <div class="ops-route-sum"><strong>Total: ${formatNumber(live.collected)}</strong> of
        ${formatWhole(live.projected)} projected gal · ${live.done} of ${lines.length} stops${thefts
        ? ` · ${thefts} theft${thefts === 1 ? "" : "s"}` : ""}</div>
      ${truck ? `<div class="d-flex align-items-center gap-2 mt-1">
        <div class="progress flex-grow-1">
          <div class="progress-bar ${over ? "bg-danger" : "bg-success"}" style="width:${solid}%"></div>
          <div class="progress-bar ${over ? "bg-danger" : "bg-success"} ops-bar-pending" style="width:${light}%"></div>
        </div>
        <span class="small text-muted text-nowrap">${Math.round(share(live.projected))}% of ${escapeHtml(truck.name)}'s ${formatNumber(truck.capacity)} gal</span></div>` : ""}
    </div>
    <div id="route-map" class="ops-map mt-3 mb-1"></div>
    <div class="ops-muted mb-3" id="map-note"></div>`;
  drawRouteMap(lines, done);
}

function mapsUrl(id) {
  const d = details[String(id)] || {};
  const dest = d.lat != null && d.loc !== "town" ? `${d.lat},${d.lon}` : d.address;
  return dest ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}` : null;
}

/** One stop: its line, then (when it is the one showing) its control row, theft form or Notes. */
function stopHtml(l, k, c, showing) {
  const id = l.stop.customer_id;
  const open = showing && openDetails === id;
  const d = details[String(id)] || {};
  const maps = mapsUrl(id);
  const mapsBtn = maps
    ? `<a class="btn ops-plain-btn" href="${maps}" target="_blank" rel="noopener">Maps</a>`
    : `<button type="button" class="btn ops-plain-btn" disabled>Maps</button>`;
  const detailsBtn = `<button type="button" class="btn ops-plain-btn${d.notes ? " ops-flag" : ""}" data-act="details"
    data-id="${id}" aria-expanded="${open}">Notes ${open ? "▴" : "▾"}</button>`;
  const theft = c && c.theft;
  const theftForm = showing && theftOpen === id;
  const figures = theft && !showing
    ? `<span class="ops-line-figs ops-theft-text">${theftGallonsText(c)}</span>`
    : !showing && c
    ? `<span class="ops-line-figs text-success">✓ ${c.gallons <= 3 ? "Empty" : `${formatNumber(c.gallons)} gal`}</span>`
    : `<span class="ops-line-figs">${stopLabelHtml(l)}</span>`;
  const cls = theftForm ? " ops-theft-open" : (theft ? " ops-theft" : (c ? " ops-done" : ""));
  return `<div class="ops-line${cls}${showing && compact ? " ops-current" : ""}" data-pick="${id}">
    <div class="ops-line-head">
      <span class="ops-line-name${l.stop.must_get ? " hotlist" : ""}" title="${escapeHtml(l.stop.name)}">${escapeHtml(l.stop.name)}</span>
      ${figures}
    </div>
    ${theft && theft.note && !theftForm ? `<div class="ops-theft-note">${escapeHtml(theft.note)}</div>` : ""}
    ${theftForm ? `<div class="ops-theft-form">
      <label for="theft-gal-${k}" class="ops-theft-label">Theft. Gallons still in barrel:</label>
      <input type="number" inputmode="numeric" min="0" class="form-control" id="theft-gal-${k}" placeholder="gal"
        value="${theft ? c.gallons : ""}">
      <label for="theft-note-${k}">Note <span class="text-muted">(optional)</span></label>
      <textarea class="form-control" id="theft-note-${k}" rows="2" placeholder="What happened?">${theft ? escapeHtml(theft.note) : ""}</textarea>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-danger" data-act="theft-save" data-i="${k}">Save</button>
        <button type="button" class="btn ops-plain-btn" data-act="theft-cancel">Cancel</button>
      </div>
    </div>` : showing ? `<div class="ops-row">
      ${theft ? `<span class="me-auto ops-theft-text">${theftGallonsText(c)}</span>
             <button type="button" class="btn ops-plain-btn" data-act="theft" data-id="${id}">Edit</button>`
        : c ? `<span class="me-auto">${c.gallons <= 3 ? "Empty" : `${formatNumber(c.gallons)} gal`} ✓</span>
             <button type="button" class="btn ops-plain-btn" data-act="undo" data-id="${id}">Edit</button>`
          : `<input type="number" inputmode="numeric" min="0" class="form-control" id="gal-${k}" placeholder="gal"
               aria-label="Gallons for ${escapeHtml(l.stop.name)}">
             <button type="button" class="btn btn-success" data-act="save" data-i="${k}">Save</button>`}
      ${mapsBtn}${detailsBtn}
    </div>` : ""}
    ${open && !theftForm ? `<div class="ops-line-details">
      ${d.address ? (maps ? `<a href="${maps}" target="_blank" rel="noopener">${escapeHtml(d.address)}</a>` : escapeHtml(d.address)) : "No address on file"}
      ${d.notes ? `<div>Notes: ${notesHtml(id, d.notes)}</div>` : ""}
      <div class="mt-1 d-flex gap-2 align-items-center">
        <a class="btn ops-plain-btn ops-cust-btn" href="ops-customer.html?id=${id}&from=myroute">Customer page ›</a>
        ${c ? "" : `<button type="button" class="btn btn-danger ops-theft-btn ms-auto" data-act="theft" data-id="${id}">Theft</button>`}
      </div>
    </div>` : ""}
  </div>`;
}

function drawRouteMap(lines, done) {
  const map = L.map("route-map", { scrollWheelZoom: false });
  opsTileLayer().addTo(map);
  const pts = [];
  let townOnly = 0, missing = 0;
  lines.forEach((l, i) => {
    const d = details[String(l.stop.customer_id)];
    if (!d || d.lat == null) { missing++; return; }
    if (d.loc === "town") townOnly++;
    L.marker([d.lat, d.lon], { icon: routePinIcon("", !!done[i]) })
      .bindTooltip(escapeHtml(l.stop.name)).addTo(map);
    pts.push([d.lat, d.lon]);
  });
  if (pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 14 });
  else map.setView([44.26, -72.58], 8);
  const notes = [];
  if (townOnly) notes.push(`${townOnly} pin${townOnly === 1 ? " is a town centre" : "s are town centres"} (address not matched)`);
  if (missing) notes.push(`${missing} stop${missing === 1 ? " has" : "s have"} no position`);
  document.getElementById("map-note").textContent = notes.join(" · ");
}

/* ── Events ─────────────────────────────────────────────── */

function render() {
  if (store.my) renderDriver(); else renderList();
}

function onAct(b) {
  const d = b.dataset;
  const routeId = d.route !== undefined ? Number(d.route) : null;
  const i = Number(d.i);
  const stops = routeId !== null ? storeStops(store, routeId) : null;
  switch (d.act) {
    case "remove":   // gone at once; Undo puts it back in its place for a few seconds
      if (removed) clearTimeout(removed.timer);
      removed = { route: routeId, i, stop: stops[i],
        timer: setTimeout(() => { removed = null; render(); }, UNDO_MS) };
      store.routes[routeId] = removeStop(stops, i);
      break;
    case "unremove": {
      if (!removed) return;
      clearTimeout(removed.timer);
      const back = storeStops(store, removed.route).slice();
      if (!back.some(s => s.customer_id === removed.stop.customer_id)) back.splice(removed.i, 0, removed.stop);
      store.routes[removed.route] = back;
      lastMoved = { route: removed.route, i: removed.i };
      removed = null;
      break;
    }
    case "add": {
      const id = Number(d.id);
      const src = data.snap.assign_list.find(c => c.customer_id === id) ||
        store.added.find(c => c.customer_id === id);
      const row = data.index.get(id);
      assignToRoute(store, routeId, [{ customer_id: id, name: src.name,
        capacity: row && row.capacity != null ? row.capacity : (src.capacity ?? null) }], false);
      addSearch[routeId] = "";
      break;
    }
    case "set": store.my = { routeId }; activeId = null; openDetails = null; theftOpen = null; window.scrollTo(0, 0); break;
    case "save": {
      const stop = storeStops(store, store.my.routeId)[i];
      const gallons = parseInt(document.getElementById(`gal-${i}`).value, 10);
      if (!Number.isFinite(gallons) || gallons < 0) return;
      recordCollection(store, stop, gallons);
      activeId = null;      // on to the next stop to collect
      openDetails = null;
      break;
    }
    case "undo":
      store.collections = store.collections.filter(c =>
        !(c.date === todayIso() && c.customer_id === Number(d.id)));
      activeId = Number(d.id);   // stays open, back in its route place
      break;
    case "theft":   // open the theft form (Edit on a saved theft reopens it filled in)
      theftOpen = activeId = Number(d.id);
      openDetails = null;
      render();
      return;
    case "theft-cancel": theftOpen = null; render(); return;
    case "theft-save": {
      const stop = storeStops(store, store.my.routeId)[i];
      const typed = document.getElementById(`theft-gal-${i}`).value.trim();
      const gallons = typed === "" ? 0 : parseInt(typed, 10);
      if (!Number.isFinite(gallons) || gallons < 0) return;
      recordTheft(store, stop, gallons, document.getElementById(`theft-note-${i}`).value.trim());
      theftOpen = null;
      activeId = null;      // on to the next stop to collect
      openDetails = null;
      break;
    }
    case "details": {
      const id = Number(d.id);
      openDetails = openDetails === id ? null : id;
      render();
      return;
    }
    case "change": store.my = null; activeId = null; openDetails = null; theftOpen = null; break;
    default: return;
  }
  saveStore(store);
  render();
}

function wire() {
  const page = document.getElementById("page");
  wireDrag(page);
  page.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest("[data-act]");
    if (b) { onAct(b); return; }
    // Compact: a tap on a stop's line shows that stop's controls, and closes
    // any Notes or theft form left open on another stop.
    const line = e.target.closest && e.target.closest("[data-pick]");
    if (store.my && compact && line && !e.target.closest("a, input, textarea, label, button, .ops-line-details")) {
      const id = Number(line.dataset.pick);
      if (id !== activeId) { activeId = id; openDetails = null; theftOpen = null; render(); }
    }
  });
  page.addEventListener("toggle", e => {
    const id = e.target.dataset && e.target.dataset.routeBox;
    if (id === undefined) return;
    if (e.target.open) openRoutes.add(Number(id)); else openRoutes.delete(Number(id));
  }, true);
  page.addEventListener("change", e => {
    const t = e.target;
    if (t.id === "compact") {
      compact = t.checked;
      try { window.localStorage.setItem(COMPACT_KEY, compact ? "on" : "off"); } catch (err) { /* ignore */ }
      activeId = null; openDetails = null; theftOpen = null;
      render();
      return;
    }
    if (t.dataset.truck !== undefined) {
      store.trucks[t.dataset.truck] = t.value;
    } else return;
    saveStore(store);
    render();
  });
  page.addEventListener("input", e => {
    const id = e.target.dataset && e.target.dataset.addSearch;
    if (id === undefined) return;
    addSearch[id] = e.target.value;
    // Only the results redraw, so typing keeps focus.
    page.querySelector(`[data-add-results="${id}"]`).innerHTML = addMatchesHtml(Number(id));
  });
}

async function init() {
  document.getElementById("nav").innerHTML = opsNavHtml("myroute");
  try {
    [data, details] = await Promise.all([loadOpsData(), loadCustomerDetails()]);
  } catch (err) {
    document.getElementById("page").innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
    return;
  }
  store = loadStore(data.snap);
  routeList = opsRouteList(data.snap);
  const banner = document.getElementById("banner");
  banner.innerHTML = shadowBannerHtml(store, data.snap);
  wireShadowReset(banner, data.snap, fresh => {
    store = fresh;
    banner.innerHTML = shadowBannerHtml(store, data.snap);
    render();
  });
  wire();
  render();
}

init();
</script>
