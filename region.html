<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Region Detail — Black Bear Biodiesel</title>

  <link rel="stylesheet" href="dashboard.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>

<body>

<header>
  <a class="brand-home" href="index.html" aria-label="Back to dashboard">
    <img src="logo.png" alt="Black Bear Biodiesel" onerror="this.style.display='none'">
    <div>
      <div class="subtitle">Oil Collection Analytics</div>
      <h1>Black Bear Biodiesel</h1>
    </div>
  </a>
  <div class="header-center">
    <div class="page-name" id="page-name"></div>
    <nav class="main-nav" id="main-nav"></nav>
  </div>
  <div class="last-updated" id="last-updated"></div>
</header>

<div class="page" id="page">
  <div class="page-state">
    <div class="state-message">Loading region data…</div>
  </div>
</div>

<script src="dashboard-utils.js"></script>
<script>
/*
 * This page reads oil_data.json for the region aggregates, and the records in
 * oil_collections.json for the per-customer list.
 *
 * Regions are defined by REGION_TOWNS in oil_scraper.py and exported as monthly
 * and yearly aggregates. Which customers belong to a region is NOT re-derived
 * here — doing that would mean re-implementing the region matchers in the
 * browser and risking disagreement with the Excel report. Membership comes from
 * the exported region_customers map, and the period filter below only ever
 * narrows that set by month. Records carry no region of their own, so
 * intersecting them with the exported member ids is what keeps this page and
 * the Excel report in agreement.
 */

/* ─────────────────────────────────────────────
 * State for the Top Producing Customers filter.
 *
 * render() writes the whole page in one innerHTML pass and builds two Chart
 * instances that are never destroyed, so it must run exactly once. The filter
 * therefore re-renders only the customer section, and the values it needs live
 * out here rather than in render()'s locals.
 * ───────────────────────────────────────────── */
let regionRecords = [];      // pickup rows for this region's members only
let regionMonths = [];       // ascending "YYYY-MM" this region has data in
let regionYears = [];        // ascending calendar years, from regionMonths
let regionMonthTotals = {};  // month -> gallons, for the period denominator
let regionMemberCount = 0;   // how many customers the region has in total
let customerSortMode = "gallons";

async function init() {
  const page = document.getElementById("page");

  let data;
  try {
    data = await loadOilData();
  } catch (err) {
    renderNav("region", null);
    renderState(page, "error", "Could not load the summary data.", err.message);
    return;
  }

  renderNav("region", data);
  renderLastUpdated(data);

  const monthlyRows = data.monthly_by_region || [];
  const yearlyRows = data.yearly_by_region || [];

  if (!monthlyRows.length) {
    renderState(page, "empty", "No region data is available.",
      "oil_data.json does not contain monthly_by_region. Re-run oil_scraper.py to generate it.");
    return;
  }

  // region_names holds the named regions, already ordered by current-year
  // gallons. "Other" also appears in the data as the catch-all for records
  // matching no region, so it is offered last.
  const named = data.region_names || [];
  const present = Array.from(new Set(monthlyRows.map(r => r.region)));
  const extras = present.filter(r => !named.includes(r)).sort();
  const options = named.concat(extras);

  const requested = getUrlParam("region");
  const match = options.find(r => r.toLowerCase() === requested.toLowerCase());
  const region = match || options[0];

  document.title = `${region} — Black Bear Biodiesel`;

  const monthly = monthlyRows.filter(r => r.region === region);
  const yearly = yearlyRows.filter(r => r.region === region);

  if (!monthly.length) {
    renderState(page, "empty", `No collections recorded for the ${region} region.`);
    return;
  }

  // Region membership comes from oil_scraper.py, derived with the same
  // CUSTOM_REGIONS matchers the Excel report uses, so the two cannot drift.
  // Regions are NOT exclusive: a customer matching two regions appears in both.
  const memberIds = new Set((data.region_customers || {})[region] || []);

  regionMemberCount = memberIds.size;

  if (memberIds.size) {
    try {
      // Same cached payload loadCustomerLifecycle uses, so this is not a second
      // fetch — the records were already downloaded and parsed, just unused.
      const records = await loadCollections(data);
      regionRecords = records.filter(r => memberIds.has(r.customer_id));
    } catch (err) {
      // The summary above still renders; only the customer table is missing.
      regionRecords = [];
    }
  }

  // What this region contains, exported by oil_scraper.py from the same config
  // that decides membership, so the label cannot drift from the matchers.
  const regionDescription = (data.region_descriptions || {})[region] || "";

  render(page, region, options, monthly, yearly, named,
         (data.region_stats || {})[region], regionDescription,
         (data.projection || {}).latest_data_date);
}

function render(page, region, options, monthly, yearly, named, regionStats,
                regionDescription, latestDataDate) {
  renderPageName(`${region} Region`);

  const monthTotals = {};
  monthly.forEach(r => { monthTotals[r.month] = (monthTotals[r.month] || 0) + (Number(r.gallons) || 0); });

  const yearTotals = {};
  yearly.forEach(r => { yearTotals[r.year] = (yearTotals[r.year] || 0) + (Number(r.gallons) || 0); });

  const months = Object.keys(monthTotals).sort();
  const years = Object.keys(yearTotals).sort();

  const latestMonth = months[months.length - 1];
  const currentYear = years[years.length - 1];
  const allTime = Object.values(monthTotals).reduce((a, b) => a + b, 0);

  const isOther = !named.includes(region);

  // Average gallons per month over the last two years of available data.
  // Only months that actually have data are counted — a month the region has
  // not reached yet is not averaged in as a zero, which would drag it down.
  const recentMonths = months.filter(m => {
    const cutoff = new Date(Number(latestMonth.slice(0, 4)),
                            Number(latestMonth.slice(5)) - 1);
    cutoff.setMonth(cutoff.getMonth() - 23);
    const key = `${cutoff.getFullYear()}-${String(cutoff.getMonth() + 1).padStart(2, "0")}`;
    return m >= key;
  });
  const avgMonthsUsed = recentMonths.length;
  const avgMonthly = avgMonthsUsed
    ? Math.round(recentMonths.reduce((sum, m) => sum + monthTotals[m], 0) / avgMonthsUsed)
    : 0;

  // Hand the customer filter the region's own months and totals. Using the same
  // monthly_by_region figures the charts use means the period denominator in the
  // note can never disagree with the numbers above it, and the pickers can never
  // offer a period this region has no data for.
  // Seasonal shape for this region, scaled to its own projected current year.
  // oil_data.json only carries a company-wide projection, so it is derived here.
  const seasonality = seasonalityProfile(
    monthTotals,
    latestDataDate,
    regionProjection(monthTotals, latestDataDate)
  );

  regionMonthTotals = monthTotals;
  regionMonths = months;
  regionYears = years;

  // Source-site active customers in this region. Exported by oil_scraper.py so
  // the region matchers stay in one place. Never inferred from pickup recency.
  const activeCount = regionStats ? regionStats.active : undefined;
  // Explicit null test: Number(null) is 0 and would render a missing count
  // as "0" rather than saying the status is unavailable.
  const activeDisplay = (activeCount === null || activeCount === undefined
                         || !Number.isFinite(Number(activeCount)))
    ? "Active unavailable"
    : formatNumber(activeCount);

  page.innerHTML = `
    <a class="back-link" href="index.html">← Back to the dashboard</a>
    <div class="page-subtitle">
      ${escapeHtml(formatMonth(months[0]))} – ${escapeHtml(formatMonth(latestMonth))}
      ${isOther ? " · unassigned bucket" : ""}
    </div>

    <div class="controls">
      <label for="region-select">Region</label>
      <select id="region-select">
        ${options.map(r => `
          <option value="${escapeHtml(r)}"${r === region ? " selected" : ""}>
            ${escapeHtml(r)}${named.includes(r) ? "" : " (unassigned)"}
          </option>`).join("")}
      </select>
      ${regionDescription ? `
      <div class="region-includes">
        <span class="region-includes-label">Includes</span>
        <span class="region-includes-list">${escapeHtml(regionDescription)}</span>
      </div>` : ""}
    </div>

    <div class="stats-bar">
      <div class="stat">
        <div class="stat-val">${formatNumber(allTime)}</div>
        <div class="stat-label">All-Time Gallons</div>
      </div>
      <div class="stat">
        <div class="stat-val">${formatNumber(yearTotals[currentYear])}</div>
        <div class="stat-label">${escapeHtml(currentYear)} Gallons</div>
      </div>
      <div class="stat">
        <div class="stat-val">${formatNumber(monthTotals[latestMonth])}</div>
        <div class="stat-label">${escapeHtml(formatMonth(latestMonth))}</div>
      </div>
      <div class="stat">
        <div class="stat-val">${formatNumber(avgMonthly)}</div>
        <div class="stat-label">Avg Monthly Gallons</div>
        <div class="stat-sub">last ${formatNumber(avgMonthsUsed)} months with data</div>
      </div>
      <div class="stat">
        <div class="stat-val">${activeDisplay}</div>
        <div class="stat-label">Active Customers</div>
      </div>
    </div>

    <div class="note">
      <strong>Regions are not mutually exclusive.</strong> A customer matching two
      region rules is counted in both, so region totals are not additive and will
      not sum to the all-time company total. This mirrors the region logic used by
      the Excel report and is intentional.
      ${isOther ? "<br><strong>" + escapeHtml(region) + "</strong> is the catch-all bucket for records that match no named region." : ""}
      ${regionStats && Number.isFinite(Number(regionStats.customers))
        ? `<br><strong>Active Customers</strong> counts source-site active customers
           out of ${formatNumber(regionStats.customers)} total in this region.
           It is not derived from how recently a customer had a pickup.` : ""}
    </div>

    <div class="section chart-grid">
      <div>
        <div class="chart-title">Monthly Gallons</div>
        <div class="chart-container"><canvas id="chart-monthly"></canvas></div>
      </div>
      <div>
        <div class="chart-title">Yearly Totals</div>
        <div class="chart-container"><canvas id="chart-yearly"></canvas></div>
      </div>
    </div>

    <div class="section">
      <div class="chart-title">Seasonality-Adjusted Monthly Profile</div>
      ${seasonality ? `
        <div class="tab-caption">
          Each year is normalized by its annual total, so this shows seasonal
          shape rather than growth. Weighted toward recent years
          (${escapeHtml(String(seasonality.currentYear))} 40%,
          ${escapeHtml(String(seasonality.currentYear - 1))} 30%,
          ${escapeHtml(String(seasonality.currentYear - 2))} 20%,
          ${escapeHtml(String(seasonality.currentYear - 3))} 10%).
          ${seasonality.usedCurrent ? `${escapeHtml(String(seasonality.currentYear))}
            contributes only its completed months, so
            ${escapeHtml(MONTH_LABELS[seasonality.fullyElapsed] || "later months")}
            onward is averaged over the earlier years.` : ""}
          Scaled to this region's projected
          ${escapeHtml(String(seasonality.currentYear))} total of
          ${formatNumber(Math.round(seasonality.scale))} gallons.
        </div>
        <div class="chart-container"><canvas id="chart-seasonality"></canvas></div>
      ` : `
        <div class="note">
          Not enough complete years to calculate a seasonality profile.
        </div>`}
    </div>

    <div class="section">
      <div class="section-title">
        Top Producing Customers — ${escapeHtml(region)}
        <span id="region-customer-count"></span>
      </div>
      ${regionRecords.length ? `
        <div class="controls">
          <label for="cust-mode-select">Period</label>
          <select id="cust-mode-select">
            ${VIEW_MODES.map(m => `
              <option value="${escapeHtml(m.value)}"${m.value === "alltime" ? " selected" : ""}>
                ${escapeHtml(m.label)}
              </option>`).join("")}
          </select>

          <!-- Only one of these shows at a time; applyPeriodPickers decides
               which, exactly as it does on the customers page. -->
          <label id="cust-month-label" for="cust-month-select">Month</label>
          <select id="cust-month-select">
            ${months.slice().reverse().map(m => `
              <option value="${escapeHtml(m)}"${m === latestMonth ? " selected" : ""}>
                ${escapeHtml(formatMonth(m))}
              </option>`).join("")}
          </select>

          <label id="cust-year-label" for="cust-year-select">Year</label>
          <select id="cust-year-select">
            ${years.slice().reverse().map(y => `
              <option value="${escapeHtml(y)}"${y === currentYear ? " selected" : ""}>
                ${escapeHtml(y)}
              </option>`).join("")}
          </select>

          <label>Sort</label>
          <button id="cust-sort-gallons" class="active">Top producers</button>
          <button id="cust-sort-status">Active first</button>
        </div>
        <div class="note" id="region-customer-note"></div>
        <div id="region-customer-list"></div>
      ` : `<div class="note">No customer-level detail is available for this region.</div>`}
    </div>

    <div class="section chart-grid">
      <div>
        <div class="section-title">Yearly Totals</div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Year</th><th class="num">Gallons</th></tr></thead>
            <tbody>
              ${years.slice().reverse().map(y => `
                <tr>
                  <td><a href="year.html?year=${encodeURIComponent(y)}">${escapeHtml(y)}</a></td>
                  <td class="gal">${formatNumber(yearTotals[y])}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
      </div>

      <div>
        <div class="section-title">Monthly Totals</div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Month</th><th class="num">Gallons</th></tr></thead>
            <tbody>
              ${months.slice().reverse().map(m => `
                <tr>
                  <td>${escapeHtml(formatMonth(m))}</td>
                  <td class="gal">${formatNumber(monthTotals[m])}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  if (regionRecords.length) {
    document.getElementById("cust-mode-select")
      .addEventListener("change", updateRegionCustomers);
    document.getElementById("cust-month-select")
      .addEventListener("change", updateRegionCustomers);
    document.getElementById("cust-year-select")
      .addEventListener("change", updateRegionCustomers);
    document.getElementById("cust-sort-gallons")
      .addEventListener("click", () => setCustomerSort("gallons"));
    document.getElementById("cust-sort-status")
      .addEventListener("click", () => setCustomerSort("status"));

    updateRegionCustomers();
  }

  new Chart(
    document.getElementById("chart-monthly"),
    lineChartConfig(months.map(formatMonth), months.map(m => monthTotals[m]))
  );

  new Chart(
    document.getElementById("chart-yearly"),
    barChartConfig(years, years.map(y => yearTotals[y]))
  );

  if (seasonality) {
    // barChartConfig's shared tooltip prints gallons only; this chart needs the
    // share alongside them, so the callback is overridden on the way past.
    const config = barChartConfig(
      MONTH_LABELS,
      seasonality.gallons.map(g => Math.round(g))
    );
    config.options.plugins.tooltip.callbacks.label = ctx =>
      `${formatNumber(ctx.parsed.y)} gal ` +
      `(${(seasonality.shares[ctx.dataIndex] * 100).toFixed(1)}% of a year)`;

    new Chart(document.getElementById("chart-seasonality"), config);
  }

  document.getElementById("region-select").addEventListener("change", function () {
    window.location.href = `region.html?region=${encodeURIComponent(this.value)}`;
  });
}

/* ─────────────────────────────────────────────
 * Seasonality-adjusted monthly profile
 *
 * Separates seasonal SHAPE from growth: each year's months are divided by that
 * year's own annual total, the years are averaged with recent ones weighted
 * heavier, and the resulting shares are scaled back to gallons.
 *
 * NOTE ON DIVERGENCE: index.html has a chart of the same name that uses a plain
 * unweighted average and drops partial years entirely. This one is weighted and
 * folds in the current year's completed months. The two will not agree; the
 * caption below states this one's method so the difference is visible.
 * ───────────────────────────────────────────── */

const MONTH_KEYS = Array.from({ length: 12 },
  (_, i) => String(i + 1).padStart(2, "0"));
const MONTH_LABELS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                      "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

// Recent years count for more. The current year leads because it is the best
// evidence of how this region behaves now, but it only ever contributes the
// months it has actually completed — see seasonalityProfile.
const SEASONALITY_WEIGHTS = { 0: 0.40, 1: 0.30, 2: 0.20, 3: 0.10 };  // offset from current year
const MIN_COMPLETE_YEARS = 2;

/**
 * This region's projected current-year gallons.
 *
 * Deliberately the same method as compute_projection() in oil_scraper.py:
 * compare year-to-date against the previous year prorated to the same point in
 * the calendar, then apply that ratio to the previous year's full total.
 * oil_data.json exports a projection for the business as a whole only, so a
 * per-region figure has to be derived here.
 *
 * KEEP IN STEP with oil_scraper.py:926 if that formula ever changes.
 *
 * Anchored to the dataset's latest collection date, never to the region's own
 * last month: a region with no August pickups collected zero in August, which
 * is real data, not a gap.
 */
function regionProjection(monthTotals, latestDataDate) {
  if (!latestDataDate) return null;

  const [yStr, mStr, dStr] = String(latestDataDate).split("-");
  const year = Number(yStr), month = Number(mStr), day = Number(dStr);
  if (!year || !month || !day) return null;

  const prev = year - 1;
  const daysInMonth = new Date(prev, month, 0).getDate();
  const fraction = day / daysInMonth;

  const gallons = (y, m) => Number(monthTotals[`${y}-${MONTH_KEYS[m - 1]}`]) || 0;

  let currentYtd = 0, prevFull = 0, prevPrior = 0;
  for (let m = 1; m <= 12; m++) {
    currentYtd += gallons(year, m);
    prevFull += gallons(prev, m);
    if (m < month) prevPrior += gallons(prev, m);
  }
  const prevProrated = prevPrior + fraction * gallons(prev, month);

  if (prevProrated <= 0 || prevFull <= 0 || currentYtd <= 0) return null;
  return prevFull * (currentYtd / prevProrated);
}

/**
 * Average share of the annual total falling in each month, scaled to gallons.
 *
 * The current year is normalized by its PROJECTED annual rather than its
 * year-to-date, so its shares sit on the same twelve-month basis as the
 * complete years. Dividing by a part-year total would inflate every one of its
 * months, which is the very distortion this chart exists to remove.
 *
 * It also contributes only months that have fully elapsed. Where it is absent
 * its weight is dropped and the remaining years are renormalized, so every
 * month is an average of whatever years genuinely have it.
 *
 * Returns null when there is too little history to average.
 */
function seasonalityProfile(monthTotals, latestDataDate, projected) {
  if (!latestDataDate) return null;
  const [yStr, mStr] = String(latestDataDate).split("-");
  const currentYear = Number(yStr);
  const latestMonth = Number(mStr);
  if (!currentYear || !latestMonth) return null;

  // The latest month is still in progress, so the one before it is the last
  // that can be compared against a full month in another year.
  const fullyElapsed = latestMonth - 1;

  const annual = {};
  for (const offset of Object.keys(SEASONALITY_WEIGHTS).map(Number)) {
    const y = currentYear - offset;
    let total = 0;
    for (let m = 1; m <= 12; m++) {
      total += Number(monthTotals[`${y}-${MONTH_KEYS[m - 1]}`]) || 0;
    }
    annual[y] = (y === currentYear) ? projected : total;
  }

  const completeYears = Object.keys(SEASONALITY_WEIGHTS).map(Number)
    .map(o => currentYear - o)
    .filter(y => y !== currentYear && annual[y] > 0);
  if (completeYears.length < MIN_COMPLETE_YEARS) return null;

  const shares = MONTH_KEYS.map((key, i) => {
    let weighted = 0, weight = 0;
    for (const [offsetStr, w] of Object.entries(SEASONALITY_WEIGHTS)) {
      const y = currentYear - Number(offsetStr);
      if (!annual[y] || annual[y] <= 0) continue;
      if (y === currentYear && (i + 1) > fullyElapsed) continue;
      weighted += w * ((Number(monthTotals[`${y}-${key}`]) || 0) / annual[y]);
      weight += w;
    }
    return weight ? weighted / weight : 0;
  });

  // Renormalize so the twelve shares sum to 1 and the gallons below therefore
  // sum to the scale exactly.
  const total = shares.reduce((a, b) => a + b, 0);
  if (!(total > 0)) return null;
  const normalized = shares.map(s => s / total);

  const usedCurrent = fullyElapsed >= 1 && annual[currentYear] > 0;
  const scale = projected > 0
    ? projected
    : completeYears.reduce((a, y) => a + annual[y], 0) / completeYears.length;

  return {
    shares: normalized,
    gallons: normalized.map(s => s * scale),
    scale,
    completeYears: completeYears.slice().sort(),
    currentYear,
    usedCurrent,
    fullyElapsed
  };
}

/** Switch the customer sort and repaint, mirroring the customers page. */
function setCustomerSort(mode) {
  customerSortMode = mode;
  document.getElementById("cust-sort-gallons")
    .classList.toggle("active", mode === "gallons");
  document.getElementById("cust-sort-status")
    .classList.toggle("active", mode === "status");
  updateRegionCustomers();
}

/**
 * Repaint the Top Producing Customers section for the selected period and sort.
 *
 * Deliberately narrow: it writes the count, the note and the list, and nothing
 * else. The stats bar, both charts and the monthly/yearly tables are untouched,
 * which is what keeps the never-destroyed Chart instances safe — this must
 * never grow into a call to render().
 */
function updateRegionCustomers() {
  const list = document.getElementById("region-customer-list");
  if (!list) return;

  const mode = document.getElementById("cust-mode-select").value;
  const monthSel = document.getElementById("cust-month-select");
  const yearSel = document.getElementById("cust-year-select");

  const picker = applyPeriodPickers(mode, {
    monthSelect: monthSel,
    monthLabel: document.getElementById("cust-month-label"),
    yearSelect: yearSel,
    yearLabel: document.getElementById("cust-year-label")
  });

  // Yearly works off the year dropdown, so the month handed downstream is any
  // month inside that year — getMonthsForMode expands it to the whole year.
  const selectedMonth = picker === "year"
    ? (regionMonths.filter(m => m.startsWith(yearSel.value)).pop()
       || regionMonths[regionMonths.length - 1])
    : monthSel.value;

  const periodMonths = new Set(getMonthsForMode(mode, regionMonths, selectedMonth));

  // Records carry no region, so membership is the exported region_customers set
  // that regionRecords was already filtered to. This only narrows it by month.
  const rows = regionRecords.filter(r => periodMonths.has(r.month));

  const aggregated = aggregateCustomers(rows);
  const customers = customerSortMode === "status"
    ? sortCustomersByStatusThenGallons(aggregated)
    : sortCustomersByGallons(aggregated);

  const label = periodLabel(mode, regionMonths, selectedMonth);
  const note = document.getElementById("region-customer-note");

  // Customers with a pickup in this period, against total membership, so a
  // filtered view never reads as though the region itself shrank.
  document.getElementById("region-customer-count").textContent =
    `(${formatNumber(customers.length)} of ${formatNumber(regionMemberCount)} in this region)`;

  // A new period starts from the top rather than keeping a previous expansion.
  list.dataset.expanded = "false";

  if (!customers.length) {
    note.innerHTML =
      `No customer in this region had a qualifying pickup in ` +
      `<strong>${escapeHtml(label)}</strong>.`;
    list.innerHTML = "";
    return;
  }

  const allTimeGallons = Object.values(regionMonthTotals)
    .reduce((a, b) => a + b, 0);

  note.innerHTML =
    `Ranked by qualifying gallons in <strong>${escapeHtml(label)}</strong>, ` +
    `totalling ${formatNumber(sumGallons(rows))} of the region's ` +
    `${formatNumber(allTimeGallons)} all-time. Status comes from the source ` +
    `site's active and inactive lists, not from how recently a customer had ` +
    `a pickup.`;

  renderExpandableCustomerList(
    list,
    customers,
    subset => customerTableHtml(subset, { town: true, dates: false })
  );
}

init();
</script>

</body>
</html>
