<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search — Black Bear Analytics</title>
  <!-- Links open in the dashboard's window, not in this frame. -->
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" crossorigin="anonymous">
  <link rel="stylesheet" href="ops.css?v=250ba27a">
  <link rel="stylesheet" href="dash-search.css?v=c66c107c">
</head>

<body class="dash-frame">
<div class="dash-frame-wait" id="wait">Loading…</div>

<script src="dashboard-utils.js?v=05d508d3"></script>
<script src="route-utils.js?v=343f24d5"></script>
<script src="ops-common.js?v=ca4df450"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js" integrity="sha384-rwykjmWNwVxboyFmvK9OXN0wj9hnMHA2aAHtits54DuACyCq0M2PrSNxhRb+hvXT" crossorigin="anonymous"></script>
<script src="site-gate.js?v=330ca4fa"></script>
<script src="ops-db.js?v=d2ed0858"></script>
<script src="ops-search.js?v=a5bcb8aa"></script>
<script>
/*
 * The dashboard pages' search (dash-search.js shows this page in a frame over
 * them; Sarge, 2026-11-25), as tall as its results. The Ops search as it is on the Ops pages, dark:
 * the shared routes open first, so + adds to the real routes, never to a copy
 * in this browser. Closing (‹, Escape, a tap outside) tells the dashboard to
 * hide the frame.
 */
let data = null, store = null;

async function init() {
  try {
    data = await loadOpsData();
    store = await opsOpenStore(data.snap, { index: data.index, onRemote: s => { store = s; opsSearchDraw(); } });
  } catch (err) {
    document.getElementById("wait").textContent = err.message;
    return;
  }
  document.getElementById("wait").hidden = true;
  opsSearchOpen();
}

// Tell the dashboard how tall the search is, so its frame fits it and the page stays in view below.
let lastHeight = 0;
function reportHeight() {
  const el = document.getElementById("ops-search");
  const wait = document.getElementById("wait");
  let h = wait && !wait.hidden ? wait.offsetHeight + 8 : 0;
  if (el && !el.hidden) {
    // The rows' own heights: the list itself stretches to fill the frame, so it cannot be measured.
    const top = el.querySelector(".ops-s-top"), list = el.querySelector("#ops-s-results"), bar = el.querySelector("#ops-s-bar");
    const rows = list ? [...list.children].reduce((t, c) => t + c.offsetHeight, 0) : 0;
    h = (top ? top.offsetHeight : 0) + rows + (bar ? bar.offsetHeight : 0) + 1;
  }
  if (h && h !== lastHeight) {
    lastHeight = h;
    window.parent.postMessage({ type: "dash-search-size", h }, window.location.origin);
  }
}
new MutationObserver(() => requestAnimationFrame(reportHeight))
  .observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true });
window.addEventListener("resize", reportHeight);

window.addEventListener("message", e => {
  if (e.origin !== window.location.origin || !e.data) return;
  if (e.data.type === "dash-search-open" && store) opsSearchOpen();
});

init();
</script>
</body>
</html>
