<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schmootz — Black Bear Biodiesel</title>

  <link rel="stylesheet" href="dashboard.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>

<body>

<header>
  <img src="logo.png" alt="Black Bear Biodiesel" onerror="this.style.display='none'">
  <div>
    <div class="subtitle">Oil Collection Analytics</div>
    <h1>Black Bear Biodiesel</h1>
  </div>
  <div class="page-name" id="page-name"></div>
  <nav class="main-nav" id="main-nav"></nav>
  <div class="last-updated" id="last-updated"></div>
</header>

<div class="page" id="page">
  <div class="page-state">
    <div class="state-message">Loading Schmootz data…</div>
  </div>
</div>

<script src="dashboard-utils.js"></script>
<script>
/*
 * Schmootz is site-to-site displacement, generated by export_schmootz.py from a
 * hand-maintained workbook. It is deliberately kept separate from the oil
 * collection totals: none of these gallons come from customer pickups, so they
 * must never be added to oil_data.json figures.
 */

// Both from the existing palette: the brand green, and the amber already used
// for the "Unknown" status badge. Two greens would be hard to tell apart when
// one series is ~6% the size of the other.
const SERIES_COLORS = ["#3fb950", "#d3a04a"];

async function init() {
  const page = document.getElementById("page");
  renderPageName("Schmootz");

  // The nav needs oil_data.json for its Years/Regions targets, but the Schmootz
  // page itself must still work if that file is unavailable.
  let oilData = null;
  try {
    oilData = await loadOilData();
  } catch (err) {
    oilData = null;
  }
  renderNav("schmootz", oilData);

  let data;
  try {
    const resp = await fetch(`schmootz_data.json?v=${Date.now()}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    data = await resp.json();
  } catch (err) {
    renderState(page, "empty", "Schmootz data is not available yet.",
      "Run python3 export_schmootz.py to generate schmootz_data.json from the source workbook.");
    return;
  }

  if (!data || !Array.isArray(data.blocks) || !data.blocks.length) {
    renderState(page, "empty", "The Schmootz export contains no data.",
      "Re-run python3 export_schmootz.py and check the workbook layout.");
    return;
  }

  const el = document.getElementById("last-updated");
  if (el && data.generated_at) {
    el.textContent = "Generated: " + new Date(data.generated_at).toLocaleString();
  }

  render(page, data);
}

function render(page, data) {
  const blocks = data.blocks;
  const years = data.years || [];
  const lastYear = data.last_year;

  // Which years are complete, so a partial final year is not read as a decline.
  const monthsInLastYear = Math.max(...blocks.map(b =>
    b.monthly.filter(m => m.year === lastYear).length), 0);
  const partialNote = monthsInLastYear && monthsInLastYear < 12
    ? `${lastYear} is partial — ${monthsInLastYear} month${monthsInLastYear === 1 ? "" : "s"} of data so far.`
    : "";

  page.innerHTML = `
    <a class="back-link" href="index.html">← Back to the dashboard</a>
    <div class="page-subtitle">
      Displacement between sites, ${escapeHtml(String(data.first_year))}–${escapeHtml(String(lastYear))}
    </div>

    <div class="note">
      Schmootz tracks displacement between Barr Hill, Black Bear Biodiesel Shop,
      and Gebbie Farm based on the source workbook.
      ${partialNote ? `<br>${escapeHtml(partialNote)}` : ""}
    </div>

    <div class="stats-bar">
      ${blocks.map(b => `
        <div class="stat">
          <div class="stat-val">${formatNumber(b.total_gallons)}</div>
          <div class="stat-label">${escapeHtml(b.label)}</div>
          <div class="stat-sub">${escapeHtml(String(b.first_year))}–${escapeHtml(String(b.last_year))}</div>
        </div>`).join("")}
      <div class="stat">
        <div class="stat-val">${formatNumber(data.combined_total)}</div>
        <div class="stat-label">Combined Total</div>
        <div class="stat-sub">all sources</div>
      </div>
      <div class="stat">
        <div class="stat-val">${formatNumber(years.length)}</div>
        <div class="stat-label">Years With Data</div>
        <div class="stat-sub">${formatNumber(data.record_count)} months recorded</div>
      </div>
    </div>

    <div class="section chart-grid">
      <div>
        <div class="chart-title">Yearly Displacement by Source</div>
        <div class="chart-container"><canvas id="chart-yearly"></canvas></div>
      </div>
      <div>
        <div class="chart-title">Monthly Trend</div>
        <div class="chart-container"><canvas id="chart-monthly"></canvas></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Source Summary</div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Source</th>
              <th>Destination</th>
              <th class="num">Total Gallons</th>
              <th class="num">Months</th>
              <th>Years</th>
            </tr>
          </thead>
          <tbody>
            ${blocks.map(b => `
              <tr>
                <td>${escapeHtml(b.source)}</td>
                <td>${escapeHtml(b.destination)}</td>
                <td class="gal">${formatNumber(b.total_gallons)}</td>
                <td class="num">${formatNumber(b.months_with_data)}</td>
                <td>${escapeHtml(String(b.first_year))}–${escapeHtml(String(b.last_year))}</td>
              </tr>`).join("")}
            <tr class="group-row">
              <td>Combined</td>
              <td>Gebbie Farm</td>
              <td class="gal">${formatNumber(data.combined_total)}</td>
              <td class="num">${formatNumber(data.record_count)}</td>
              <td>${escapeHtml(String(data.first_year))}–${escapeHtml(String(lastYear))}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Yearly Totals</div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Year</th>
              ${blocks.map(b => `<th class="num">${escapeHtml(b.label)}</th>`).join("")}
              <th class="num">Combined</th>
            </tr>
          </thead>
          <tbody>
            ${(data.combined_by_year || []).slice().reverse().map(row => `
              <tr>
                <td>${escapeHtml(String(row.year))}${row.year === lastYear && partialNote ? " *" : ""}</td>
                ${blocks.map(b => {
                  const v = row[b.key];
                  // A dash means the source was not yet reporting that year,
                  // which is different from a recorded zero.
                  return `<td class="num">${v === null || v === undefined ? "—" : formatNumber(v)}</td>`;
                }).join("")}
                <td class="gal">${formatNumber(row.combined)}</td>
              </tr>`).join("")}
            <tr class="group-row">
              <td>All years</td>
              ${blocks.map(b => `<td class="num">${formatNumber(b.total_gallons)}</td>`).join("")}
              <td class="gal">${formatNumber(data.combined_total)}</td>
            </tr>
          </tbody>
        </table>
      </div>
      ${partialNote ? `<div class="note">* ${escapeHtml(partialNote)}</div>` : ""}
    </div>

    <div class="section">
      <div class="note">
        Schmootz totals are generated from the uploaded workbook and are separate
        from the main oil collection scraper totals. They are not included in any
        gallons figure shown elsewhere on this site.
        <br>Source: ${escapeHtml(data.source_file || "workbook")}
        · sheet ${escapeHtml(data.source_sheet || "—")}
        · a dash means no movement was recorded for that period.
      </div>
    </div>
  `;

  buildYearlyChart(blocks, years);
  buildMonthlyChart(blocks);
}

/** Grouped bars, one series per source. */
function buildYearlyChart(blocks, years) {
  const options = chartDefaults();
  options.plugins.legend = { display: true, labels: { color: "#8b949e" } };
  options.plugins.tooltip.callbacks.label =
    ctx => `${ctx.dataset.label}: ${formatGallons(ctx.parsed.y)}`;

  new Chart(document.getElementById("chart-yearly"), {
    type: "bar",
    data: {
      labels: years,
      datasets: blocks.map((b, i) => ({
        label: b.label,
        backgroundColor: SERIES_COLORS[i % SERIES_COLORS.length],
        data: years.map(y => {
          const hit = b.by_year.find(e => e.year === y);
          return hit ? hit.gallons : null;
        }),
      })),
    },
    options,
  });
}

/** Both sources over time on a shared month axis. */
function buildMonthlyChart(blocks) {
  const allMonths = Array.from(
    new Set(blocks.flatMap(b => b.monthly.map(m => m.month)))
  ).sort();

  const options = chartDefaults();
  options.plugins.legend = { display: true, labels: { color: "#8b949e" } };
  options.plugins.tooltip.callbacks.label =
    ctx => `${ctx.dataset.label}: ${formatGallons(ctx.parsed.y)}`;

  new Chart(document.getElementById("chart-monthly"), {
    type: "line",
    data: {
      labels: allMonths.map(formatMonth),
      datasets: blocks.map((b, i) => {
        const lookup = {};
        b.monthly.forEach(m => { lookup[m.month] = m.gallons; });
        return {
          label: b.label,
          borderColor: SERIES_COLORS[i % SERIES_COLORS.length],
          backgroundColor: SERIES_COLORS[i % SERIES_COLORS.length],
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.25,
          // Gaps rather than a line dropping to zero for months with no data.
          spanGaps: false,
          data: allMonths.map(m => (m in lookup ? lookup[m] : null)),
        };
      }),
    },
    options,
  });
}

init();
</script>

</body>
</html>
