<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schmootz — Black Bear Biodiesel</title>

  <link rel="stylesheet" href="dashboard.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>

<body>

<header>
  <a class="brand-home" href="index.html" aria-label="Back to dashboard">
    <img src="logo.png" alt="Black Bear Biodiesel" onerror="this.style.display='none'">
    <div>
      <div class="subtitle">Oil Collection Analytics</div>
      <h1>Black Bear Biodiesel</h1>
    </div>
  </a>
  <div class="header-center">
    <div class="page-name" id="page-name"></div>
    <nav class="main-nav" id="main-nav"></nav>
  </div>
  <div class="last-updated" id="last-updated"></div>
</header>

<div class="page" id="page">
  <div class="page-state">
    <div class="state-message">Loading Schmootz data…</div>
  </div>
</div>

<script src="dashboard-utils.js"></script>
<script>
/*
 * Schmootz is site-to-site displacement, generated by export_schmootz.py from a
 * hand-maintained workbook. It is deliberately kept apart from the oil
 * collection totals: none of these gallons come from customer pickups, so they
 * must never be added to oil_data.json figures.
 *
 * Acronyms are expanded everywhere in visible text. The workbook uses BH, GF,
 * BB and MF internally; the page never shows those.
 */

const KEY_BARR_GEBBIE = "barr_hill_to_gebbie";
const KEY_SHOP_GEBBIE = "bbb_shop_to_gebbie";
const KEY_BARR_MONTPELIER = "barr_hill_to_montpelier";

// Column order for both tables, and the order of the source cards.
const SOURCE_ORDER = [KEY_BARR_GEBBIE, KEY_SHOP_GEBBIE, KEY_BARR_MONTPELIER];

// Brand green for the primary flow; the amber already used for Unknown status
// badges for the second. Two greens would be hard to separate at a glance.
const COLOR_GEBBIE = "#3fb950";
const COLOR_MONTPELIER = "#d3a04a";

/*
 * Rough physical equivalents for the headline total, so a seven-figure gallon
 * count means something. PRESENTATION ONLY — these never feed a stored figure
 * and are deliberately hedged with "about" in the copy.
 *
 * Every value is derived from combined_total at render time, so the panel
 * follows the workbook rather than needing its own numbers kept in step.
 */
const EQUIV = {
  TANKER_GALLONS: 7500,        // a full road tanker
  BARREL_GALLONS: 55,          // standard steel barrel
  TOTE_GALLONS: 275,           // standard IBC tote
  OLYMPIC_POOL_GALLONS: 660000,
  TRUCKS_PER_ICON: 25,         // one drawn truck stands for this many
  MAX_ICONS: 40                // a guard, not a limit we expect to reach
};

/**
 * Translate a gallon total into the equivalents shown under the hero number.
 * Returns null when the total is missing or not a positive number, so the
 * caller can leave the panel out rather than render "0 tanker trucks".
 */
function equivalents(totalGallons) {
  const total = Number(totalGallons);
  if (!Number.isFinite(total) || total <= 0) return null;

  const trucks = Math.round(total / EQUIV.TANKER_GALLONS);
  const icons = Math.max(
    1,
    Math.min(EQUIV.MAX_ICONS, Math.round(trucks / EQUIV.TRUCKS_PER_ICON))
  );

  // Derived from the icons actually drawn, not from TRUCKS_PER_ICON, so the
  // caption stays true if MAX_ICONS ever clamps the row. At today's total the
  // two agree at 25.
  const trucksPerIcon = Math.max(1, Math.round(trucks / icons));

  return {
    total,
    trucks,
    icons,
    trucksPerIcon,
    barrels: Math.round(total / EQUIV.BARREL_GALLONS),
    totes: Math.round(total / EQUIV.TOTE_GALLONS),
    // One decimal: a whole number would overstate the precision of a pool.
    pools: (total / EQUIV.OLYMPIC_POOL_GALLONS).toFixed(1)
  };
}

/*
 * A side-on tanker truck. The first inline SVG in this codebase, so it is kept
 * deliberately plain to match the hard-edged legend swatches used elsewhere:
 * no gradients, no strokes, and fill via currentColor so the colour lives in
 * dashboard.css rather than here.
 */
const TRUCK_SVG = `
  <svg class="equiv-truck" viewBox="0 0 48 24" width="48" height="24"
       aria-hidden="true" focusable="false">
    <rect x="15" y="5" width="25" height="11" rx="2.5" fill="currentColor"/>
    <path d="M2 8h8l5 5v3H2z" fill="currentColor"/>
    <circle cx="8" cy="19" r="3" fill="currentColor"/>
    <circle cx="29" cy="19" r="3" fill="currentColor"/>
    <circle cx="37" cy="19" r="3" fill="currentColor"/>
  </svg>`;

async function init() {
  const page = document.getElementById("page");
  renderPageName("Schmootz");

  // The nav needs oil_data.json for its Years/Regions targets, but this page
  // must still work if that file is unavailable.
  let oilData = null;
  try {
    oilData = await loadOilData();
  } catch (err) {
    oilData = null;
  }
  renderNav("schmootz", oilData);

  let data;
  try {
    const resp = await fetch(`schmootz_data.json?v=${Date.now()}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    data = await resp.json();
  } catch (err) {
    renderState(page, "empty", "Schmootz data is not available yet.",
      "Run python3 export_schmootz.py to generate schmootz_data.json from the source workbook.");
    return;
  }

  if (!data || !Array.isArray(data.blocks) || !data.blocks.length) {
    renderState(page, "empty", "The Schmootz export contains no data.",
      "Re-run python3 export_schmootz.py and check the workbook layout.");
    return;
  }

  const el = document.getElementById("last-updated");
  if (el && data.generated_at) {
    el.textContent = "Generated: " + new Date(data.generated_at).toLocaleString();
  }

  render(page, data);
}

function render(page, data) {
  const byKey = {};
  data.blocks.forEach(b => { byKey[b.key] = b; });
  const blocks = SOURCE_ORDER.map(k => byKey[k]).filter(Boolean);

  const lastYear = data.last_year;

  // Months of data in the most recent year, so a partial year is not read as a
  // collapse in volume.
  const monthsInLastYear = Math.max(0, ...blocks.map(b =>
    b.monthly.filter(m => m.year === lastYear).length));
  const partial = monthsInLastYear > 0 && monthsInLastYear < 12;
  const partialNote = partial
    ? `${lastYear} is partial — ${monthsInLastYear} month${monthsInLastYear === 1 ? "" : "s"} of data so far, so its totals are not comparable with full years.`
    : "";

  // Every month that appears in any source, for the monthly table.
  const allMonths = Array.from(
    new Set(blocks.flatMap(b => b.monthly.map(m => m.month)))
  ).sort();

  // key -> month -> gallons
  const lookup = {};
  blocks.forEach(b => {
    lookup[b.key] = {};
    b.monthly.forEach(m => { lookup[b.key][m.month] = m.gallons; });
  });

  const cell = (key, month) => {
    const v = lookup[key] ? lookup[key][month] : undefined;
    // A dash means the source was not reporting that period at all. An explicit
    // 0 from the workbook is real data and is shown as 0.
    return v === undefined || v === null ? "—" : formatNumber(v);
  };

  // Tangible equivalents for the hero number. null when the total is unusable,
  // which leaves the panel out entirely rather than showing zeros.
  const eq = equivalents(data.combined_total);

  page.innerHTML = `
    <a class="back-link" href="index.html">← Back to the dashboard</a>

    <div class="hero-stat">
      <div class="hero-value">${formatNumber(data.combined_total)}</div>
      <div class="hero-label">Total Waste Displaced (gallons)</div>
    </div>

    ${eq ? `
    <div class="equiv-panel">
      <div class="equiv-title">Waste Displaced in Real Terms</div>

      <div class="equiv-lead">
        <div class="equiv-callout">
          <div class="equiv-callout-val">≈ ${formatNumber(eq.trucks)}</div>
          <div class="equiv-callout-label">tanker trucks</div>
        </div>

        <div class="equiv-convoy-wrap">
          <div class="equiv-convoy">
            ${TRUCK_SVG.repeat(eq.icons)}
          </div>
          <div class="equiv-caption">
            Each truck represents about ${formatNumber(eq.trucksPerIcon)}
            full tanker trucks, at ${formatNumber(EQUIV.TANKER_GALLONS)} gallons each.
          </div>
        </div>
      </div>

      <div class="equiv-cards">
        <div class="equiv-card">
          <div class="equiv-card-val">${formatNumber(eq.barrels)}</div>
          <div class="equiv-card-label">standard barrels</div>
          <div class="equiv-card-sub">${formatNumber(EQUIV.BARREL_GALLONS)} gallons each</div>
        </div>
        <div class="equiv-card">
          <div class="equiv-card-val">${formatNumber(eq.totes)}</div>
          <div class="equiv-card-label">totes</div>
          <div class="equiv-card-sub">${formatNumber(EQUIV.TOTE_GALLONS)} gallons each</div>
        </div>
        <div class="equiv-card">
          <div class="equiv-card-val">${escapeHtml(eq.pools)}</div>
          <div class="equiv-card-label">Olympic pools</div>
          <div class="equiv-card-sub">${formatNumber(EQUIV.OLYMPIC_POOL_GALLONS)} gallons each</div>
        </div>
      </div>

      <div class="equiv-summary">
        ${formatNumber(eq.total)} gallons of waste displaced — roughly equivalent
        to ${formatNumber(eq.trucks)} full tanker trucks,
        ${formatNumber(eq.barrels)} standard barrels, or
        ${formatNumber(eq.totes)} ${formatNumber(EQUIV.TOTE_GALLONS)}-gallon totes.
      </div>
    </div>` : ""}

    <div class="stats-bar">
      ${blocks.map(b => `
        <div class="stat">
          <div class="stat-val">${formatNumber(b.total_gallons)}</div>
          <div class="stat-label">${escapeHtml(b.label)}</div>
          <div class="stat-sub">${escapeHtml(String(b.first_year))}–${escapeHtml(String(b.last_year))}
            · ${formatNumber(b.months_with_data)} months</div>
        </div>`).join("")}
    </div>

    <div class="note" style="margin-top:16px">
      Schmootz tracks displacement between Barr Hill, the Black Bear Biodiesel
      Shop, the Montpelier Facility, and Gebbie Farm, based on the source
      workbook.
      ${partial ? `<br>${escapeHtml(partialNote)}` : ""}
    </div>

    <div class="section">
      <div class="chart-title">Barr Hill displacement — Gebbie Farm and Montpelier Facility</div>
      <div class="tab-caption">
        Both destinations for material leaving Barr Hill. The Montpelier Facility
        route begins in ${escapeHtml(String(byKey[KEY_BARR_MONTPELIER]
          ? byKey[KEY_BARR_MONTPELIER].first_year : "—"))}.
      </div>
      <div class="chart-container"><canvas id="chart-barr-hill"></canvas></div>
    </div>

    <div class="section">
      <div class="chart-title">Black Bear Biodiesel Shop → Gebbie Farm</div>
      <div class="tab-caption">Monthly displacement from the shop.</div>
      <div class="chart-container"><canvas id="chart-shop"></canvas></div>
    </div>

    <div class="section">
      <div class="section-title">Yearly Totals</div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Year</th>
              ${blocks.map(b => `<th class="center">${escapeHtml(b.label)}</th>`).join("")}
              <th class="center">Combined Total</th>
            </tr>
          </thead>
          <tbody>
            ${(data.combined_by_year || []).slice().reverse().map(row => `
              <tr>
                <td>${escapeHtml(String(row.year))}${row.year === lastYear && partial ? " *" : ""}</td>
                ${blocks.map(b => {
                  const v = row[b.key];
                  return `<td class="center">${v === null || v === undefined ? "—" : formatNumber(v)}</td>`;
                }).join("")}
                <td class="gal center">${formatNumber(row.combined)}</td>
              </tr>`).join("")}
            <tr class="group-row">
              <td>All years</td>
              ${blocks.map(b => `<td class="center">${formatNumber(b.total_gallons)}</td>`).join("")}
              <td class="gal center">${formatNumber(data.combined_total)}</td>
            </tr>
          </tbody>
        </table>
      </div>
      ${partial ? `<div class="note" style="margin-top:12px">* ${escapeHtml(partialNote)}</div>` : ""}
    </div>

    <div class="section">
      <div class="section-title">Monthly Totals</div>
      <div class="section-caption">
        Newest first. A dash means the source was not reporting that month; a
        zero means it was reporting and nothing moved.
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Month</th>
              ${blocks.map(b => `<th class="center">${escapeHtml(b.label)}</th>`).join("")}
              <th class="center">Combined Total</th>
            </tr>
          </thead>
          <tbody>
            ${allMonths.slice().reverse().map(month => {
              const combined = blocks.reduce((sum, b) => {
                const v = lookup[b.key][month];
                return sum + (typeof v === "number" ? v : 0);
              }, 0);
              return `
                <tr>
                  <td>${escapeHtml(formatMonth(month))}</td>
                  ${blocks.map(b => `<td class="center">${cell(b.key, month)}</td>`).join("")}
                  <td class="gal center">${formatNumber(combined)}</td>
                </tr>`;
            }).join("")}
            <tr class="group-row">
              <td>All months</td>
              ${blocks.map(b => `<td class="center">${formatNumber(b.total_gallons)}</td>`).join("")}
              <td class="gal center">${formatNumber(data.combined_total)}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="section">
      <div class="note">
        Schmootz totals are generated from the uploaded workbook and are separate
        from the main oil collection scraper totals. They are not included in any
        gallons figure shown elsewhere on this site.
        <br>Source: ${escapeHtml(data.source_file || "workbook")}
        · sheet ${escapeHtml(data.source_sheet || "—")}.
      </div>
    </div>
  `;

  buildBarrHillChart(byKey, allMonths, lookup);
  buildShopChart(byKey);
}

/** Barr Hill's two destinations as grouped bars on a shared month axis. */
function buildBarrHillChart(byKey, allMonths, lookup) {
  const canvas = document.getElementById("chart-barr-hill");
  if (!canvas) return;

  const series = [
    { key: KEY_BARR_GEBBIE, label: "Barr Hill → Gebbie Farm", color: COLOR_GEBBIE },
    { key: KEY_BARR_MONTPELIER, label: "Barr Hill → Montpelier Facility", color: COLOR_MONTPELIER },
  ].filter(s => byKey[s.key]);

  const options = chartDefaults();
  options.plugins.legend = { display: true, labels: { color: "#8b949e", boxWidth: 12 } };
  options.plugins.tooltip.callbacks.label =
    ctx => `${ctx.dataset.label}: ${formatGallons(ctx.parsed.y)}`;

  // Stacked, so the Montpelier Facility portion sits on top of the Gebbie Farm
  // portion and the full bar height reads as total Barr Hill displacement.
  options.scales.x.stacked = true;
  options.scales.y.stacked = true;

  new Chart(canvas, {
    type: "bar",
    data: {
      labels: allMonths.map(formatMonth),
      datasets: series.map(s => ({
        label: s.label,
        backgroundColor: s.color,
        // null leaves a gap rather than drawing a zero-height bar for months
        // the source was not reporting.
        data: allMonths.map(m => {
          const v = lookup[s.key][m];
          return typeof v === "number" ? v : null;
        }),
      })),
    },
    options,
  });
}

/** The shop's single flow, on its own so its smaller scale stays readable. */
function buildShopChart(byKey) {
  const canvas = document.getElementById("chart-shop");
  const block = byKey[KEY_SHOP_GEBBIE];
  if (!canvas || !block) return;

  const months = block.monthly.map(m => m.month).sort();
  const lookup = {};
  block.monthly.forEach(m => { lookup[m.month] = m.gallons; });

  const options = chartDefaults();
  options.plugins.tooltip.callbacks.label =
    ctx => `Black Bear Biodiesel Shop → Gebbie Farm: ${formatGallons(ctx.parsed.y)}`;

  new Chart(canvas, {
    type: "bar",
    data: {
      labels: months.map(formatMonth),
      datasets: [{
        label: "Black Bear Biodiesel Shop → Gebbie Farm",
        backgroundColor: COLOR_GEBBIE,
        data: months.map(m => (m in lookup ? lookup[m] : null)),
      }],
    },
    options,
  });
}

init();
</script>

</body>
</html>
