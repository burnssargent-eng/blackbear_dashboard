<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer (shadow) — Black Bear Biodiesel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="ops.css">
</head>

<body>
<div id="nav"></div>
<div id="banner"></div>
<div class="container py-3" id="page">Loading…</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js" integrity="sha384-eMNCOe7tC1doHpGoWe/6oMVemdAVTMs2xqW4mwXrXsW0L84Iytr2wi5v2QjrP/xp" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.min.js" integrity="sha384-cn7l7gDp0eyniUwwAZgrzD06kc/tftFf19TOAs2zVinnD/C7E91j9yyk5//jjpt/" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="dashboard-utils.js"></script>
<script src="route-utils.js"></script>
<script src="ops-common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js" integrity="sha384-rwykjmWNwVxboyFmvK9OXN0wj9hnMHA2aAHtits54DuACyCq0M2PrSNxhRb+hvXT" crossorigin="anonymous"></script>
<script src="site-gate.js"></script>
<script src="ops-db.js"></script>
<script src="ops-photos.js"></script>
<script>
/*
 * Customer page (shadow), after the source site's customer.php. Two tabs:
 * Home (Add Collection, Oil Left, the details, Assign, photos, a map pin) and
 * Collections (every pickup with its total; a pickup entered on this site opens
 * its edit form from its gallons, as on the source site).
 *
 * Read from: jamaal_routes.json (name, town), the shared database (address,
 * notes, position), oil_projections.json, capacity_cache.csv (the site's capacity and
 * periodicity), oil_collections.json and oil_non_pickups.csv (history).
 * No phone numbers: this site is public. Gallons and assignments entered here
 * stay in this browser's shadow copy.
 */


let data = null, store = null, routeList = [];
let customer = null;      // { customer_id, name, city }
let details = {};         // this customer's address, notes and position (shared database)
let siteFigures = null;   // { capacity, periodicity_days } from capacity_cache.csv
let history = [];         // [{ date, gallons, code }] newest first
let siteOld = [];         // this site's pickups older than the store holds (any age)
let editing = null;       // client_id whose edit form is open
let undo = null;          // { text, run } for the Undo bar after a delete or a removed photo
let newPhoto = null;      // { file, url, caption, busy, msg } while a picked photo waits for its caption
let flash = "";

function param(name) { return getUrlParam(name); }

/** This customer's row of capacity_cache.csv, or null. */
function parseCapacityRow(text, id) {
  const line = text.split(/\r?\n/).find(l => l.startsWith(`${id},`));
  if (!line) return null;
  const [, capacity, periodicity] = line.split(",");
  return { capacity: Number(capacity) || null, periodicity_days: Number(periodicity) || null };
}

function historyFor(id, records, codesText) {
  const rows = records.filter(r => r.customer_id === id).map(r => ({ date: r.date, gallons: r.gallons }));
  codesText.split(/\r?\n/).forEach(l => {
    const [cid, date, qty] = l.split(",");
    if (Number(cid) === id && date) rows.push({ date, gallons: Number(qty), code: true });
  });
  return rows.sort((a, b) => b.date.localeCompare(a.date));
}

/** "07/24/2026", as the source site lists collections. */
function usDate(iso) {
  return `${iso.slice(5, 7)}/${iso.slice(8, 10)}/${iso.slice(0, 4)}`;
}

// A browser can pair this page with an older ops-db.js or no ops-photos.js for
// a few minutes after a deploy: editing old pickups and photos then stay hidden.
const editReady = typeof opsSitePickups === "function";
const photosReady = typeof opsPhotoPick === "function" && typeof opsRandomId === "function";

/** This customer's pickups entered on this site: the store's, then older ones from the database. */
function siteRows() {
  const id = customer.customer_id;
  const mine = store.collections.filter(c => c.customer_id === id);
  // Signed in, saving gives every entry its id; the browser copy needs its own.
  mine.forEach(c => { if (!c.client_id) c.client_id = typeof opsRandomId === "function" ? opsRandomId() : crypto.randomUUID(); });
  const held = new Set(mine.map(c => c.client_id));
  return mine.map(c => ({ client_id: c.client_id, date: c.date, gallons: c.gallons, theft: !!c.theft }))
    .concat(siteOld.filter(r => !held.has(r.client_id)));
}

/** Load this customer's site pickups of any age (signed in); the list redraws. */
async function loadSiteOld() {
  if (!editReady) return;
  const rows = await opsSitePickups(customer.customer_id);
  if (!rows) return;
  siteOld = rows;
  if (tab === "collections" && !editing) render();
}

async function loadPhotos() {
  if (!photosReady || !opsPhotosOn()) return;
  if (await opsPhotosLoad([customer.customer_id])) render();
}

const pickText = (date, gallons) => `${usDate(date)} · ${gallons <= 3 ? codeText(gallons) : `${formatNumber(gallons)} gal`}`;

/**
 * Edit a site pickup: through the store when it holds it (the last
 * OPS_COLLECTION_DAYS), so every page agrees, else straight to the queue.
 */
function updatePickup(clientId, gallons, date) {
  const c = store.collections.find(x => x.client_id === clientId);
  if (c) { c.gallons = gallons; c.date = date; saveStore(store); return; }
  const r = siteOld.find(x => x.client_id === clientId);
  if (!r) return;
  r.gallons = gallons;
  r.date = date;
  opsQueueOps([{ t: "pickup-edit", client_id: clientId, values: { gallons, picked_on: date } }]);
}

/** Delete a site pickup, with an Undo bar that puts the same entry back. */
function deletePickup(clientId) {
  const k = store.collections.findIndex(x => x.client_id === clientId);
  const old = siteOld.find(x => x.client_id === clientId);
  siteOld = siteOld.filter(x => x.client_id !== clientId);
  if (k >= 0) {
    const [c] = store.collections.splice(k, 1);
    saveStore(store);
    undo = { text: `Deleted ${pickText(c.date, c.gallons)}`, run: () => { store.collections.push(c); saveStore(store); } };
  } else if (old) {
    opsQueueOps([{ t: "pickup-delete", client_id: clientId }]);
    undo = { text: `Deleted ${pickText(old.date, old.gallons)}`, run: () => {
      siteOld.push(old);
      opsQueueOps([{ t: "pickup-new", row: { customer_id: customer.customer_id, picked_on: old.date,
        gallons: old.gallons, route_id: old.route_id ?? null, theft: !!old.theft, theft_note: old.theft_note || null,
        client_id: old.client_id, projected_gal: old.projected_gal ?? null,
        ...(old.entered_at ? { entered_at: old.entered_at } : {}) } }]);
    } };
  }
  editing = null;
}

function editFormHtml(line) {
  return `<form class="ops-edit-pick" data-edit-form="${escapeHtml(line.client_id)}" autocomplete="off">
    <div class="d-flex gap-2">
      <label>Gallons <input type="number" inputmode="numeric" min="0" name="gallons" class="form-control"
        style="width: 90px" value="${line.gallons}" required></label>
      <label>Date <input type="date" name="date" class="form-control" value="${line.date}" max="${todayIso()}" required></label>
    </div>
    <div class="d-flex gap-2 align-items-center mt-2">
      <button class="btn btn-primary">Update</button>
      <button type="button" class="btn ops-plain-btn" data-edit-cancel>Cancel</button>
      <button type="button" class="btn ops-edit-delete ms-auto" data-edit-delete>Delete</button>
    </div>
  </form>`;
}

/**
 * The Collections tab: every pickup, newest first, codes as words, then the
 * total. A pickup entered on this site has its gallons as a link to its edit
 * form; the source site's own pickups are plain (they are fixed there).
 */
function collectionsHtml() {
  const lines = collectionLines(history, siteRows());
  if (!lines.length) return `<div class="text-muted">No collections on record.</div>`;
  const total = lines.filter(h => !h.code).reduce((sum, h) => sum + h.gallons, 0);
  const figure = h => (h.code ? codeText(h.gallons) : formatNumber(h.gallons));
  return `<ul class="list-unstyled ops-history mb-1">${lines.map(h => !h.site
    ? `<li>${usDate(h.date)} : ${figure(h)}</li>`
    : `<li>${usDate(h.date)} : <button type="button" class="ops-pick-link" data-edit="${escapeHtml(h.client_id)}"
        aria-expanded="${editing === h.client_id}">${figure(h)}</button>${h.theft
        ? ` <span class="ops-theft-text">· Theft</span>` : ""}
      ${editing === h.client_id ? editFormHtml(h) : ""}</li>`).join("")}</ul>
    <div>Total: ${formatNumber(total)}</div>
    ${lines.some(h => h.site) ? `<div class="ops-muted mt-2">Blue numbers were entered on this site and can be edited.
      The rest come from Jamaal: fix those there, and the change arrives overnight.</div>` : ""}`;
}

/** The photos on Home: a strip with Add photo, and the caption form for a picked one. */
function photosHtml() {
  if (!photosReady || !opsPhotosOn()) return "";
  const n = opsPhotosFor(customer.customer_id).length;
  return `<div class="mb-3">
    <div class="ops-photo-head">PHOTOS${n ? ` · ${n}` : ""}</div>
    ${opsPhotoStripHtml(customer.customer_id, { add: true })}
    ${newPhoto ? `<form class="ops-photo-new" data-photo-form autocomplete="off">
      <img src="${newPhoto.url}" alt="">
      <input type="text" class="form-control" name="caption" maxlength="200" placeholder="Caption (optional)"
        aria-label="Caption" value="${escapeHtml(newPhoto.caption)}" data-photo-caption ${newPhoto.busy ? "disabled" : ""}>
      <button class="btn btn-primary" ${newPhoto.busy ? "disabled" : ""}>${newPhoto.busy ? "Saving…" : "Save photo"}</button>
      <button type="button" class="btn ops-plain-btn" data-photo-cancel ${newPhoto.busy ? "disabled" : ""}>Cancel</button>
      ${newPhoto.msg ? `<div class="w-100 text-danger small">${escapeHtml(newPhoto.msg)}</div>` : ""}
    </form>` : ""}
  </div>`;
}

/**
 * The Home tab, in Sarge's order: Add Collection, then address, capacity,
 * periodicity, last pickup, projection, on route, notes, Assign. Periodicity
 * and days to/past full are the projections' own figures, never the source
 * site's listed periodicity.
 */
// A browser can pair this page with an older ops-common.js for a few minutes
// after a deploy: Oil Left then stays hidden instead of breaking the page.
const oilLeftReady = typeof recordOilLeft === "function";

function homeHtml(row, today, onRoutes, capacity, left) {
  const est = stopEstimate(row);
  const days = row && row.days_past_full;
  const dd = (label, value) => `<dt class="col-4 col-md-2">${label}</dt><dd class="col-8 col-md-10">${value}</dd>`;
  return `
    <form id="add" class="d-flex flex-wrap gap-2 align-items-center my-3" autocomplete="off">
      <input type="number" inputmode="numeric" min="0" name="gallons" class="form-control w-auto"
             placeholder="# of gallons" required>
      <button class="btn btn-primary">Add Collection</button>
    </form>
    ${oilLeftReady ? `<form id="left" class="d-flex flex-wrap gap-2 align-items-center mb-3" autocomplete="off">
      <input type="number" inputmode="numeric" min="0" name="gallons" class="form-control w-auto"
             placeholder="# of gallons left" required aria-label="Gallons left in the barrel">
      <button class="btn btn-outline-primary">Oil Left</button>
    </form>` : ""}
    ${left ? `<div class="alert alert-primary py-2">Today: ${formatNumber(left.gallons)} gal left in the barrel, not collected — ${opsWhere()}.
      <button type="button" class="btn btn-link btn-sm p-0 ms-2" data-left-undo>Undo</button></div>` : ""}
    ${today && today.theft ? `<div class="alert alert-danger py-2">Today: ${theftGallonsText(today)} — ${opsWhere()}.
      <button type="button" class="btn btn-link btn-sm p-0 ms-2" data-undo>Undo</button>
      ${today.theft.note ? `<div style="overflow-wrap:anywhere">${escapeHtml(today.theft.note)}</div>` : ""}</div>`
    : today ? `<div class="alert alert-success py-2">Today: ${today.gallons <= 3 ? codeText(today.gallons)
      : `${formatNumber(today.gallons)} gal`} — ${opsWhere()}.
      <button type="button" class="btn btn-link btn-sm p-0 ms-2" data-undo>Undo</button></div>` : ""}
    ${flash ? `<div class="text-success mb-2">${flash}</div>` : ""}

    <dl class="row ops-detail mb-2">
      ${dd("Address", details.address
        ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(details.address)}" target="_blank" rel="noopener">${escapeHtml(details.address)}</a>`
        : "—")}
      ${dd("Capacity", capacity ?? "—")}
      ${dd("Periodicity", row && row.periodicity_days ? `${formatWhole(row.periodicity_days)} days`
        : customer.customer_id < 0 && siteFigures.periodicity_days ? `${formatWhole(siteFigures.periodicity_days)} days (as entered)` : "—")}
      ${dd("Last pickup", row && row.last_pickup ? escapeHtml(formatDate(row.last_pickup)) : "—")}
      ${dd("Projection", est.kind === "projected"
        ? `<span class="ops-fill-${fillLevel(row)}">~${formatWhole(est.gal)} gal</span>` +
          (days === null || days === undefined ? "" : ` <span class="ops-days">[${Math.round(days)}]</span>`)
        : escapeHtml(row ? (row.status || row.section) : "—"))}
      ${dd("On route", onRoutes.length ? escapeHtml(onRoutes.join(", ")) : "—")}
      ${customer.phone ? dd("Phone", `<a href="tel:${escapeHtml(customer.phone)}">${escapeHtml(customer.phone)}</a>`) : ""}
      ${customer.sharedWith ? dd("Shared barrel", `with ${escapeHtml(customer.sharedWith)}`) : ""}
      ${dd("Notes", details.notes ? notesHtml(customer.customer_id, details.notes) : "")}
    </dl>

    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
      <select id="route" class="form-select w-auto" aria-label="Assign to route">
        <option value="">Assign to route…</option>
        ${routeList.map(r => `<option value="${r.route_id}">${escapeHtml(r.name)}</option>`).join("")}
      </select>
      <label class="form-check-label text-nowrap"><input type="checkbox" class="form-check-input" id="must"> Must Get</label>
      <button type="button" class="btn btn-outline-primary" data-assign>Assign</button>
    </div>

    ${photosHtml()}

    ${details.lat != null ? `<div id="map" class="ops-map ops-map-small mb-1"></div>
      ${details.loc === "town" ? `<div class="ops-muted mb-3">Pin is the town centre; the street address did not match.</div>` : ""}` : ""}`;
}

let tab = "home";

function render() {
  const id = customer.customer_id;
  const row = data.index.get(id) || null;
  const today = todaysCollection(store, id);
  const onRoutes = storeRoutesByCustomer(store, routeList, data.index).get(id) || [];
  const capacity = (row && row.capacity) || (siteFigures && siteFigures.capacity);
  const from = param("from");
  const tabLink = (key, label) => `<li class="nav-item"><button type="button" class="nav-link${tab === key ? " active" : ""}"
    data-tab="${key}">${label}</button></li>`;
  document.getElementById("page").innerHTML = `
    ${from === "myroute" ? `<a href="ops-myroute.html" class="d-inline-block mb-2">← My Route</a>`
      : from === "assign" ? `<a href="ops-assign.html" class="d-inline-block mb-2">← Assign Routes</a>` : ""}
    <h2>${escapeHtml(customer.name || `#${id}`)}</h2>
    ${row && row.members ? `<div class="ops-muted mb-2">Shared barrel: ${escapeHtml(row.members.map(m => m.name).join(" · "))}</div>` : ""}
    <ul class="nav nav-tabs">${tabLink("home", "Home")}${tabLink("collections", "Collections")}</ul>
    <div class="pt-2">${tab === "home" ? homeHtml(row, today, onRoutes, capacity,
      oilLeftReady ? todaysOilLeft(store, id) : null) : collectionsHtml()}</div>
    ${undo ? `<div class="ops-undo" role="status"><span class="ops-undo-text">${escapeHtml(undo.text)}</span>
      <button type="button" class="btn ops-undo-btn" data-undo-bar>Undo</button></div>` : ""}`;

  if (tab === "home" && details.lat != null) {
    const map = L.map("map", { scrollWheelZoom: false }).setView([details.lat, details.lon], details.loc === "town" ? 12 : 15);
    opsTileLayer().addTo(map);
    L.marker([details.lat, details.lon], { icon: routePinIcon("•", !!today) }).addTo(map);
  }
}

async function init() {
  document.getElementById("nav").innerHTML = opsNavHtml("");
  const id = Number(param("id"));
  try {
    const oilData = await loadOilData();
    const [opsData, allDetails, payload, codesText, capText] = await Promise.all([
      loadOpsData(), loadCustomerDetails(), loadCollectionsPayload(oilData),
      fetch(`oil_non_pickups.csv?v=${encodeURIComponent(oilData.last_updated)}`).then(r => r.ok ? r.text() : ""),
      fetch(`capacity_cache.csv?v=${encodeURIComponent(oilData.last_updated)}`).then(r => r.ok ? r.text() : ""),
    ]);
    data = opsData;
    details = allDetails[String(id)] || {};
    siteFigures = parseCapacityRow(capText, id);
    history = historyFor(id, payload.records || [], codesText);
  } catch (err) {
    document.getElementById("page").innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
    return;
  }
  try {
    store = await opsOpenStore(data.snap, { index: data.index, onRemote: s => { store = s; render(); loadSiteOld(); } });
  } catch (err) {
    document.getElementById("page").innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
    return;
  }
  routeList = opsRouteList(data.snap, store);
  const listed = data.snap.assign_list.find(a => a.customer_id === id) ||
    store.added.find(c => c.customer_id === id);
  if (!listed) {
    document.getElementById("page").innerHTML = `<div class="alert alert-warning">No active customer #${escapeHtml(String(param("id")))}.</div>`;
    return;
  }
  customer = { customer_id: id, name: listed.name, city: listed.city };
  if (id < 0) {
    // Added in this browser: its own fields stand in for the scraped ones.
    // The phone lives only in this browser's storage, never in the repo.
    details = { address: [listed.address, listed.city].filter(Boolean).join(", "), notes: listed.notes || "" };
    siteFigures = { capacity: listed.capacity, periodicity_days: listed.periodicity };
    customer.phone = listed.phone || "";
    const partner = listed.shared_with && (data.snap.assign_list.find(a => a.customer_id === listed.shared_with) ||
      store.added.find(c => c.customer_id === listed.shared_with));
    customer.sharedWith = partner ? partner.name : "";
  }
  document.title = `${customer.name} (shadow) — Black Bear Biodiesel`;
  const banner = document.getElementById("banner");
  banner.innerHTML = shadowBannerHtml(store, data.snap);
  wireShadowReset(banner, data.snap, fresh => { store = fresh; banner.innerHTML = shadowBannerHtml(store, data.snap); render(); });

  const page = document.getElementById("page");
  page.addEventListener("input", e => {
    if (newPhoto && e.target.matches && e.target.matches("[data-photo-caption]")) newPhoto.caption = e.target.value;
  });
  page.addEventListener("submit", async e => {
    if (e.target.matches("[data-photo-form]")) {
      e.preventDefault();
      if (!newPhoto || newPhoto.busy) return;
      const caption = String(new FormData(e.target).get("caption") || "").trim();
      newPhoto.busy = true;
      newPhoto.msg = "";
      render();
      try {
        await opsPhotoUpload(customer.customer_id, newPhoto.file, caption);
        URL.revokeObjectURL(newPhoto.url);
        newPhoto = null;
        await loadPhotos();
      } catch (err) {
        if (typeof opsLog === "function") opsLog("photo upload FAILED", err.message);
        newPhoto.busy = false;
        newPhoto.msg = err.message;
      }
      render();
      return;
    }
    if (e.target.matches("[data-edit-form]")) {
      e.preventDefault();
      const form = new FormData(e.target);
      const gallons = parseInt(form.get("gallons"), 10);
      const date = String(form.get("date") || "");
      if (!Number.isFinite(gallons) || gallons < 0 || !/^\d{4}-\d{2}-\d{2}$/.test(date) || date > todayIso()) return;
      updatePickup(e.target.dataset.editForm, gallons, date);
      editing = null;
      render();
      return;
    }
    if (e.target.id === "left") {
      e.preventDefault();
      const gallons = parseInt(new FormData(e.target).get("gallons"), 10);
      if (!Number.isFinite(gallons) || gallons < 0) return;
      recordOilLeft(store, customer, gallons);
      saveStore(store);
      flash = "";
      render();
      return;
    }
    if (e.target.id !== "add") return;
    e.preventDefault();
    const gallons = parseInt(new FormData(e.target).get("gallons"), 10);
    if (!Number.isFinite(gallons) || gallons < 0) return;
    recordCollection(store, customer, gallons);
    saveStore(store);
    flash = "";
    if (param("from") === "myroute") { window.location.href = "ops-myroute.html"; return; }
    render();
  });
  page.addEventListener("click", e => {
    const t = e.target.closest && e.target.closest("[data-tab]");
    if (t) { tab = t.dataset.tab; editing = null; undo = null; render(); return; }
    const ed = e.target.closest("[data-edit]");
    if (ed) { editing = editing === ed.dataset.edit ? null : ed.dataset.edit; undo = null; render(); return; }
    if (e.target.closest("[data-edit-cancel]")) { editing = null; render(); return; }
    if (e.target.closest("[data-edit-delete]")) { if (editing) deletePickup(editing); render(); return; }
    if (e.target.closest("[data-undo-bar]")) { const u = undo; undo = null; if (u) u.run(); render(); return; }
    if (e.target.closest("[data-photo-add]")) {
      opsPhotoPick(file => {
        if (newPhoto) URL.revokeObjectURL(newPhoto.url);
        newPhoto = { file, url: URL.createObjectURL(file), caption: "", busy: false, msg: "" };
        render();
      });
      return;
    }
    if (e.target.closest("[data-photo-cancel]")) {
      if (newPhoto) URL.revokeObjectURL(newPhoto.url);
      newPhoto = null;
      render();
      return;
    }
    const ph = e.target.closest("[data-photo]");
    if (ph) {
      const id = customer.customer_id;
      opsPhotoViewer(id, Number(ph.dataset.photo), { editable: true, onChange: (kind, r) => {
        if (kind === "removed") {
          opsPhotos.byCustomer.set(id, opsPhotosFor(id).filter(x => x.id !== r.id));
          undo = { text: "Photo removed", run: () => opsPhotoRemove(r.id, false).then(loadPhotos)
            .catch(err => { flash = escapeHtml(err.message); render(); }) };
        }
        render();
      } });
      return;
    }
    if (e.target.closest("[data-left-undo]")) {
      clearOilLeft(store, customer.customer_id);
      saveStore(store);
      render();
    } else if (e.target.closest("[data-undo]")) {
      store.collections = store.collections.filter(c =>
        !(c.date === todayIso() && c.customer_id === customer.customer_id));
      saveStore(store);
      render();
    } else if (e.target.closest("[data-assign]")) {
      const routeId = Number(document.getElementById("route").value);
      if (!routeId) return;
      const row = data.index.get(customer.customer_id);
      const n = assignToRoute(store, routeId, [{ customer_id: customer.customer_id, name: customer.name,
        capacity: row && row.capacity != null ? row.capacity : (siteFigures && siteFigures.capacity) }],
        document.getElementById("must").checked);
      saveStore(store);
      const name = routeList.find(r => r.route_id === routeId).name;
      flash = n ? `Added to ${escapeHtml(name)}.` : `Already on ${escapeHtml(name)}.`;
      render();
    }
  });
  render();
  loadSiteOld();
  if (photosReady) { loadPhotos(); opsPhotosWatch(render); }
}

init();
</script>
</body>
</html>
