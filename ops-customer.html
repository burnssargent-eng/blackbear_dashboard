<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer (shadow) — Black Bear Biodiesel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="ops.css">
</head>

<body>
<div id="nav"></div>
<div id="banner"></div>
<div class="container py-3" id="page">Loading…</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js" integrity="sha384-eMNCOe7tC1doHpGoWe/6oMVemdAVTMs2xqW4mwXrXsW0L84Iytr2wi5v2QjrP/xp" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.min.js" integrity="sha384-cn7l7gDp0eyniUwwAZgrzD06kc/tftFf19TOAs2zVinnD/C7E91j9yyk5//jjpt/" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="dashboard-utils.js"></script>
<script src="route-utils.js"></script>
<script src="ops-common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js" integrity="sha384-rwykjmWNwVxboyFmvK9OXN0wj9hnMHA2aAHtits54DuACyCq0M2PrSNxhRb+hvXT" crossorigin="anonymous"></script>
<script src="site-gate.js"></script>
<script src="ops-db.js"></script>
<script src="ops-photos.js"></script>
<script>
/*
 * Customer page (shadow), after the source site's customer.php. Two tabs
 * (Sarge, 2026-11-02): Home (one row as on My Route: gallons, Save, Oil Left,
 * Report Theft; then the Info card with its one ✎ Edit, status included; Assign;
 * the Barrel card; Notes; photos; the map) and
 * Collections (every pickup with its total; a pickup entered on this site opens
 * its edit form from its gallons, as on the source site).
 *
 * Read from: jamaal_routes.json (name, town), the shared database (address,
 * notes, phone, position), oil_projections.json, capacity_cache.csv (the site's capacity and
 * periodicity), oil_collections.json and oil_non_pickups.csv (history).
 * Phones and addresses come only from the database. Gallons and assignments entered here
 * stay in this browser's shadow copy.
 *
 * Info's ✎ Edit opens one form: name, address, town, Group w/ (collected_with_town),
 * capacity, main phone and other phones (customer_contacts). Name, town and capacity
 * beat the source site's (customers.site_*; opsSaveCustomer) and reach the dashboard
 * through the nightly's customer_edits.csv. Periodicity is the projection's own, not editable.
 */


let data = null, store = null, routeList = [];
let customer = null;      // { customer_id, name, city }
let details = {};         // this customer's address, notes and position (shared database)
const todayNote = id => (typeof opsTodayNote === "function" ? opsTodayNote(id) : "");
let notesEdit = null;     // { notes, today, busy, msg }: Notes and Today's note being edited
let infoEdit = null;      // { now, opened, phones, phonesWas, busy, msg, townMsg, townErr }: Info being edited
let contacts = [];        // this customer's other phones (customer_contacts), signed in
let theftOpen = false;    // Report Theft's form is showing
let leftOpen = false;     // Oil Left's form is showing
let themeRegions = [], regionNames = [];   // from oil_data.json
const cwReady = typeof opsCollectedWith === "function";
let siteFigures = null;   // { capacity, periodicity_days } from capacity_cache.csv
let history = [];         // [{ date, gallons, code }] newest first
let siteOld = [];         // this site's pickups older than the store holds (any age)
let editing = null;       // client_id whose edit form is open
let undo = null;          // { text, run } for the Undo bar after a delete or a removed photo
let newPhoto = null;      // { file, url, caption, busy, msg } while a picked photo waits for its caption
let flash = "";
let siteHistory = null;   // historyIndex() over customer_history.json; null if it did not load

function param(name) { return getUrlParam(name); }

/** This customer's row of capacity_cache.csv, or null. */
function parseCapacityRow(text, id) {
  const line = text.split(/\r?\n/).find(l => l.startsWith(`${id},`));
  if (!line) return null;
  const [, capacity, periodicity] = line.split(",");
  return { capacity: Number(capacity) || null, periodicity_days: Number(periodicity) || null };
}

function historyFor(id, records, codesText) {
  const rows = records.filter(r => r.customer_id === id).map(r => ({ date: r.date, gallons: r.gallons }));
  codesText.split(/\r?\n/).forEach(l => {
    const [cid, date, qty] = l.split(",");
    if (Number(cid) === id && date) rows.push({ date, gallons: Number(qty), code: true });
  });
  return rows.sort((a, b) => b.date.localeCompare(a.date));
}

/** "07/24/2026", as the source site lists collections. */
function usDate(iso) {
  return `${iso.slice(5, 7)}/${iso.slice(8, 10)}/${iso.slice(0, 4)}`;
}

// A browser can pair this page with an older ops-db.js or no ops-photos.js for
// a few minutes after a deploy: editing old pickups and photos then stay hidden.
const editReady = typeof opsSitePickups === "function";
const photosReady = typeof opsPhotoPick === "function" && typeof opsRandomId === "function";

/** This customer's pickups entered on this site: the store's, then older ones from the database. */
function siteRows() {
  const id = customer.customer_id;
  const mine = store.collections.filter(c => c.customer_id === id);
  // Signed in, saving gives every entry its id; the browser copy needs its own.
  mine.forEach(c => { if (!c.client_id) c.client_id = typeof opsRandomId === "function" ? opsRandomId() : crypto.randomUUID(); });
  const held = new Set(mine.map(c => c.client_id));
  return mine.map(c => ({ client_id: c.client_id, date: c.date, gallons: c.gallons, theft: !!c.theft }))
    .concat(siteOld.filter(r => !held.has(r.client_id)));
}

/** Load this customer's site pickups of any age (signed in); the list redraws. */
async function loadSiteOld() {
  if (!editReady) return;
  const rows = await opsSitePickups(customer.customer_id);
  if (!rows) return;
  siteOld = rows;
  if (tab === "collections" && !editing) render();
}

async function loadPhotos() {
  if (!photosReady || !opsPhotosOn()) return;
  if (await opsPhotosLoad([customer.customer_id])) render();
}

const pickText = (date, gallons) => `${usDate(date)} · ${gallons <= 3 ? codeText(gallons) : `${formatNumber(gallons)} gal`}`;

/**
 * Edit a site pickup: through the store when it holds it (the last
 * OPS_COLLECTION_DAYS), so every page agrees, else straight to the queue.
 */
function updatePickup(clientId, gallons, date) {
  const c = store.collections.find(x => x.client_id === clientId);
  if (c) { c.gallons = gallons; c.date = date; saveStore(store); return; }
  const r = siteOld.find(x => x.client_id === clientId);
  if (!r) return;
  r.gallons = gallons;
  r.date = date;
  opsQueueOps([{ t: "pickup-edit", client_id: clientId, values: { gallons, picked_on: date } }]);
}

/** Delete a site pickup, with an Undo bar that puts the same entry back. */
function deletePickup(clientId) {
  const k = store.collections.findIndex(x => x.client_id === clientId);
  const old = siteOld.find(x => x.client_id === clientId);
  siteOld = siteOld.filter(x => x.client_id !== clientId);
  if (k >= 0) {
    const [c] = store.collections.splice(k, 1);
    saveStore(store);
    undo = { text: `Deleted ${pickText(c.date, c.gallons)}`, run: () => { store.collections.push(c); saveStore(store); } };
  } else if (old) {
    opsQueueOps([{ t: "pickup-delete", client_id: clientId }]);
    undo = { text: `Deleted ${pickText(old.date, old.gallons)}`, run: () => {
      siteOld.push(old);
      opsQueueOps([{ t: "pickup-new", row: { customer_id: customer.customer_id, picked_on: old.date,
        gallons: old.gallons, route_id: old.route_id ?? null, theft: !!old.theft, theft_note: old.theft_note || null,
        client_id: old.client_id, projected_gal: old.projected_gal ?? null,
        ...(old.entered_at ? { entered_at: old.entered_at } : {}) } }]);
    } };
  }
  editing = null;
}

function editFormHtml(line) {
  return `<form class="ops-edit-pick" data-edit-form="${escapeHtml(line.client_id)}" autocomplete="off">
    <div class="d-flex gap-2">
      <label>Gallons <input type="number" inputmode="numeric" min="0" name="gallons" class="form-control"
        style="width: 90px" value="${line.gallons}" required></label>
      <label>Date <input type="date" name="date" class="form-control" value="${line.date}" max="${todayIso()}" required></label>
    </div>
    <div class="d-flex gap-2 align-items-center mt-2">
      <button class="btn btn-primary">Update</button>
      <button type="button" class="btn ops-plain-btn" data-edit-cancel>Cancel</button>
      <button type="button" class="btn ops-edit-delete ms-auto" data-edit-delete>Delete</button>
    </div>
  </form>`;
}

/**
 * The Collections tab: every pickup, newest first, codes as words, then the
 * total. A pickup entered on this site has its gallons as a link to its edit
 * form; the source site's own pickups are plain (they are fixed there).
 */
function collectionsHtml() {
  const lines = collectionLines(history, siteRows());
  if (!lines.length) return `<div class="text-muted">No collections on record.</div>`;
  const total = lines.filter(h => !h.code).reduce((sum, h) => sum + h.gallons, 0);
  const figure = h => (h.code ? codeText(h.gallons) : formatNumber(h.gallons));
  return `<ul class="list-unstyled ops-history mb-1">${lines.map(h => !h.site
    ? `<li>${usDate(h.date)} : ${figure(h)}</li>`
    : `<li>${usDate(h.date)} : <button type="button" class="ops-pick-link" data-edit="${escapeHtml(h.client_id)}"
        aria-expanded="${editing === h.client_id}">${figure(h)}</button>${h.theft
        ? ` <span class="ops-theft-text">· Theft</span>` : ""}
      ${editing === h.client_id ? editFormHtml(h) : ""}</li>`).join("")}</ul>
    <div>Total: ${formatNumber(total)}</div>
    ${lines.some(h => h.site) ? `<div class="ops-muted mt-2">Blue numbers were entered on this site and can be edited.
      The rest come from Jamaal: fix those there, and the change arrives overnight.</div>` : ""}`;
}

/** The photos on Home: a strip with Add photo, and the caption form for a picked one. */
function photosHtml() {
  if (!photosReady || !opsPhotosOn()) return "";
  const n = opsPhotosFor(customer.customer_id).length;
  return `<div class="mb-3">
    <div class="ops-photo-head">PHOTOS${n ? ` · ${n}` : ""}</div>
    ${opsPhotoStripHtml(customer.customer_id, { add: true })}
    ${newPhoto ? `<form class="ops-photo-new" data-photo-form autocomplete="off">
      <img src="${newPhoto.url}" alt="">
      <input type="text" class="form-control" name="caption" maxlength="200" placeholder="Caption (optional)"
        aria-label="Caption" value="${escapeHtml(newPhoto.caption)}" data-photo-caption ${newPhoto.busy ? "disabled" : ""}>
      <button class="btn btn-primary" ${newPhoto.busy ? "disabled" : ""}>${newPhoto.busy ? "Saving…" : "Save photo"}</button>
      <button type="button" class="btn ops-plain-btn" data-photo-cancel ${newPhoto.busy ? "disabled" : ""}>Cancel</button>
      ${newPhoto.msg ? `<div class="w-100 text-danger small">${escapeHtml(newPhoto.msg)}</div>` : ""}
    </form>` : ""}
  </div>`;
}

/**
 * Periodicity and days to/past full are the projections' own figures, never
 * the source site's listed periodicity.
 */
// A browser can pair this page with an older ops-common.js for a few minutes
// after a deploy: Oil Left then stays hidden instead of breaking the page.
const oilLeftReady = typeof recordOilLeft === "function";

/** A phone as a call link: "+18025550123" shows as (802) 555-0123; anything else as typed. */
function phoneHtml(phone) {
  const d = String(phone).replace(/\D/g, "").replace(/^1(?=\d{10}$)/, "");
  const shown = d.length === 10 ? `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}` : phone;
  return `<a href="tel:${d.length === 10 ? "+1" + d : escapeHtml(phone)}">${escapeHtml(shown)}</a>`;
}

function homeHtml(row, today, onRoutes, capacity, left) {
  const st = siteStatus();
  const inactive = st && st.status === "inactive";
  const est = inactive ? { kind: "none" } : stopEstimate(row);   // no projection while inactive
  return `
    ${inactive ? `<div class="mt-3"></div>` : theftOpen ? theftFormHtml() : leftOpen && oilLeftReady ? leftFormHtml()
      : `<form id="add" class="ops-row ops-cp-row1" autocomplete="off">
      <input type="number" inputmode="numeric" min="0" name="gallons" class="form-control"
             placeholder="# of gallons" required aria-label="Gallons collected">
      <button class="btn btn-success" data-act="save">Save</button>
      ${oilLeftReady ? `<button type="button" class="btn btn-outline-primary" data-left-open>Oil Left</button>` : ""}
      ${today ? "" : `<button type="button" class="btn btn-danger" data-theft-open>Report Theft</button>`}
    </form>`}
    ${left ? `<div class="alert alert-primary py-2">Today: ${formatNumber(left.gallons)} gal left in the barrel, not collected — ${opsWhere()}.
      <button type="button" class="btn btn-link btn-sm p-0 ms-2" data-left-undo>Undo</button></div>` : ""}
    ${today && today.theft ? `<div class="alert alert-danger py-2">Today: ${theftGallonsText(today)} — ${opsWhere()}.
      <button type="button" class="btn btn-link btn-sm p-0 ms-2" data-undo>Undo</button>
      ${today.theft.note ? `<div style="overflow-wrap:anywhere">${escapeHtml(today.theft.note)}</div>` : ""}</div>`
    : today ? `<div class="alert alert-success py-2">Today: ${today.gallons <= 3 ? codeText(today.gallons)
      : `${formatNumber(today.gallons)} gal`} — ${opsWhere()}.
      <button type="button" class="btn btn-link btn-sm p-0 ms-2" data-undo>Undo</button></div>` : ""}
    ${flash ? `<div class="text-success mb-2">${flash}</div>` : ""}

    ${infoEdit ? infoFormHtml() : infoHtml(onRoutes, row, est, capacity, inactive)}

    ${inactive ? "" : `<div class="ops-cp-assign">
      <select id="route" class="form-select" aria-label="Assign to route">
        <option value="">Assign to route…</option>
        ${routeList.map(r => `<option value="${r.route_id}">${escapeHtml(r.name)}</option>`).join("")}
      </select>
      <label class="form-check-label text-nowrap"><input type="checkbox" class="form-check-input" id="must"> Must Get</label>
      <button type="button" class="btn btn-outline-primary" data-assign>Assign</button>
    </div>`}

    ${notesEdit ? notesFormHtml() : !details.notes && !todayNote(customer.customer_id) ? `<section class="ops-cp-card">
      <div class="ops-cp-head ops-cp-head-near"><span class="ops-cp-title">NOTES</span>
        ${customer.customer_id > 0 ? `<button type="button" class="btn ops-plain-btn btn-sm" data-notes-edit>✎ Edit</button>` : ""}</div>
    </section>` : `<section class="ops-cp-card">
      <div class="ops-cp-head"><span class="ops-cp-title">NOTES</span></div>
      <div class="ops-cp-notes">
        ${todayNote(customer.customer_id) ? `<div class="ops-today-text">Today: ${escapeHtml(todayNote(customer.customer_id))}</div>` : ""}
        <div>${details.notes ? notesHtml(customer.customer_id, details.notes) : ""}
          ${customer.customer_id > 0 ? `<button type="button" class="btn ops-plain-btn btn-sm ms-1" data-notes-edit>✎ Edit</button>` : ""}</div>
      </div>
    </section>`}

    ${photosHtml()}

    ${details.lat != null ? `<div id="map" class="ops-map ops-map-small mb-1"></div>
      ${details.loc === "town" ? `<div class="ops-muted mb-3">Pin is the town centre; the street address did not match.</div>` : ""}`
      : details.address && customer.customer_id > 0 ? `<div class="ops-muted mb-3">The map pin moves to a new address overnight.</div>` : ""}`;
}

/** Oil Left, as on My Route: gallons a driver saw left in the barrel and did not collect. */
function leftFormHtml() {
  return `<form id="left" class="ops-left-form ops-cp-card ops-cp-left mt-3" autocomplete="off">
    <label for="left-gal">Oil Left. Gallons left in the barrel:</label>
    <input type="number" inputmode="numeric" min="0" name="gallons" id="left-gal" class="form-control" placeholder="gal" required>
    <div class="d-flex gap-2">
      <button class="btn btn-primary">Save</button>
      <button type="button" class="btn ops-plain-btn" data-left-cancel>Cancel</button>
    </div>
  </form>`;
}

/* ── Projection type in plain words, for the Info card's type chip ── */

// The builder's model status in plain words, for Type when no type is set on this page.
const MODEL_STATUS_WORDS = {
  "50/50 default": "Steady", "limited data": "Limited data", "will-call (detected)": "Will-call",
  "will-call (marked on the site)": "Will-call", "closer (detected)": "Seasonal", "true closer": "Seasonal",
  "semi-closer / call-driven": "Seasonal", "seasonal open-ish": "Seasonal", "event-driven": "Event-driven",
  "on-demand / unlimited": "On demand", "lump-sum / interval-based": "Lump sum",
  "stale - projection not meaningful": "Stale", "inactive (marked on the site)": "Inactive",
  "closed for the season (marked on the site)": "Seasonal",
};

/** Type: the one set on this page (Edit info), else what the model chose, in plain words. */
function typeWords(row) {
  const db = modelReady() ? opsCustomerDbRow(customer.customer_id) : null;
  if (db && MODEL_TEXT[db.site_model]) return MODEL_TEXT[db.site_model];
  if (!row || row.id !== customer.customer_id) return "—";
  return MODEL_STATUS_WORDS[row.status] || row.status || "—";
}


/** The town to show: the projection's official town (site edits included), else the source site's city. */
function shownTown() {
  const row = data.index.get(customer.customer_id);
  return (row && row.id === customer.customer_id && row.town) || customer.city || "";
}

/** Edit is offered signed in (source-site customers) or for a customer added on the site. */
function editReadyCustomer() {
  return customer.customer_id < 0 || (typeof opsSaveCustomer === "function" && !!opsCustomerDbRow(customer.customer_id));
}

/**
 * The Info card (Sarge, 2026-11-12, layout "I"): a top line of chips (status, projection type)
 * with ✎ Edit info on the right; the address on its own line and the phones on the next, each
 * extra one with its small grey label, wrapping when there are several; a strip of three oil
 * figures split by fine lines (projection, days to 75% full, average); and region and routes
 * last, right above Assign. No field names: each value says what it is.
 */
function infoHtml(onRoutes, row, est, capacity, inactive) {
  const st = statusReady && customer.customer_id > 0 && opsCustomerDbRow(customer.customer_id) ? (siteStatus() || {}).status || "open" : null;
  const chips = [
    st ? `<span class="ops-chip ops-chip-${st}"><span class="ops-chip-dot"></span>${escapeHtml(STATUS_TEXT[st] || "Open")}</span>` : "",
    `<span class="ops-chip ops-chip-type">${escapeHtml(typeWords(row))}</span>`,
  ].join("");
  const address = details.address
    ? `<a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(details.address)}"
        target="_blank" rel="noopener">${escapeHtml(details.address)}</a>`
    : `<span class="ops-cp-none">No address</span>`;
  const phones = [customer.phone ? phoneHtml(customer.phone) : "",
    ...contacts.map(p => `<span>${p.label ? `<span class="ops-cp-tag">${escapeHtml(p.label)}</span> ` : ""}${phoneHtml(p.value)}</span>`)]
    .filter(Boolean);
  const [geo, themes] = shownRegions();
  const cap = capacity != null ? formatWhole(capacity) : null;
  const proj = est.kind === "projected"
    ? `<span class="ops-proj ops-fill-${fillLevel(row)}">~${formatWhole(est.gal)}${cap ? ` / ${cap}` : ""}</span>${daysBracketHtml(row.days_past_full)}`
    : `${inactive ? "none" : "—"}${cap ? ` / ${cap}` : ""}`;
  // Capped like the [days] bracket (DAYS_SHOWN_CAP, ops-common.js): a slow barrel's 2,039 days
  // to 75% full reads "90+ days" (Sarge, 2026-11-12). Display only; the export keeps the figure.
  const every = !row || !row.periodicity_days ? "—"
    : row.periodicity_days > DAYS_SHOWN_CAP ? `${DAYS_SHOWN_CAP}+ days` : `${formatWhole(row.periodicity_days)} days`;
  const avg = row && row.avg_collection
    ? `${formatWhole(row.avg_collection)} gal${row.usual_gap_days ? ` · ${formatWhole(row.usual_gap_days)} days` : ""}` : "—";
  const fig = (value, caption) => `<div class="ops-cp-fig"><div>${value}</div><div class="ops-cp-cap">${caption}</div></div>`;
  return `<section class="ops-cp-card ops-cp-info">
    <div class="ops-cp-chips">${chips}
      ${editReadyCustomer() ? `<button type="button" class="btn btn-link ops-cp-edit" data-info-edit>✎ Edit info</button>` : ""}</div>
    <div class="ops-cp-line">${address}</div>
    <div class="ops-cp-line ops-cp-phones">${phones.length ? phones.join("") : `<span class="ops-cp-none">No phone</span>`}</div>
    ${customer.sharedWith ? `<div class="ops-cp-line">Shared barrel with ${escapeHtml(customer.sharedWith)}</div>` : ""}
    <div class="ops-cp-strip">${fig(proj, "Projected gal")}${fig(every, "to 75% full")}${fig(avg, "Averages")}</div>
    <div class="ops-cp-line ops-cp-split"><span>${escapeHtml([...geo, ...themes].join(" · ") || "No region")}</span>
      <span class="ops-cp-none">${onRoutes.length ? escapeHtml(onRoutes.join(", ")) : "No route"}</span></div>
  </section>`;
}

/** A phone as the form shows it: (802) 555-0123, or as typed. */
function phoneShown(phone) {
  const d = String(phone).replace(/\D/g, "").replace(/^1(?=\d{10}$)/, "");
  return d.length === 10 ? `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}` : String(phone);
}

/** The values the edit form opens with. */
function infoValues() {
  const id = customer.customer_id;
  const cw = cwReady ? opsCollectedWith(id) : null;
  if (id < 0) {
    const added = store.added.find(c => c.customer_id === id) || {};
    return { name: added.name || "", town: added.city || "", capacity: added.capacity ?? null,
      address: added.address || "", phone: added.phone ? phoneShown(added.phone) : "",
      collected_with: added.collected_with || "" };
  }
  const db = opsCustomerDbRow(id) || {};
  const row = data.index.get(id);
  return {
    name: customer.name || "",
    town: shownTown(),
    capacity: db.site_capacity ?? db.capacity ?? (row && row.capacity) ?? (siteFigures && siteFigures.capacity) ?? null,
    address: details.address || "",
    phone: customer.phone ? phoneShown(customer.phone) : "",
    collected_with: cw ? cw.with : "",
    region: db.site_region || "",
    themes: shownRegions()[1].slice(),
    model: db.site_model || "",
    season: db.site_season || "",
  };
}

/** The Info card as one form: name, address, town, Group w/, capacity, phones. */
function infoFormHtml() {
  const n = infoEdit, v = n.now;
  const field = (key, label, attrs = "") => `<label class="ops-cp-field" for="ie-${key}">${label}
    <input class="form-control" id="ie-${key}" data-ie-field="${key}" value="${escapeHtml(v[key] ?? "")}" ${attrs}></label>`;
  return `<form class="ops-cp-card ops-cp-form" data-info-form autocomplete="off" novalidate>
    <div class="ops-cp-head"><span class="ops-cp-title">EDIT INFO</span></div>
    ${statusFieldHtml()}

/** Save the edit form: a site-added customer through the store, a source-site one to the database. */
async function saveInfo() {
  const n = infoEdit;
  const v = { ...n.now, name: n.now.name.trim(), address: n.now.address.trim(), phone: n.now.phone.trim() };
  if (!v.name) { n.msg = "The name cannot be empty."; render(); return; }
  const t = resolveTownInput(v.town);
  if (t.error) { n.townMsg = t.error; n.townErr = true; render(); return; }
  v.town = t.town;
  const status = n.status && n.status.choice !== null ? n.status : null;
  if (status && !(status.since <= todayIso())) { n.msg = "The status date cannot be in the future."; render(); return; }
  const cap = String(v.capacity ?? "").trim();
  v.capacity = cap === "" ? null : Math.round(Number(cap));
  if (v.capacity !== null && !(v.capacity >= 0)) { n.msg = "Capacity is a number of gallons."; render(); return; }
  if (v.model === "seasonal" && !/^[A-Z][a-z]{2}-[A-Z][a-z]{2}$/.test(v.season || "")) {
    n.msg = "Pick the months a seasonal customer opens and closes."; render(); return;
  }
  const id = customer.customer_id;
  if (id < 0) {
    const c = store.added.find(x => x.customer_id === id);
    Object.assign(c, { name: v.name, address: v.address, city: v.town, capacity: v.capacity,
      phone: v.phone, collected_with: v.collected_with || null });
    saveStore(store);
    applyCustomer();
    infoEdit = null;
    render();
    return;
  }
  n.busy = true; n.msg = ""; render();
  try {
    const opened = { ...n.opened, capacity: n.opened.capacity === null ? null : Number(n.opened.capacity) };
    const saved = await opsSaveCustomer(id, v, opened);
    if (n.phonesWas) await opsContactsSave(id, n.phones, n.phonesWas);
    details.address = saved.address || "";
    details.phone = saved.phone || "";
    if (saved.loc === null && details.address) details.lat = null;
    applyCustomer();
    contacts = n.phonesWas ? await opsContactsLoad(id) : contacts;
    if (status) await setStatus(status.choice, status.since || todayIso());
    infoEdit = null;
  } catch (err) {
    n.busy = false; n.msg = `Not saved (${err.message}).`;
  }
  render();
}

const MODEL_TEXT = { will_call: "Will-call", seasonal: "Seasonal", event: "Event-driven" };

/** "Seasonal · May–Oct" for a type set here, else "". */

  return MODEL_TEXT[model] + (model === "seasonal" && season ? ` · ${season.replace("-", "–")}` : "");

/** Edit's Projection type: Automatic (what the model picks now), Will-call, Seasonal with its months, Event-driven. */
function modelFieldHtml() {
  if (!modelReady()) return "";
  const v = infoEdit.now;

      ? `<div class="ops-muted">The projections follow from tonight's update.</div>` : ""}`;
}

/** Every town a customer is listed in, for Collected with (its own town left out). */

const STATUS_MOVES = {

const statusReady = typeof opsSaveStatus === "function";

/** The latest real pickup (over 3 gallons) on either site, ISO, or "". */
function lastPickupIso() {
  const days = history.filter(h => !h.code && h.gallons > 3).map(h => h.date)
    .concat(siteRows().filter(r => r.gallons > 3).map(r => r.date));
  return days.reduce((a, b) => (b > a ? b : a), "");
}

/** The status marked on this page that still stands, or null (open). */
function siteStatus() {
  return statusReady && customer.customer_id > 0 ? opsSiteStatus(customer.customer_id, lastPickupIso()) : null;

function statusBandHtml() {

let tab = "home";

/**
 * History at this site (customer_history.json, from customer_eras.csv): the
 * businesses this barrel has served, and where a business here came from or
 * went. Shown only when there is more than this one business to show.
 */
function siteHistoryHtml(id) {
  if (!siteHistory || id <= 0) return "";
  const eras = siteHistory.byAccount.get(id) || [];
  const biz = eras.map(e => siteHistory.businessOfEra.get(e.key)).filter(Boolean);
  const others = new Set();
  for (const b of biz) {
    b.customer_ids.filter(c => c !== id).forEach(c => others.add(c));
    [...b.preceded_by, ...b.followed_by].forEach(x => {
      const o = siteHistory.businesses.get(x);
      if (o) o.customer_ids.filter(c => c !== id).forEach(c => others.add(c));
    });
  }
  if (eras.length < 2 && !others.size) return "";
  const link = e => {
    const b = siteHistory.businessOfEra.get(e.key);
    return b ? `<a href="former.html?b=${encodeURIComponent(b.id)}">${escapeHtml(e.business)}</a>` : escapeHtml(e.business);
  };
  const elsewhere = [...others].map(c => {
    const list = siteHistory.byAccount.get(c) || [];
    const last = list[list.length - 1];
    const b = last && siteHistory.businessOfEra.get(last.key);
    return b ? `<a href="former.html?b=${encodeURIComponent(b.id)}">${escapeHtml(last.business)} (#${c})</a>` : "";
  }).filter(Boolean);
  return `<div class="ops-cp-card ops-cp-history mt-3">
    <div class="ops-cp-head"><span class="ops-cp-title">HISTORY AT THIS SITE</span></div>
    <div class="px-3 pb-2">${siteTimelineHtml(eras, link)}
      ${elsewhere.length ? `<div class="ops-muted small">Linked accounts: ${elsewhere.join(", ")}</div>` : ""}</div></div>`;
}

/** "Replaced by …" on an old owner's account, "Took over from …" on the new one. */
function takeoverHtml(id) {
  const name = cid => {
    const r = data.snap.assign_list.find(a => a.customer_id === cid) || store.added.find(c => c.customer_id === cid);
    return r ? r.name : `#${cid}`;
  };
  const link = cid => `<a href="ops-customer.html?id=${cid}">${escapeHtml(name(cid))}</a>`;
  const by = store.replaced && store.replaced[id];
  const from = Object.entries(store.replaced || {}).filter(([, b]) => b === id).map(([o]) => Number(o));
  return [
    by ? `<div class="alert alert-secondary py-2 mb-2">Inactive: taken over by a new owner, now ${link(by)}.
      This account keeps its own history.</div>` : "",
    from.length ? `<div class="ops-muted mb-2">Took over from ${from.map(link).join(", ")}.</div>` : "",
  ].join("");
}

/**
 * Set `customer` (and, for one added on the site, its details) from the Assign
 * list, which carries the site's name and town edits, or the store's added
 * customers. False when the id is neither.
 */
function applyCustomer(id = customer.customer_id) {
  const listed = data.snap.assign_list.find(a => a.customer_id === id) ||
    store.added.find(c => c.customer_id === id);
  if (!listed) return false;
  customer = { customer_id: id, name: listed.name, city: listed.city, phone: details.phone || "" };
  if (id < 0) {
    // Added on the site: its own fields stand in for the scraped ones.
    details = { ...details, address: [listed.address, listed.city].filter(Boolean).join(", "), notes: listed.notes || "" };
    siteFigures = { capacity: listed.capacity, periodicity_days: listed.periodicity };
    customer.phone = listed.phone || "";
    const partner = listed.shared_with && (data.snap.assign_list.find(a => a.customer_id === listed.shared_with) ||
      store.added.find(c => c.customer_id === listed.shared_with));
    customer.sharedWith = partner ? partner.name : "";
  }
  document.title = `${customer.name} (shadow) — Black Bear Biodiesel`;
  return true;
}

async function init() {
  document.getElementById("nav").innerHTML = opsNavHtml("");
  const id = Number(param("id"));
  try {
    const oilData = await loadOilData();
    const [opsData, allDetails, payload, codesText, capText] = await Promise.all([
      loadOpsData(), loadCustomerDetails(), loadCollectionsPayload(oilData),
      fetch(`oil_non_pickups.csv?v=${encodeURIComponent(oilData.last_updated)}`).then(r => r.ok ? r.text() : ""),
      fetch(`capacity_cache.csv?v=${encodeURIComponent(oilData.last_updated)}`).then(r => r.ok ? r.text() : ""),
    ]);
    data = opsData;
    themeRegions = oilData.theme_regions || [];
    regionNames = oilData.region_names || [];
    details = allDetails[String(id)] || {};
    siteFigures = parseCapacityRow(capText, id);
    history = historyFor(id, payload.records || [], codesText);
    // Not needed for anything on the page but the history card: carry on without it.
    siteHistory = await loadCustomerHistory(oilData).then(h => historyIndex(h, payload.customers || []), () => null);
  } catch (err) {
    document.getElementById("page").innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
    return;
  }
  try {
    store = await opsOpenStore(data.snap, { index: data.index, onRemote: s => { store = s; render(); loadSiteOld(); } });
  } catch (err) {
    document.getElementById("page").innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
    return;
  }
  routeList = opsRouteList(data.snap, store);
  if (!applyCustomer(id)) {
    document.getElementById("page").innerHTML = `<div class="alert alert-warning">No active customer #${escapeHtml(String(param("id")))}.</div>`;
    return;
  }
  const banner = document.getElementById("banner");
  banner.innerHTML = shadowBannerHtml(store, data.snap);
  wireShadowReset(banner, data.snap, fresh => { store = fresh; banner.innerHTML = shadowBannerHtml(store, data.snap); render(); });

  const page = document.getElementById("page");
  page.addEventListener("input", e => {
    if (newPhoto && e.target.matches && e.target.matches("[data-photo-caption]")) newPhoto.caption = e.target.value;
    const ds = e.target.dataset || {};
    if (infoEdit && ds.ieField) {
      infoEdit.now[ds.ieField] = e.target.value;
      if (ds.ieField === "town") { infoEdit.townMsg = ""; infoEdit.townErr = false; }
    }
    if (infoEdit && ds.iePhone !== undefined) infoEdit.phones[Number(ds.iePhone)][ds.iePart] = e.target.value;
    const field = notesEdit && e.target.dataset && e.target.dataset.notesField;
    if (field) notesEdit[field] = e.target.value;
  });
  page.addEventListener("change", e => {
    const theme = infoEdit && e.target.dataset && e.target.dataset.ieTheme;
    if (theme) {
      const on = new Set(infoEdit.now.themes);
      if (e.target.checked) on.add(theme); else on.delete(theme);
      infoEdit.now.themes = SITE_THEMES.filter(t => on.has(t));
      return;
    }
    if (infoEdit && e.target.dataset && e.target.dataset.statusSince !== undefined) { infoEdit.status.since = e.target.value; return; }
    if (infoEdit && e.target.dataset && e.target.dataset.ieField === "model") {
      if (infoEdit.now.model !== "seasonal") infoEdit.now.season = "";
      render();
      return;
    }
    const part = infoEdit && e.target.dataset && e.target.dataset.ieMonth;
    if (part) {
      const [open, close] = (infoEdit.now.season || "-").split("-");
      const next = part === "open" ? [e.target.value, close] : [open, e.target.value];
      infoEdit.now.season = next.join("-");
      render();
      return;
    }
    if (!infoEdit || !e.target.dataset || e.target.dataset.ieField !== "town") return;
    const r = resolveTownInput(e.target.value);
    if (r.town) { infoEdit.now.town = r.town; e.target.value = r.town; }
    infoEdit.townMsg = r.error || r.note || "";
    infoEdit.townErr = !!r.error;
    const hint = document.getElementById("ie-town-hint");   // not a redraw: focus is moving to the next field
    hint.textContent = infoEdit.townMsg;
    hint.className = `small ${infoEdit.townErr ? "text-danger" : "ops-muted"}`;
  });
  page.addEventListener("submit", async e => {
    if (e.target.matches("[data-info-form]")) {
      e.preventDefault();
      if (infoEdit && !infoEdit.busy) saveInfo();
      return;
    }
    if (e.target.matches("[data-notes-form]")) {
      e.preventDefault();
      const n = notesEdit;
      if (!n || n.busy) return;
      n.busy = true; n.msg = ""; render();
      try {
        const saved = await opsSaveNotes(customer.customer_id, n,
          { notes: details.notes, today: todayNote(customer.customer_id) });
        details.notes = saved.notes;
        notesEdit = null;
      } catch (err) {
        n.busy = false; n.msg = `Not saved (${err.message}).`;
      }
      render();
      return;
    }
    if (e.target.matches("[data-photo-form]")) {
      e.preventDefault();
      if (!newPhoto || newPhoto.busy) return;
      const caption = String(new FormData(e.target).get("caption") || "").trim();
      newPhoto.busy = true;
      newPhoto.msg = "";
      render();
      try {
        await opsPhotoUpload(customer.customer_id, newPhoto.file, caption);
        URL.revokeObjectURL(newPhoto.url);
        newPhoto = null;
        await loadPhotos();
      } catch (err) {
        if (typeof opsLog === "function") opsLog("photo upload FAILED", err.message);
        newPhoto.busy = false;
        newPhoto.msg = err.message;
      }
      render();
      return;
    }
    if (e.target.matches("[data-edit-form]")) {
      e.preventDefault();
      const form = new FormData(e.target);
      const gallons = parseInt(form.get("gallons"), 10);
      const date = String(form.get("date") || "");
      if (!Number.isFinite(gallons) || gallons < 0 || !/^\d{4}-\d{2}-\d{2}$/.test(date) || date > todayIso()) return;
      updatePickup(e.target.dataset.editForm, gallons, date);
      editing = null;
      render();
      return;
    }
    if (e.target.id === "left") {
      e.preventDefault();
      const gallons = parseInt(new FormData(e.target).get("gallons"), 10);
      if (!Number.isFinite(gallons) || gallons < 0) return;
      recordOilLeft(store, customer, gallons);
      saveStore(store);
      leftOpen = false;
      flash = "";
      render();
      return;
    }
    if (e.target.id !== "add") return;
    e.preventDefault();
    const gallons = parseInt(new FormData(e.target).get("gallons"), 10);
    if (!Number.isFinite(gallons) || gallons < 0) return;
    recordCollection(store, customer, gallons);
    saveStore(store);
    flash = "";
    if (param("from") === "myroute") { window.location.href = "ops-myroute.html"; return; }
    render();
  });
  page.addEventListener("click", e => {
    const t = e.target.closest && e.target.closest("[data-tab]");
    if (t) { tab = t.dataset.tab; editing = null; undo = null; notesEdit = null; infoEdit = null; theftOpen = false; leftOpen = false; flash = ""; render(); return; }
    if (e.target.closest("[data-notes-edit]")) {
      notesEdit = { notes: details.notes || "", today: todayNote(customer.customer_id), busy: false, msg: "" };
      render();
      document.getElementById("today-note").focus();
      return;
    }
    if (e.target.closest("[data-notes-cancel]")) { notesEdit = null; render(); return; }
    const ch = e.target.closest("[data-status-choice]");
    if (ch && infoEdit) {   // a second tap on the picked move un-picks it
      const v = ch.dataset.statusChoice;
      infoEdit.status.choice = infoEdit.status.choice === v ? null : v;
      render();
      return;
    }
    const quick = e.target.closest("[data-status-quick]");
    if (quick) {
      setStatus(quick.dataset.statusQuick, todayIso()).then(render)
        .catch(err => { flash = escapeHtml(`Not saved (${err.message}).`); render(); });
      return;
    }
    if (e.target.closest("[data-ie-region]")) { infoEdit.regionOpen = true; render(); return; }
    if (e.target.closest("[data-left-open]")) { leftOpen = true; theftOpen = false; render(); document.getElementById("left-gal").focus(); return; }
    if (e.target.closest("[data-left-cancel]")) { leftOpen = false; render(); return; }
    if (e.target.closest("[data-theft-open]")) { theftOpen = true; leftOpen = false; render(); document.getElementById("theft-gal").focus(); return; }
    if (e.target.closest("[data-theft-cancel]")) { theftOpen = false; render(); return; }
    if (e.target.closest("[data-theft-save]")) {
      const typed = document.getElementById("theft-gal").value.trim();
      const gallons = typed === "" ? 0 : parseInt(typed, 10);
      if (!Number.isFinite(gallons) || gallons < 0) return;
      recordTheft(store, customer, gallons, document.getElementById("theft-note").value.trim());
      saveStore(store);
      theftOpen = false;
      render();
      return;
    }
    if (e.target.closest("[data-info-edit]")) {
      const opened = infoValues();
      infoEdit = { now: { ...opened }, opened, phones: contacts.map(p => ({ ...p, value: phoneShown(p.value) })),
        phonesWas: customer.customer_id > 0 && typeof opsContactsSave === "function" ? contacts : null,
        status: { choice: null, since: todayIso() }, busy: false, msg: "", townMsg: "", townErr: false };
      render();
      return;
    }
    if (e.target.closest("[data-info-cancel]")) { infoEdit = null; render(); return; }
    if (e.target.closest("[data-ie-add]")) { infoEdit.phones.push({ value: "", label: "" }); render(); return; }
    const rm = e.target.closest("[data-ie-remove]");
    if (rm) { infoEdit.phones.splice(Number(rm.dataset.ieRemove), 1); render(); return; }
    const ed = e.target.closest("[data-edit]");
    if (ed) { editing = editing === ed.dataset.edit ? null : ed.dataset.edit; undo = null; render(); return; }
    if (e.target.closest("[data-edit-cancel]")) { editing = null; render(); return; }
    if (e.target.closest("[data-edit-delete]")) { if (editing) deletePickup(editing); render(); return; }
    if (e.target.closest("[data-undo-bar]")) { const u = undo; undo = null; if (u) u.run(); render(); return; }
    if (e.target.closest("[data-photo-add]")) {
      opsPhotoPick(file => {
        if (newPhoto) URL.revokeObjectURL(newPhoto.url);
        newPhoto = { file, url: URL.createObjectURL(file), caption: "", busy: false, msg: "" };
        render();
      });
      return;
    }
    if (e.target.closest("[data-photo-cancel]")) {
      if (newPhoto) URL.revokeObjectURL(newPhoto.url);
      newPhoto = null;
      render();
      return;
    }
    const ph = e.target.closest("[data-photo]");
    if (ph) {
      const id = customer.customer_id;
      opsPhotoViewer(id, Number(ph.dataset.photo), { editable: true, onChange: (kind, r) => {
        if (kind === "removed") {
          opsPhotos.byCustomer.set(id, opsPhotosFor(id).filter(x => x.id !== r.id));
          undo = { text: "Photo removed", run: () => opsPhotoRemove(r.id, false).then(loadPhotos)
            .catch(err => { flash = escapeHtml(err.message); render(); }) };
        }
        render();
      } });
      return;
    }
    if (e.target.closest("[data-left-undo]")) {
      clearOilLeft(store, customer.customer_id);
      saveStore(store);
      render();
    } else if (e.target.closest("[data-undo]")) {
      store.collections = store.collections.filter(c =>
        !(c.date === todayIso() && c.customer_id === customer.customer_id));
      saveStore(store);
      render();
    } else if (e.target.closest("[data-assign]")) {
      const routeId = Number(document.getElementById("route").value);
      if (!routeId) return;
      const row = data.index.get(customer.customer_id);
      const n = assignToRoute(store, routeId, [{ customer_id: customer.customer_id, name: customer.name,
        capacity: row && row.capacity != null ? row.capacity : (siteFigures && siteFigures.capacity) }],
        document.getElementById("must").checked);
      saveStore(store);
      const name = routeList.find(r => r.route_id === routeId).name;
      flash = n ? `Added to ${escapeHtml(name)}.` : `Already on ${escapeHtml(name)}.`;
      render();
    }
  });
  render();
  loadSiteOld();
  if (id > 0 && typeof opsContactsLoad === "function") opsContactsLoad(id).then(list => {
    contacts = list;
    if (list.length && !infoEdit) render();
  });
  if (photosReady) { loadPhotos(); opsPhotosWatch(render); }
}

init();
</script>
</body>
</html>
