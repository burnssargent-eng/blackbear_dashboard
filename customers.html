<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top Customers — Black Bear Biodiesel</title>

  <link rel="stylesheet" href="dashboard.css">
</head>

<body>

<header>
  <img src="logo.png" alt="Black Bear Biodiesel" onerror="this.style.display='none'">
  <div>
    <div class="subtitle">Oil Collection Analytics</div>
    <h1>Black Bear Biodiesel</h1>
  </div>
  <div class="header-center">
    <div class="page-name" id="page-name"></div>
    <nav class="main-nav" id="main-nav"></nav>
  </div>
  <div class="last-updated" id="last-updated"></div>
</header>

<div class="page" id="page">
  <div class="page-state">
    <div class="state-message">Loading customer data…</div>
  </div>
</div>

<script src="dashboard-utils.js"></script>
<script>
let allRecords = [];
let allMonths = [];
let firstPickupByCustomer = {};   // customer_id -> earliest date anywhere in the data
let allYears = [];                // calendar years present, ascending
let lifecycleRows = [];           // per-year serviced / gained / lost / net
let dormantCutoff = "";

async function init() {
  const page = document.getElementById("page");

  let data;
  try {
    data = await loadOilData();
    allRecords = await loadCollections(data);
  } catch (err) {
    renderNav("customers", null);
    renderState(page, "error", "Could not load the collection data.", err.message);
    return;
  }

  renderNav("customers", data);
  renderLastUpdated(data);

  if (!allRecords.length) {
    renderState(page, "empty", "No collection records are available.");
    return;
  }

  allMonths = Array.from(new Set(allRecords.map(r => r.month))).sort();
  allYears = Array.from(new Set(allRecords.map(r => Number(r.year))))
    .filter(Number.isFinite)
    .sort((a, b) => a - b);

  // Earliest pickup per customer across the WHOLE dataset. Used to decide
  // whether a customer was gained during the selected period, which has to be
  // judged against all history rather than only the filtered rows.
  allRecords.forEach(r => {
    const seen = firstPickupByCustomer[r.customer_id];
    if (!seen || r.date < seen) firstPickupByCustomer[r.customer_id] = r.date;
  });

  lifecycleRows = data.lifecycle_by_year || [];
  dormantCutoff = data.dormant_cutoff || "";

  buildShell(page);
  update();
  renderLifecycle();
}

/**
 * Places serviced / gained / lost / net per year.
 *
 * These are whole-history figures computed in oil_scraper.py, so they do NOT
 * follow the period selector above — a lifecycle year means the same thing
 * regardless of which month is selected.
 */
function renderLifecycle() {
  const el = document.getElementById("lifecycle-section");
  if (!el) return;

  if (!lifecycleRows.length) {
    el.innerHTML = `
      <div class="section-title">Customer Lifecycle by Year</div>
      <div class="note">Lifecycle data is not available in this export.</div>`;
    return;
  }

  const totals = lifecycleRows.reduce((acc, r) => ({
    gained: acc.gained + (Number(r.gained) || 0),
    lost: acc.lost + (Number(r.lost) || 0),
  }), { gained: 0, lost: 0 });

  const firstYear = lifecycleRows[0].year;

  el.innerHTML = `
    <div class="section-title" id="lifecycle">Customer Lifecycle by Year</div>
    <div class="section-caption">
      <strong>Serviced</strong> = unique customers with at least one qualifying
      pickup in that year.
      <strong>Gained</strong> = customers whose first qualifying pickup was in
      that year.
      <strong>Lost</strong> = customers whose last qualifying pickup was in that
      year and who are inactive or dormant.
    </div>
    ${lifecycleFootnoteHtml(`
      <br><strong>Places Serviced</strong> counts unique customers with at least
      one qualifying pickup that year.
      <strong>Gained</strong> is the year of a customer's first qualifying pickup.
      <strong>Lost</strong> is the year of their last qualifying pickup, counted
      only for customers who are source-site inactive or still active but with no
      qualifying pickup since ${escapeHtml(dormantCutoff || "the dormant cutoff")}.
      <strong>Net</strong> is Gained minus Lost.
      <br>${firstYear} shows every pre-existing customer as gained, because it is
      the first year of recorded data rather than the year they actually started.`)}
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Year</th>
            <th class="center">Places Serviced</th>
            <th class="center">Gained</th>
            <th class="center">Lost</th>
            <th class="center">Net</th>
          </tr>
        </thead>
        <tbody>
          ${lifecycleRows.slice().reverse().map(r => {
            const net = Number(r.net) || 0;
            const cls = net > 0 ? "up" : (net < 0 ? "down" : "");
            return `
              <tr>
                <td><a href="year.html?year=${encodeURIComponent(r.year)}">${escapeHtml(r.year)}</a></td>
                <td class="center">${formatNumber(r.places_serviced)}</td>
                <td class="center">${formatNumber(r.gained)}</td>
                <td class="center">${formatNumber(r.lost)}</td>
                <td class="center ${cls}">${net > 0 ? "+" : ""}${formatNumber(net)}</td>
              </tr>`;
          }).join("")}
          <tr class="group-row">
            <td>All years</td>
            <td class="center">—</td>
            <td class="center">${formatNumber(totals.gained)}</td>
            <td class="center">${formatNumber(totals.lost)}</td>
            <td class="center">${totals.gained - totals.lost > 0 ? "+" : ""}${formatNumber(totals.gained - totals.lost)}</td>
          </tr>
        </tbody>
      </table>
    </div>`;
}

function buildShell(page) {
  renderPageName("Top Producing Customers");

  const latest = allMonths[allMonths.length - 1];
  const latestYear = allYears[allYears.length - 1];

  page.innerHTML = `
    <a class="back-link" href="index.html">← Back to the dashboard</a>
    <div class="page-subtitle" id="period-label">—</div>

    <div class="controls">
      <label for="mode-select">Period</label>
      <select id="mode-select">
        ${VIEW_MODES.map(m => `<option value="${m.value}">${m.label}</option>`).join("")}
      </select>

      <!-- Only one of these is shown at a time, depending on the period.
           Monthly and the to-date periods need a month; Yearly needs a whole
           calendar year; All Time needs neither. -->
      <label id="month-label" for="month-select">Month</label>
      <select id="month-select">
        ${allMonths.slice().reverse().map(m =>
          `<option value="${m}"${m === latest ? " selected" : ""}>${formatMonth(m)}</option>`).join("")}
      </select>

      <label id="year-label" for="year-select">Year</label>
      <select id="year-select">
        ${allYears.slice().reverse().map(y =>
          `<option value="${y}"${y === latestYear ? " selected" : ""}>${y}</option>`).join("")}
      </select>

      <label>Sort</label>
      <button id="sort-gallons" class="active">Top producers</button>
      <button id="sort-status">Active first</button>
    </div>

    <a class="jump-link" href="#lifecycle">↓ View lifecycle summary</a>

    <div class="stats-bar" id="summary"></div>

    <div class="note" id="notes"></div>

    <div class="section">
      <div class="section-title" id="table-title">Customers</div>
      <div id="table-area"></div>
    </div>

    <div class="section" id="lifecycle-section"></div>
  `;

  document.getElementById("mode-select").addEventListener("change", update);
  document.getElementById("month-select").addEventListener("change", update);
  document.getElementById("year-select").addEventListener("change", update);

  document.getElementById("sort-gallons").addEventListener("click", () => setSort("gallons"));
  document.getElementById("sort-status").addEventListener("click", () => setSort("status"));
}

let sortMode = "gallons";

function setSort(mode) {
  sortMode = mode;
  document.getElementById("sort-gallons").classList.toggle("active", mode === "gallons");
  document.getElementById("sort-status").classList.toggle("active", mode === "status");
  update();
}

function update() {
  const mode = document.getElementById("mode-select").value;
  const picker = pickerForMode(mode);

  // Show only the control the selected period actually needs.
  const monthSel = document.getElementById("month-select");
  const yearSel = document.getElementById("year-select");
  const monthLabel = document.getElementById("month-label");
  const yearLabel = document.getElementById("year-label");

  const showMonth = picker === "month";
  const showYear = picker === "year";

  monthSel.style.display = showMonth ? "" : "none";
  monthLabel.style.display = showMonth ? "" : "none";
  yearSel.style.display = showYear ? "" : "none";
  yearLabel.style.display = showYear ? "" : "none";

  // Yearly works off the year dropdown, so the month it hands downstream is
  // any month inside that year — getMonthsForMode expands it to the full year.
  let selectedMonth;
  if (showYear) {
    const year = yearSel.value;
    selectedMonth = allMonths.filter(m => m.startsWith(year)).pop() || allMonths[allMonths.length - 1];
  } else {
    selectedMonth = monthSel.value;
  }

  const periodMonths = new Set(getMonthsForMode(mode, allMonths, selectedMonth));
  const rows = allRecords.filter(r => periodMonths.has(r.month));

  document.getElementById("period-label").textContent =
    periodLabel(mode, allMonths, selectedMonth);

  const summary = document.getElementById("summary");
  const tableArea = document.getElementById("table-area");
  const notes = document.getElementById("notes");

  if (!rows.length) {
    summary.innerHTML = "";
    notes.innerHTML = "";
    renderState(tableArea, "empty", "No collections in the selected period.",
      "Try a different month or a wider period.");
    return;
  }

  const customers = aggregateCustomers(rows);
  const totalGallons = sumGallons(rows);
  const avgPerPickup = rows.length ? totalGallons / rows.length : 0;

  // Gained: the customer's first-ever pickup falls inside this period.
  //
  // Only meaningful when the period starts after the data does. A period that
  // reaches back to the first month trivially "gains" every customer who ever
  // existed, so that is shown as a dash instead of a misleading total.
  const coversStart = periodMonths.has(allMonths[0]);
  const gained = coversStart
    ? null
    : customers.filter(c => periodMonths.has(
        String(firstPickupByCustomer[c.customer_id] || "").slice(0, 7)
      )).length;

  summary.innerHTML = `
    <div class="stat">
      <div class="stat-val">${formatNumber(totalGallons)}</div>
      <div class="stat-label">Total Gallons</div>
    </div>
    <div class="stat">
      <div class="stat-val">${formatNumber(customers.length)}</div>
      <div class="stat-label">Customers</div>
    </div>
    <div class="stat">
      <div class="stat-val">${formatNumber(rows.length)}</div>
      <div class="stat-label">Pickups</div>
    </div>
    <div class="stat">
      <div class="stat-val">${formatNumber(Math.round(avgPerPickup))}</div>
      <div class="stat-label">Avg Gallons / Pickup</div>
    </div>
    <div class="stat">
      <div class="stat-val">${gained === null ? "—" : formatNumber(gained)}</div>
      <div class="stat-label">Gained Customers</div>
    </div>
  `;

  notes.innerHTML = `
    <strong>Status</strong> comes from the source site's active and inactive
    customer lists, never from how recently a customer had a pickup.
    <br><strong>Gained customers</strong> are those whose first-ever pickup in the
    whole dataset falls inside this period. It shows a dash for periods that
    reach back to the start of the data, where every customer would count as
    gained.
    <br><strong>Lost customers is not shown.</strong> There are several defensible
    definitions (dropped off the source-site active list, versus stopped having
    pickups) and they give different numbers, so this metric needs your sign-off
    on a definition before it goes on the page.
  `;

  renderTable(tableArea, customers);
  document.getElementById("table-title").textContent =
    `Top Producing Customers · ${formatNumber(customers.length)} in ` +
    periodLabel(mode, allMonths, selectedMonth);
}

function renderTable(area, customers) {
  const sorted = sortMode === "status"
    ? sortCustomersByStatusThenGallons(customers)
    : sortCustomersByGallons(customers);

  let body = "";
  let lastGroup = null;

  sorted.forEach((c, i) => {
    if (sortMode === "status") {
      const group = customerStatusLabel(c.is_active).text;
      if (group !== lastGroup) {
        body += `<tr class="group-row"><td colspan="9">${group}</td></tr>`;
        lastGroup = group;
      }
    }

    const townCell = c.geo_town
      ? `<a href="town.html?town=${encodeURIComponent(c.geo_town)}">${escapeHtml(c.geo_town)}</a>`
      : escapeHtml(c.city || "—");

    body += `
      <tr>
        <td class="rank">${i + 1}</td>
        <td>${escapeHtml(c.name)}</td>
        <td>${townCell}</td>
        <td>${escapeHtml(c.county || "—")}</td>
        <td class="gal">${formatNumber(c.gallons)}</td>
        <td class="num">${formatNumber(c.pickups)}</td>
        <td>${formatDate(c.first)}</td>
        <td>${formatDate(c.last)}</td>
        <td>${statusBadge(c.is_active)}</td>
      </tr>
    `;
  });

  area.innerHTML = `
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th class="rank">#</th>
            <th>Customer</th>
            <th>Town</th>
            <th>County</th>
            <th class="num">Gallons</th>
            <th class="num">Pickups</th>
            <th>First Qualifying Pickup</th>
            <th>Last Qualifying Pickup</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>${body}</tbody>
      </table>
    </div>
  `;
}

init();
</script>

</body>
</html>
