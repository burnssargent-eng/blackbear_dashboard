<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pickup Projections (beta) — Black Bear Biodiesel</title>

  <link rel="stylesheet" href="dashboard.css">
</head>

<body>

<header>
  <a class="brand-home" href="index.html" aria-label="Back to dashboard">
    <img src="logo.png" alt="Black Bear Biodiesel" onerror="this.style.display='none'">
    <div>
      <div class="subtitle">Oil Collection Analytics</div>
      <h1>Black Bear Biodiesel</h1>
    </div>
  </a>
  <div class="header-center">
    <div class="page-name" id="page-name"></div>
    <nav class="main-nav" id="main-nav"></nav>
  </div>
  <img class="header-team" src="team.png" alt="The Black Bear Biodiesel team"
       onerror="this.style.display='none'">
  <div class="last-updated" id="last-updated"></div>
</header>

<div class="page" id="page">
  <div class="page-state">
    <div class="state-message">Loading projections…</div>
  </div>
</div>

<script src="dashboard-utils.js"></script>
<script>
/*
 * Beta pickup projections. Not linked from the nav yet.
 *
 * Everything shown here is computed by analysis/build_projection_table.py and
 * read from oil_projections.json, which the nightly job rebuilds after the
 * scrape. This page NEVER recomputes a projection or re-derives a section: the
 * maths lives in one place, in Python. Rows show in the export's order (the
 * builder's urgency ranking) unless the viewer clicks a column heading to sort;
 * clicking "#" returns to the export's order.
 */

const PROJECTIONS_FILE = "oil_projections.json";

// Held-out sections, in the order the export lists them. The ranked section
// is rendered separately as the main table.
const SECTION_TEXT = {
  "seasonal holdout":
    "Seasonal accounts that are closed, or have gone quiet, outside their " +
    "season — or whose season has opened but who have not had a pickup yet. " +
    "Months of closure are not counted as oil building up.",
  "event-driven":
    "Fairs and event venues. Their oil follows the event calendar, not a " +
    "daily rate, so they get no fill estimate.",
  "on-demand / unlimited":
    "Bulk accounts collected on request. Container-fill timing does not apply.",
  "lump-sum / interval-based":
    "Accounts collected in lumps at set intervals rather than as a barrel fills.",
  "will-call":
    "Picked up on call or too seldom to project: the gaps between pickups " +
    "are long or irregular (a closed season does not count). No fill " +
    "estimate — days since the last pickup is the signal.",
  "stale":
    "Active on the source site, but no pickup in the last 180 days, so a " +
    "fill estimate would mean nothing.",
  "insufficient data":
    "Fewer than 3 pickups. The first pickup only starts the clock, so a " +
    "rate needs two more.",
};

let projections = null;     // the parsed oil_projections.json
let oilData = null;         // oil_data.json, for the nav and the freshness check
let selectedRegion = "";    // "" means every region
let searchText = "";        // customer search, lower-cased
let sortKey = null;         // null = the export's order
let sortDir = "desc";

// Ranked rows after the region and search filters, in the export's order,
// and each one's urgency rank within the region (kept through a re-sort).
let currentRanked = [];
let currentRanks = new Map();

const RANKED_ROW_LIMITS = { collapsed: 250, expanded: Infinity };

// Sortable ranked-table columns. `value` gives the sort value (null sorts last
// in either direction); text columns start A to Z, the rest start high to low.
const RANKED_COLUMNS = [
  { key: "rank", label: "#" },
  { key: "name", label: "Customer", text: true, value: c => c.name },
  { key: "town", label: "Town", text: true, value: c => c.town },
  { key: "projected", label: "Projected gal (range)", value: c => c.range_high },
  { key: "capacity", label: "Capacity", value: c => c.capacity },
  { key: "pct_full", label: "% full", value: c => c.pct_full },
  { key: "days_past", label: "Days past pickup point",
    value: c => (c.days_until_75 === null || c.days_until_75 === undefined)
      ? null : -c.days_until_75 },
  { key: "rate", label: "Gal / day", value: c => c.rate_gpd },
  { key: "last_pickup", label: "Last pickup", value: c => c.last_pickup },
  { key: "periodicity", label: "Periodicity", value: c => c.periodicity_days },
  { key: "avg_all", label: "Avg Collection", value: c => c.avg_collection_all },
];

async function loadProjections() {
  const resp = await fetch(`${PROJECTIONS_FILE}?v=${Date.now()}`);
  if (!resp.ok) {
    throw new Error(`Could not load ${PROJECTIONS_FILE} (HTTP ${resp.status})`);
  }
  return resp.json();
}

async function init() {
  const page = document.getElementById("page");

  try {
    oilData = await loadOilData();
    projections = await loadProjections();
  } catch (err) {
    renderNav(null, oilData);
    renderState(page, "error", "Could not load the projections.", err.message);
    return;
  }

  renderNav(null, oilData);
  renderLastUpdated(oilData);

  if (!projections.customers || !projections.customers.length) {
    renderState(page, "empty", "No projections are available.");
    return;
  }

  selectedRegion = regionOptions(projections).includes(getUrlParam("region"))
    ? getUrlParam("region") : "";

  buildShell(page);
  update();
}

/**
 * A warning when this projection was not built from the scrape the site is
 * now showing -- i.e. the nightly scraped but the projection build failed.
 * Returns null when they match.
 */
function freshnessWarning(payload, data) {
  const built = payload && payload.data_last_updated;
  const live = data && data.last_updated;
  if (!built || !live || built === live) return null;
  return `These projections were built from the ${formatDate(built.slice(0, 10))} ` +
    `data, but the site now has newer data (${formatDate(live.slice(0, 10))}). ` +
    "The nightly projection build may have failed; treat these figures as out of date.";
}

/** Regions that actually have customers in the export, in the site's order. */
function regionOptions(payload) {
  const present = new Set();
  payload.customers.forEach(c => (c.regions || []).forEach(r => present.add(r)));
  return (payload.region_order || []).filter(r => present.has(r));
}

/** Customers in `region`, keeping the export's order. "" keeps everyone. */
function filterByRegion(customers, region) {
  if (!region) return customers.slice();
  return customers.filter(c => (c.regions || []).includes(region));
}

function buildShell(page) {
  renderPageName("Pickup Projections (beta)");

  const target = Math.round((projections.target_fraction || 0.75) * 100);
  const warning = freshnessWarning(projections, oilData);

  page.innerHTML = `
    <a class="back-link" href="index.html">← Back to the dashboard</a>
    <div class="page-subtitle">
      Projected oil as of <strong>${escapeHtml(formatDate(projections.as_of))}</strong>,
      the latest pickup in the data
    </div>

    ${warning ? `<div class="note proj-warning">${escapeHtml(warning)}</div>` : ""}

    <div class="note proj-beta">
      <span class="proj-beta-tag">Beta</span>
      Each customer's rate is the average of its gallons per day over the last
      year and over its last six pickups. A customer with under a year of
      history uses its pickups so far (from its third pickup on, with a wider
      range); a customer with a proven seasonal pattern uses its year-round
      level adjusted for the month. <strong>Projected gallons</strong> is
      that rate times the days since the last pickup <em>or</em> since the truck
      last checked and found the container empty, whichever is later: the oil
      produced since then, not a promise of what the truck will collect. The pickup point is
      <strong>${target}% of listed capacity</strong>, which leaves a spillover
      buffer. <strong>% full</strong> stops at 100%; a customer projected past
      that carries a note to check its capacity. Seasonal, event, bulk and
      will-call accounts are listed separately below instead of being ranked. Accounts
      that share one barrel are shown as a single stop.
    </div>

    <div class="controls">
      <label for="region-select">Region</label>
      <select id="region-select">
        <option value="">All regions</option>
        ${regionOptions(projections).map(r =>
          `<option value="${escapeHtml(r)}"${r === selectedRegion ? " selected" : ""}>` +
          `${escapeHtml(r)}</option>`).join("")}
      </select>
      <label for="proj-search">Search</label>
      <input type="search" id="proj-search" class="proj-search"
             placeholder="Customer name" autocomplete="off">
    </div>

    <div class="stats-bar proj-stats" id="summary"></div>

    <div class="section">
      <div class="section-title" id="ranked-title">Route candidates</div>
      <div class="section-caption">
        Default order is most urgent first: days past full capacity, then days
        past the ${target}% pickup point, then % full. Click a column heading to
        sort by it; click # to return to this order. A negative
        <strong>days past pickup point</strong> is the days until the customer
        reaches it.
      </div>
      <div id="ranked-list"></div>
    </div>

    <div class="section" id="held-out"></div>
  `;

  document.getElementById("region-select").addEventListener("change", e => {
    selectedRegion = e.target.value;
    const url = new URL(window.location.href);
    if (selectedRegion) url.searchParams.set("region", selectedRegion);
    else url.searchParams.delete("region");
    window.history.replaceState(null, "", url);
    update();
  });

  document.getElementById("proj-search").addEventListener("input", e => {
    searchText = e.target.value.trim().toLowerCase();
    update();
  });

  // The table is rebuilt on every render, so one listener on its container.
  document.getElementById("ranked-list").addEventListener("click", e => {
    const button = e.target.closest && e.target.closest("[data-sort]");
    if (button) setSort(button.dataset.sort);
  });
}

/** True when the search box is empty or matches the name or a barrel member. */
function matchesSearch(c) {
  if (!searchText) return true;
  const names = [c.name, ...(c.members || []).map(m => m.name)];
  return names.some(n => (n || "").toLowerCase().includes(searchText));
}

/** A heading click: "#" restores the export's order, a repeat click flips. */
function setSort(key) {
  if (key === "rank") {
    sortKey = null;
  } else if (key === sortKey) {
    sortDir = sortDir === "asc" ? "desc" : "asc";
  } else {
    const column = RANKED_COLUMNS.find(col => col.key === key);
    if (!column) return;
    sortKey = key;
    sortDir = column.text ? "asc" : "desc";
  }
  renderRanked();
}

/**
 * Rows in the viewer's chosen order. A stable sort over the export's order, so
 * ties keep the builder's ranking; missing values sort last either way.
 */
function sortRows(rows) {
  const column = RANKED_COLUMNS.find(col => col.key === sortKey);
  if (!column || !column.value) return rows.slice();
  const sign = sortDir === "asc" ? 1 : -1;
  const missing = v => v === null || v === undefined || v === "";
  return rows.slice().sort((a, b) => {
    const va = column.value(a), vb = column.value(b);
    if (missing(va) || missing(vb)) return missing(va) - missing(vb);
    if (column.text) return sign * String(va).localeCompare(String(vb));
    return sign * (va < vb ? -1 : va > vb ? 1 : 0);
  });
}

function renderRanked() {
  const list = document.getElementById("ranked-list");
  if (!currentRanked.length) {
    list.innerHTML = `<div class="note">${searchText
      ? "No route candidates match the search."
      : "No route candidates in this region."}</div>`;
    return;
  }
  renderExpandableCustomerList(list, sortRows(currentRanked),
    rows => rankedRowsHtml(rows, currentRanks), RANKED_ROW_LIMITS);
}

function update() {
  const customers = filterByRegion(projections.customers, selectedRegion);
  const ranked = customers.filter(c => c.section === "ranked");
  const heldOut = customers.filter(c => c.section !== "ranked");

  // The header boxes describe the region; the search only narrows the tables.
  document.getElementById("summary").innerHTML = summaryHtml(ranked, heldOut);

  currentRanks = new Map(ranked.map((c, i) => [c.id, i + 1]));
  currentRanked = ranked.filter(matchesSearch);

  document.getElementById("ranked-title").textContent =
    `Route candidates · ${formatNumber(currentRanked.length)}` +
    (searchText ? ` of ${formatNumber(ranked.length)}` : "") +
    (selectedRegion ? ` in ${selectedRegion}` : "");

  document.getElementById("ranked-list").dataset.expanded = "false";
  renderRanked();

  document.getElementById("held-out").innerHTML =
    heldOutHtml(heldOut.filter(matchesSearch));
}

// The held-out sections counted in the fifth header box.
const HELD_OUT_COUNTED = ["seasonal holdout", "will-call", "stale", "insufficient data"];

function summaryHtml(ranked, heldOut) {
  const totalGal = ranked.reduce((sum, c) => sum + (c.projected_gal || 0), 0);
  const pastTarget = ranked.filter(c => (c.days_past_75 || 0) > 0).length;
  const pastHalf = ranked.filter(c => (c.pct_full || 0) > 50).length;
  const counted = heldOut.filter(c => HELD_OUT_COUNTED.includes(c.section)).length;
  const target = Math.round((projections.target_fraction || 0.75) * 100);
  const stat = (value, label) => `
    <div class="stat">
      <div class="stat-val">${formatNumber(value)}</div>
      <div class="stat-label">${label}</div>
    </div>`;
  return stat(Math.round(totalGal), "Total Projected Oil (gal)") +
    stat(ranked.length, "Route Candidates") +
    stat(pastTarget, `Past Pickup Point (${target}%)`) +
    stat(pastHalf, "Past 50% Full") +
    stat(counted, "Seasonally Closed · Will\u2011call · Stale · Insufficient");
}

/** One-decimal number, or a dash for a missing value. */
function formatOne(value) {
  if (value === null || value === undefined || !Number.isFinite(Number(value))) return "—";
  return Number(value).toLocaleString(undefined,
    { minimumFractionDigits: 1, maximumFractionDigits: 1 });
}

/** Capped % full as a number plus a small fill bar. */
function pctFullHtml(pct) {
  if (pct === null || pct === undefined) return "—";
  const width = Math.max(0, Math.min(100, Number(pct)));
  const level = width >= 100 ? "full" : (width >= 75 ? "due" : "ok");
  return `<span class="proj-pct">${Math.round(width)}%` +
    `<span class="proj-bar"><span class="proj-bar-fill proj-${level}" ` +
    `style="width:${width}%"></span></span></span>`;
}

/** "Shared barrel: Julio's-67% · Oakes and Evelyn-33%" for a combined row. */
function sharedNote(c) {
  return "Shared barrel: " + c.members.map(m => m.name).join(" · ");
}

/** Why the clock restarted after the last pickup. */
function emptyCheckNote(c) {
  return `Checked empty ${formatDate(c.last_empty_check)}, counting from then`;
}

/** Status (when not the default) and flags, as small lines under the name. */
function notesHtml(c) {
  const lines = [];
  if (c.members) lines.push(sharedNote(c));
  if (c.history_start) lines.push(`History from ${formatDate(c.history_start)} (new owner)`);
  if (c.last_empty_check) lines.push(emptyCheckNote(c));
  if (c.status && c.status !== "50/50 default") lines.push(c.status);
  if (c.stage === "new") lines.push("New customer — wide range");
  if (c.stage === "seasonal") lines.push("Seasonal rate (adjusted for the month)");
  if (c.stage === "closer in season") lines.push(`In-season rate (open ${c.season})`);
  (c.flags || []).forEach(f => lines.push(f));
  return lines.length
    ? `<div class="proj-notes">${lines.map(escapeHtml).join("<br>")}</div>`
    : "";
}

/** Whole number, or a dash for a missing value. */
function formatWhole(value) {
  if (value === null || value === undefined || !Number.isFinite(Number(value))) return "—";
  return formatNumber(Math.round(Number(value)));
}

/** Days past the pickup point, negative while still short of it. */
function daysPastHtml(c) {
  if (c.days_until_75 === null || c.days_until_75 === undefined) return "—";
  const days = Math.round(-c.days_until_75);
  return days === 0 ? "0" : formatNumber(days);
}

/** "170 (128–247)": the projection, with its likely range smaller and grey. */
function projectedHtml(c) {
  return `${formatWhole(c.projected_gal)} <span class="proj-range">` +
    `(${formatWhole(c.range_low)}–${formatWhole(c.range_high)})</span>`;
}

function rankedHeadHtml() {
  return RANKED_COLUMNS.map(col => {
    const active = col.key === sortKey || (col.key === "rank" && sortKey === null);
    const arrow = col.key === sortKey ? (sortDir === "asc" ? "▲" : "▼") : "";
    return `<th${col.key === "rank" ? ' class="rank"' : ""}>` +
      `<button type="button" class="proj-sort${active ? " proj-sorted" : ""}" ` +
      `data-sort="${col.key}">${escapeHtml(col.label)}` +
      `<span class="proj-arrow">${arrow}</span></button></th>`;
  }).join("");
}

/** `ranks` maps id to the urgency rank; without it, rows number from 1. */
function rankedRowsHtml(rows, ranks) {
  const body = rows.map((c, i) => `
    <tr>
      <td class="rank">${(ranks && ranks.get(c.id)) || i + 1}</td>
      <td>${escapeHtml(c.name)}${notesHtml(c)}</td>
      <td>${escapeHtml(c.town || "—")}</td>
      <td class="gal">${projectedHtml(c)}</td>
      <td class="num">${formatWhole(c.capacity)}</td>
      <td class="num">${pctFullHtml(c.pct_full)}</td>
      <td class="num">${daysPastHtml(c)}</td>
      <td class="num">${formatOne(c.rate_gpd)}</td>
      <td class="proj-date">${formatDate(c.last_pickup)}</td>
      <td class="num">${formatWhole(c.periodicity_days)}</td>
      <td class="num">${formatOne(c.avg_collection_all)}</td>
    </tr>`).join("");

  return `
    <div class="table-wrap">
      <table class="data-table proj-table">
        <thead>
          <tr>${rankedHeadHtml()}</tr>
        </thead>
        <tbody>${body}</tbody>
      </table>
    </div>`;
}

/** Notes under a held-out row: shared barrel, new owner, empty check, flags. */
function heldOutNotesHtml(c) {
  const lines = [
    ...(c.members ? [sharedNote(c)] : []),
    ...(c.history_start ? [`History from ${formatDate(c.history_start)} (new owner)`] : []),
    ...(c.last_empty_check ? [emptyCheckNote(c)] : []),
    ...(c.flags || []),
  ];
  return lines.length
    ? `<div class="proj-notes">${lines.map(escapeHtml).join("<br>")}</div>`
    : "";
}

function heldOutRowsHtml(rows) {
  const body = rows.map(c => `
    <tr>
      <td>${escapeHtml(c.name)}${heldOutNotesHtml(c)}</td>
      <td>${escapeHtml(c.town || "—")}</td>
      <td>${escapeHtml(c.status)}</td>
      <td class="proj-reason">${escapeHtml(c.reason || "—")}</td>
      <td class="proj-date">${formatDate(c.last_pickup)}</td>
      <td class="num">${formatNumber(c.days_since)}</td>
      <td class="num">${formatOne(c.rate_gpd)}</td>
      <td class="num">${formatOne(c.avg_collection)}</td>
      <td class="num">${c.capacity === null ? "—" : formatNumber(c.capacity)}</td>
    </tr>`).join("");

  return `
    <div class="table-wrap">
      <table class="data-table proj-table">
        <thead>
          <tr>
            <th>Customer</th>
            <th>Town</th>
            <th>Status</th>
            <th>Why it is listed here</th>
            <th>Last pickup</th>
            <th class="num">Days since</th>
            <th class="num">Gal / day</th>
            <th class="num">Avg pickup (gal)</th>
            <th class="num">Capacity</th>
          </tr>
        </thead>
        <tbody>${body}</tbody>
      </table>
    </div>`;
}

/** Every non-empty held-out section, collapsed, in the export's order. */
function heldOutHtml(heldOut) {
  const order = (projections.section_order || []).filter(s => s !== "ranked");
  const blocks = order.map(section => {
    const rows = heldOut.filter(c => c.section === section);
    if (!rows.length) return "";
    return `
      <details class="proj-section">
        <summary>${escapeHtml(section.charAt(0).toUpperCase() + section.slice(1))}
          <span class="proj-count">${formatNumber(rows.length)}</span></summary>
        <div class="section-caption">${escapeHtml(SECTION_TEXT[section] || "")}</div>
        ${heldOutRowsHtml(rows)}
      </details>`;
  }).join("");

  return blocks
    ? `<div class="section-title">Listed separately, not ranked</div>${blocks}`
    : "";
}

init();
</script>

</body>
</html>
