<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Year Detail — Black Bear Biodiesel</title>

  <link rel="stylesheet" href="dashboard.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <!-- Sign-in card: the page stays hidden until a team member signs in (site-gate.js). -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js" integrity="sha384-rwykjmWNwVxboyFmvK9OXN0wj9hnMHA2aAHtits54DuACyCq0M2PrSNxhRb+hvXT" crossorigin="anonymous"></script>
  <script src="site-gate.js" data-protect></script>
</head>

<body>

<header>
  <a class="brand-home" href="index.html" aria-label="Back to dashboard">
    <img src="logo.png" alt="Black Bear Biodiesel" onerror="this.style.display='none'">
    <div>
      <div class="subtitle">Oil Collection Analytics</div>
      <h1>Black Bear Biodiesel</h1>
    </div>
  </a>
  <div class="header-center">
    <div class="page-name" id="page-name"></div>
    <nav class="main-nav" id="main-nav"></nav>
  </div>
  <img class="header-team" src="team.png" alt="The Black Bear Biodiesel team"
       onerror="this.style.display='none'">
  <div class="last-updated" id="last-updated"></div>
</header>

<div class="page" id="page">
  <div class="page-state">
    <div class="state-message">Loading year data…</div>
  </div>
</div>

<script src="dashboard-utils.js"></script>
<script>
// How many towns the bar chart shows before it becomes unreadable.
const TOWN_CHART_LIMIT = 20;

async function init() {
  const page = document.getElementById("page");

  let data, records, hist;
  try {
    data = await loadOilData();
    records = await loadCollections(data);
    hist = await loadCustomerHistory(data);
  } catch (err) {
    renderNav("year", null);
    renderState(page, "error", "Could not load the collection data.", err.message);
    return;
  }

  renderNav("year", data);
  renderLastUpdated(data);

  const availableYears = Array.from(new Set(records.map(r => Number(r.year))))
    .filter(Number.isFinite)
    .sort((a, b) => a - b);

  if (!availableYears.length) {
    renderState(page, "empty", "No collection years found in the data.");
    return;
  }

  // Default to the most recent year when no valid year is supplied.
  const requested = Number(getUrlParam("year"));
  const year = availableYears.includes(requested)
    ? requested
    : availableYears[availableYears.length - 1];

  document.title = `${year} — Black Bear Biodiesel`;

  const rows = records.filter(r => Number(r.year) === year);

  if (!rows.length) {
    renderState(page, "empty", `No collections recorded for ${year}.`,
      `Data is available for ${availableYears[0]} through ${availableYears[availableYears.length - 1]}.`);
    return;
  }

  render(page, rows, year, availableYears, hist, data.retention_by_year || []);
}

const pct = v => (v === null || v === undefined ? "—" : `${(v * 100).toFixed(1)}%`);

/**
 * Gained and ended BUSINESSES in a year (customer_history.json). Decided in
 * customer_eras.py from the whole dataset, so a business's years are stable
 * whichever year page you are on. A successor on an old account is a gain and
 * its predecessor a handover; non_recurring is in neither list.
 */
function yearBusinesses(hist, year) {
  const all = ((hist && hist.businesses) || []).filter(b => b.end_reason !== "non_recurring");
  return {
    gained: all.filter(b => b.gained_year === year)
      .sort((a, b) => a.first_pickup.localeCompare(b.first_pickup)),
    ended: all.filter(b => b.end_year === year)
      .sort((a, b) => a.last_pickup.localeCompare(b.last_pickup)),
    byId: new Map(((hist && hist.businesses) || []).map(b => [b.id, b])),
  };
}

const bizLink = b => `<a href="former.html?b=${encodeURIComponent(b.id)}">${escapeHtml(b.name)}</a>`;

/** Every year's retention row, the shown year highlighted. */
function retentionTableHtml(rowsByYear, year) {
  return `<div class="table-wrap"><table class="data-table">
    <thead><tr><th>Year</th><th class="num">Active 1 Jan</th><th class="num">New sites</th><th class="num">Successors</th>
      <th class="num">Lost</th><th class="num">Closed</th><th class="num">Changed hands</th><th class="num">Moved away</th>
      <th class="num">Unclassified</th><th class="num">True churn</th></tr></thead>
    <tbody>${rowsByYear.map(r => `
      <tr${r.year === year ? ' class="fmr-picked"' : ""}>
        <td class="yr-year"><a href="year.html?year=${r.year}">${r.year}</a>${r.history_start ? " *" : r.partial ? " to date" : ""}</td>
        <td class="num">${r.history_start ? "—" : formatNumber(r.active_jan1)}</td>
        <td class="num">${formatNumber(r.gained_new)}</td>
        <td class="num">${formatNumber(r.gained_successor)}</td>
        <td class="num">${formatNumber(r.lost)}</td>
        <td class="num">${formatNumber(r.closed)}</td>
        <td class="num">${formatNumber(r.changed_hands)}</td>
        <td class="num">${formatNumber(r.moved)}</td>
        <td class="num">${formatNumber(r.unknown)}</td>
        <td class="num" title="Up to ${pct(r.churn_high)} if every unclassified ending and move were a loss">${pct(r.churn)}
          <span class="list-count">to ${pct(r.churn_high)}</span></td>
      </tr>`).join("")}
    </tbody></table></div>`;
}

function render(page, rows, year, availableYears, hist, retention) {
  renderPageName(`${year} Oil Collection`);

  const { gained: gainedCustomers, ended: lostCustomers, byId } = yearBusinesses(hist, year);

  const customers = aggregateCustomers(rows);
  const monthTotals = groupSum(rows, r => r.month);
  const townTotals = groupSum(rows, r => townLabel(r.geo_town));

  const months = Object.keys(monthTotals).sort();
  const townEntries = sortedEntries(townTotals);
  const dates = rows.map(r => r.date).sort();

  const idx = availableYears.indexOf(year);
  const prev = idx > 0 ? availableYears[idx - 1] : null;
  const next = idx < availableYears.length - 1 ? availableYears[idx + 1] : null;

  // Records with a blank geo_town are out-of-state pickups. They count toward
  // gallons but are not a Vermont town, so they are excluded from the town
  // count and called out separately.
  const outOfState = rows.filter(r => !(r.geo_town || "").trim()).length;

  page.innerHTML = `
    <a class="back-link" href="index.html">← Back to the dashboard</a>
    <div class="page-subtitle">
      ${formatDate(dates[0])} – ${formatDate(dates[dates.length - 1])}
    </div>

    <div class="controls">
      <label for="year-select">Year</label>
      <select id="year-select">
        ${availableYears.map(y =>
          `<option value="${y}"${y === year ? " selected" : ""}>${y}</option>`).join("")}
      </select>
      <button id="btn-prev"${prev ? "" : " disabled"}>◀ ${prev || ""}</button>
      <button id="btn-next"${next ? "" : " disabled"}>${next || ""} ▶</button>
    </div>

    <div class="stats-bar">
      <div class="stat">
        <div class="stat-val">${formatNumber(sumGallons(rows))}</div>
        <div class="stat-label">Total Gallons</div>
      </div>
      <div class="stat">
        <div class="stat-val">${formatNumber(rows.length)}</div>
        <div class="stat-label">Pickups</div>
      </div>
      <div class="stat">
        <div class="stat-val">${formatNumber(customers.length)}</div>
        <div class="stat-label">Customers Served</div>
      </div>
      <div class="stat">
        <div class="stat-val">${formatNumber(townEntries.length)}</div>
        <div class="stat-label">Towns Served</div>
      </div>
      <div class="stat">
        <div class="stat-val small">${formatDate(dates[0])}</div>
        <div class="stat-label">First Qualifying Pickup</div>
      </div>
      <div class="stat">
        <div class="stat-val small">${formatDate(dates[dates.length - 1])}</div>
        <div class="stat-label">Last Qualifying Pickup</div>
      </div>
    </div>

    <div class="note">
      <strong>Customers Served</strong> counts customers with at least one pickup
      in ${year}. That is different from the source-site Active/Inactive status
      shown in the table below, which reflects whether the customer is currently
      on the active list.
      ${outOfState ? `<br>${formatNumber(outOfState)} pickup(s) this year were outside Vermont and are included in gallons but not in the town counts.` : ""}
    </div>

    <div class="section chart-grid">
      <div>
        <div class="chart-title">Monthly Gallons — ${year}</div>
        <div class="chart-container"><canvas id="chart-monthly"></canvas></div>
      </div>
      <div>
        <div class="chart-title">
          Top Towns — ${year}${townEntries.length > TOWN_CHART_LIMIT
            ? ` (top ${TOWN_CHART_LIMIT} of ${townEntries.length})` : ""}
        </div>
        <div class="chart-container"><canvas id="chart-towns"></canvas></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Monthly Totals</div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Month</th><th class="num">Gallons</th><th class="num">Pickups</th></tr></thead>
          <tbody>
            ${months.map(m => `
              <tr>
                <td>${escapeHtml(formatMonth(m))}</td>
                <td class="gal">${formatNumber(monthTotals[m])}</td>
                <td class="num">${formatNumber(rows.filter(r => r.month === m).length)}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Town Totals</div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th class="rank">#</th><th>Town</th><th class="num">Gallons</th><th class="num">Customers</th></tr></thead>
          <tbody>
            ${townEntries.map(([town, gallons], i) => `
              <tr>
                <td class="rank">${i + 1}</td>
                <td><a href="town.html?town=${encodeURIComponent(town)}">${escapeHtml(town)}</a></td>
                <td class="gal">${formatNumber(gallons)}</td>
                <td class="num">${formatNumber(new Set(rows.filter(r => townLabel(r.geo_town) === town).map(r => r.customer_id)).size)}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        Top Producing Customers — ${year}
        (${formatNumber(customers.length)} served)
      </div>
      <div id="year-customer-list"></div>
    </div>

    <div class="section">
      <div class="section-title">Customers Gained and Ended, Every Year</div>
      <div class="section-caption">Counted in businesses, not accounts: when a new owner takes over a
        barrel, the old business is a handover and the new one a successor, never a loss.
        <a href="former.html">Former customers</a> lists every ending.</div>
      ${retentionTableHtml(retention, year)}
    </div>

    <div class="section chart-grid yr-lists">
      <div>
        <div class="section-title">
          Customers Gained in ${year} (${formatNumber(gainedCustomers.length)})
        </div>
        ${gainedCustomers.length ? `
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>Customer</th><th>Town</th><th>First Qualifying Pickup</th><th>How</th></tr>
            </thead>
            <tbody>
              ${gainedCustomers.map(b => `
                <tr>
                  <td>${bizLink(b)}</td>
                  <td>${escapeHtml(b.town || "—")}</td>
                  <td>${formatDate(b.first_pickup)}</td>
                  <td>${b.gain_type === "successor"
                    ? `Took over from ${b.preceded_by.map(x => byId.get(x)).filter(Boolean).map(bizLink).join(", ")}`
                    : "New site"}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>` : `<div class="note">No customers had their first qualifying pickup in ${year}.</div>`}
      </div>

      <div>
        <div class="section-title">
          Customers Ended in ${year} (${formatNumber(lostCustomers.length)})
        </div>
        ${lostCustomers.length ? `
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>Customer</th><th>Town</th><th>Last Qualifying Pickup</th><th>Ended as</th><th>Site went to</th></tr>
            </thead>
            <tbody>
              ${lostCustomers.map(b => `
                <tr>
                  <td>${bizLink(b)}</td>
                  <td>${escapeHtml(b.town || "—")}</td>
                  <td>${formatDate(b.last_pickup)}</td>
                  <td>${endReasonBadge(b.end_reason)}</td>
                  <td>${b.followed_by.map(x => byId.get(x)).filter(Boolean).map(bizLink).join(", ") || "—"}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>` : `<div class="note">No customers ended in ${year}.</div>`}
      </div>
    </div>

    <div class="section">
      <div class="note">
        <strong>Active 1 Jan</strong> counts businesses served before the year began and not yet ended.
        <strong>True churn</strong> is Lost divided by Active 1 Jan; the "to" figure beside it counts every
        Unclassified ending and every move away as a loss too, so the worst case is in view.
        ${["lost", "closed", "changed_hands", "moved", "unknown"].map(r =>
          `${endReasonBadge(r)} ${escapeHtml(END_REASON_HELP[r])}.`).join(" ")}
        <br>A customer's ending year is the year of their last qualifying pickup, which can be well before
        they were marked inactive. A business that moved and kept using us is not an ending.
        * Pickup history starts in January 2015, so that year's gains include every existing customer.
      </div>
    </div>
  `;

  // Sorted by gallons descending, then capped at 50 with an expand control.
  renderExpandableCustomerList(
    document.getElementById("year-customer-list"),
    sortCustomersByGallons(customers),
    subset => customerTableHtml(subset, { town: true, county: true, dates: false })
  );

  // Bars rather than a line, with an exact-gallons tooltip on hover — matching
  // the dashboard's yearly chart. Deliberately NOT clickable.
  new Chart(
    document.getElementById("chart-monthly"),
    barChartConfig(months.map(formatMonth), months.map(m => monthTotals[m]))
  );

  const chartTowns = townEntries.slice(0, TOWN_CHART_LIMIT);
  new Chart(
    document.getElementById("chart-towns"),
    barChartConfig(chartTowns.map(e => e[0]), chartTowns.map(e => e[1]), true)
  );

  const go = y => { window.location.href = `year.html?year=${y}`; };
  document.getElementById("year-select").addEventListener("change", function () { go(this.value); });
  if (prev) document.getElementById("btn-prev").addEventListener("click", () => go(prev));
  if (next) document.getElementById("btn-next").addEventListener("click", () => go(next));
}

init();
</script>

</body>
</html>
