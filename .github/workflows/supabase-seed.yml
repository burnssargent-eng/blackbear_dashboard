name: Fill shared database from the source site

# Run by hand (Actions tab > this workflow > Run workflow), normally once.
# Re-reads every customer page (GET only) for the full notes, codes included,
# then fills the shared database: customers, routes, and the assigned routes
# as the starting stops. Stops are only copied into an EMPTY table, so a re-run
# never writes over routes edited on the site; it does refresh every
# customer's notes from the source site. Commits nothing: the full notes go
# only to the database.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Re-read every customer page
        run: python jamaal_customers.py --refresh

      - name: Fill the shared database
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python supabase_sync.py --seed
