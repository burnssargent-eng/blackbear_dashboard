name: Refresh Assigned Routes

# Reads the source site's Today's Routes (one page, GET only; never writes to
# it), commits the snapshot, and sets the shared database's routes to match
# (supabase_sync.py --routes: Sarge, 2026-10-26, so the site and the source
# site start each day the same during the trial). Route edits made on the site
# after that stand until the next run.
#
# Started at 7am Vermont time by the shared database itself
# (db/schema.sql, public.dispatch_morning_routes), not by a schedule here:
# GitHub started the nightly's 07:00 UTC schedule 5-7 hours late in October
# 2026. Run it by hand (Actions tab > Refresh Assigned Routes > Run workflow)
# to set the routes again later in the day.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  refresh-routes:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # On a failed read nothing is written and the job stops here, so the
      # routes are never set from an old snapshot.
      - name: Read assigned routes
        id: read
        run: |
          python jamaal_routes.py

      - name: Set the site's routes to the source site's
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python supabase_sync.py --routes

      # Commit the snapshot even when setting the routes failed (the step above
      # shows red), so the planner still gets the fresh read.
      - name: Commit the snapshot
        if: ${{ !cancelled() && steps.read.outcome == 'success' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add jamaal_routes.json
          git commit -m "Refresh assigned routes" || echo "No changes to commit"
          git push
