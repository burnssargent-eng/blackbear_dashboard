name: Takeover Dry Run

# Would the dashboard and projections come out the same if they were built
# from the site's pickups instead of the source site's? (Sarge, 2026-11-15:
# the check before the switch.) After each nightly, builds both in two copies
# of the repo, the second after supabase_sync.py --export-collections, and
# writes takeover_check.py's report to this run's summary page (Actions >
# Takeover Dry Run > the run). Commits nothing.
#
# The run fails, and GitHub emails, only when the export or a build breaks:
# that is the pipeline the switch will depend on. Differences between the two
# sides are the report's business, not a failure, until the drivers enter
# every stop on the site.
on:
  workflow_run:
    workflows: ["Nightly Oil Data Update"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: takeover-dry-run
  cancel-in-progress: true

env:
  TAKEOVER_SINCE: "2026-10-26"   # the first day both sides hold every pickup (backfilled 2026-11-13)

jobs:
  dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Two copies of the repo
        run: |
          rsync -a --exclude .git ./ ../jamaal/
          rsync -a --exclude .git ./ ../site/

      - name: Build from the source site's pickups
        working-directory: ../jamaal
        run: |
          python oil_scraper.py
          python analysis/build_projection_table.py --today

      - name: Export the site's pickups
        working-directory: ../site
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python supabase_sync.py --export-collections --since "$TAKEOVER_SINCE"

      - name: Build from the site's pickups
        working-directory: ../site
        run: |
          python oil_scraper.py
          python analysis/build_projection_table.py --today

      - name: Compare
        run: |
          python takeover_check.py ../jamaal ../site --since "$TAKEOVER_SINCE"
