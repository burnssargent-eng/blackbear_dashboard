name: Nightly Oil Data Update

# Since the cutover from the source site (CUTOVER.md) every pickup comes from
# the site: nothing here reads the source site any more.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shared with any workflow that commits to main (refresh-routes.yml did until the cutover).
concurrency:
  group: data-commits
  cancel-in-progress: false

env:
  CUTOVER_SINCE: "2026-10-26"   # the first day taken from the site; the takeover dry run checked from this day

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Names, towns and capacities edited on the site's customer page, for the
      # scraper (towns: regions, map, counties; roster names) and the builder
      # (capacities). On failure the committed customer_edits.csv stays.
      - name: Export customer page edits
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python supabase_sync.py --export-site-edits || { echo "::warning::Customer edits export failed; customer_edits.csv left as-is"; echo "Export customer page edits: Customer edits export failed; customer_edits.csv left as-is" >> "$RUNNER_TEMP/nightly-failures.txt"; }

      # Since the cutover (CUTOVER.md) the site is the source: its pickups and
      # 0-3 codes from CUTOVER_SINCE on replace the scrape's in
      # oil_collections_raw.csv and oil_non_pickups.csv; the history before it
      # stays as scraped. The export refuses, writing nothing, when the
      # database returns under half the pickups the file holds for the window,
      # and on any failure the committed files stay, so the rebuild below uses
      # the previous night's.
      - name: Export site collections
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python supabase_sync.py --export-collections --since "$CUTOVER_SINCE" || { echo "::warning::Site collections export failed; oil_collections_raw.csv left as-is"; echo "Export site collections: Site collections export failed; oil_collections_raw.csv left as-is" >> "$RUNNER_TEMP/nightly-failures.txt"; }

      # The dashboard files from those (a plain run: no network).
      - name: Rebuild dashboard data
        run: |
          python oil_scraper.py
      # Live test: score the newly exported pickups against the projections the
      # site was serving. Must run BEFORE the build below, while
      # oil_projections.json is still the served one. Failure-tolerant: the log
      # is left as it was.
      - name: Score live test
        run: |
          python analysis/live_test.py || { echo "::warning::Live test scoring failed; log left as-is"; echo "Score live test: Live test scoring failed; log left as-is" >> "$RUNNER_TEMP/nightly-failures.txt"; }

      # Oil Left from the shared database, for the build below. On failure the
      # committed oil_left.csv stays, so the build uses the previous export.
      - name: Export Oil Left
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python supabase_sync.py --export-oil-left || { echo "::warning::Oil Left export failed; oil_left.csv left as-is"; echo "Export Oil Left: Oil Left export failed; oil_left.csv left as-is" >> "$RUNNER_TEMP/nightly-failures.txt"; }

      # Thefts marked on the site, for the build below (its THEFTS). On failure
      # the committed thefts.csv stays, so the build uses the previous export.
      - name: Export thefts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python supabase_sync.py --export-thefts || { echo "::warning::Thefts export failed; thefts.csv left as-is"; echo "Export thefts: Thefts export failed; thefts.csv left as-is" >> "$RUNNER_TEMP/nightly-failures.txt"; }

      # Beta projections page. A failure here must never block the data commit
      # below: the previous oil_projections.json is kept, and projections.html
      # warns that it was built from an older scrape. --today dates it to
      # today, so My Route reads today's figure even after a day with no pickups.
      - name: Build projections
        run: |
          python analysis/build_projection_table.py --today || { echo "::warning::Projection build failed; oil_projections.json left as-is"; echo "Build projections: Projection build failed; oil_projections.json left as-is" >> "$RUNNER_TEMP/nightly-failures.txt"; }

      # Map pins for addresses edited on the site (the Census geocoder, else the
      # town centre). After the sync, which writes back the exported positions.
      # Writes no repo file.
      - name: Place pins for edited addresses
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python supabase_sync.py --place-pins || { echo "::warning::Pin placing failed; the next night retries"; echo "Place pins for edited addresses: Pin placing failed; the next night retries" >> "$RUNNER_TEMP/nightly-failures.txt"; }

      # A pickup after a site status (inactive, closed for the season, open)
      # ends it. Until the cutover this ran inside the source-site sync.
      - name: Clear site statuses ended by a pickup
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python supabase_sync.py --statuses || { echo "::warning::Site statuses not cleared; the next night retries"; echo "Clear site statuses ended by a pickup: Site statuses not cleared; the next night retries" >> "$RUNNER_TEMP/nightly-failures.txt"; }
      - name: Commit updated data files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add oil_data.json oil_collections.json customer_history.json oil_collections_raw.csv oil_collection_report.xlsx oil_non_pickups.csv oil_projections.json analysis/live_test_log.csv oil_live_test.json oil_left.csv customer_edits.csv thefts.csv
          git commit -m "Nightly oil data update" || echo "No changes to commit"
          git push

      # Failure alerts (Sarge, 2026-11-15). The steps above carry on when they
      # fail, so one bad step never blocks the rest or the commit, and until
      # now the run still showed green and nobody heard. Each step that
      # matters after the switch from the source site adds a line to
      # nightly-failures.txt when it fails; this step, after the commit, fails
      # the run if any did, so GitHub emails the owner and the run page lists
      # them. Since the cutover no step reads the source site.
      - name: Report failed steps
        if: always()
        run: |
          f="$RUNNER_TEMP/nightly-failures.txt"
          if [ -s "$f" ]; then
            while IFS= read -r line; do echo "::error::$line"; done < "$f"
            exit 1
          fi
          echo "No failures in the steps that alert"
