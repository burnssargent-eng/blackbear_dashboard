name: Nightly Oil Data Update

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shared with refresh-routes.yml: both commit to main, so they never run at once.
concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          python oil_scraper.py --rescrape

      # Live test: score the newly scraped pickups against the projections the
      # site was serving. Must run BEFORE the build below, while
      # oil_projections.json is still the served one. Failure-tolerant: the log
      # is left as it was.
      - name: Score live test
        run: |
          python analysis/live_test.py || echo "::warning::Live test scoring failed; log left as-is"

      # Oil Left from the shared database, for the build below. On failure the
      # committed oil_left.csv stays, so the build uses the previous export.
      - name: Export Oil Left
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python supabase_sync.py --export-oil-left || echo "::warning::Oil Left export failed; oil_left.csv left as-is"

      # Beta projections page. A failure here must never block the data commit
      # below: the previous oil_projections.json is kept, and projections.html
      # warns that it was built from an older scrape. --today dates it to
      # today, so My Route reads today's figure even after a day with no pickups.
      - name: Build projections
        run: |
          python analysis/build_projection_table.py --today || echo "::warning::Projection build failed; oil_projections.json left as-is"

      # Route planner beta: a read-only snapshot of the routes currently assigned
      # on the source site. Independent of the steps above; on failure the old
      # jamaal_routes.json stays and the planner shows its age.
      - name: Read assigned routes
        run: |
          python jamaal_routes.py || echo "::warning::Route snapshot failed; jamaal_routes.json left as-is"

      # Shadow site's Outgoing page: the source site's outgoing log (stillage
      # runs, Shop -> Gebbie Schmutz), last two months re-read. Read-only and
      # failure-tolerant like the routes snapshot.
      - name: Read outgoing log
        run: |
          python jamaal_outgoing.py || echo "::warning::Outgoing read failed; outgoing.json left as-is"

      # Shadow site customer pages and maps: address and position for customers
      # new to the Assign list. Addresses and notes live only in the shared
      # database (never committed), so the details files are first written from
      # it; the read then covers only customers the database does not have yet.
      # If the export fails, the read is skipped and the sync below refuses to
      # run, so no address is ever blanked.
      - name: Read new customers' details
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          (python supabase_sync.py --export-details && python jamaal_customers.py) || echo "::warning::Customer details read failed; the database keeps its details"

      # Shared database: the source site's customers and route names, plus a
      # report of where routes and pickups differ between the two. Never
      # writes a route stop or a pickup. Writes no repo file, so it cannot
      # affect the commit below.
      - name: Sync shared database
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python supabase_sync.py || echo "::warning::Shared database sync failed; database left as-is"

      # Photos added on the source site since last night, into the shared
      # database's private bucket (after the sync, so new customers exist).
      # Does nothing until the first copy is run by hand (jamaal-photos.yml).
      # Writes no repo file.
      - name: Copy new source-site photos
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python jamaal_photos.py --nightly || echo "::warning::Photo copy had failures; the next night retries them"

      - name: Commit updated data files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add oil_data.json oil_collections.json oil_collections_raw.csv oil_collection_report.xlsx capacity_cache.csv oil_non_pickups.csv oil_projections.json analysis/live_test_log.csv oil_live_test.json jamaal_routes.json outgoing.json oil_left.csv
          git commit -m "Nightly oil data update" || echo "No changes to commit"
          git push
